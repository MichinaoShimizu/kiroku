name: Demo

# README の「Live demo」：ダミーデータの HTML を GitHub Pages に公開する。
# ダミーデータは実行した日までの約 5 週間なので、週に 1 回作り直して「今週」が空にならないようにする。
# 使うには、リポジトリの Settings → Pages → Source を「GitHub Actions」にする。

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # トークンを .git に残さない（後のステップから読めないように）
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # 公開するページは、キャッシュを使わずに作る
      - name: Build the demo HTML
        run: |
          mkdir -p _site
          sh tools/screenshots/run.sh --html "$PWD/_site/index.html"
          python3 tools/screenshots/ogp.py _site/index.html "https://michinaoshimizu.github.io/kiroku/" # SNS のリンクカード（デモページだけ）
          cp docs/og.png _site/og.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # 公開に要る権限は、このジョブだけに渡す
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
