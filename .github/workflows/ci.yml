name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # トークンを .git に残さない（後のステップから読めないように）
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # 静的解析は結果が OS でほぼ変わらないので、速さのため Ubuntu だけ（版は固定）。
      # go run pkg@version はモジュールの外として動き、setup-go の Go（go.mod の go 行）でビルドされる。
      # 依存（x/sys など）は go.mod の toolchain の版を求めるので、同じ版で動かす
      - name: staticcheck
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=$(go env GOVERSION) go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # 既知の脆弱性（標準ライブラリと依存）を、kiroku のコードから呼ばれるものに絞って調べる。
      # 標準ライブラリは go.mod の toolchain の版で見る（リリースもこの版でビルドする）
      - name: govulncheck
        if: runner.os == 'Linux'
        run: GOTOOLCHAIN=$(go env GOVERSION) go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./...
      - run: go build -o kiroku-ci .

  # 画面の大事な流れ（週の移動・詳細・週報の下書き・検索・スマホのはみ出し）が、ブラウザで動くか
  # npm のパッケージを動かすので、Go のビルドキャッシュは使わない（ほかのジョブやリリースのキャッシュを汚させない）
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # トークンを .git に残さない（後のステップから読めないように）
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Playwright の版は tools/screenshots/package-lock.json で固定し、インストール時のスクリプトは動かさない
      - name: Install Playwright
        working-directory: tools/screenshots
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - run: sh tools/screenshots/run.sh --html "$RUNNER_TEMP/kiroku.html"
      - run: node tools/screenshots/smoke.mjs "$RUNNER_TEMP/kiroku.html"
      # 悪意のある文字列を仕込んだ履歴で、画面のどこからもスクリプトが動かないこと（XSS）
      - run: |
          python3 -I tools/screenshots/hostile.py "$RUNNER_TEMP/hostile"
          TZ=UTC go run . html --no-open --sources claude --root "$RUNNER_TEMP/hostile/fx/projects" --week 2026-10-05 -o "$RUNNER_TEMP/xss.html"
          node tools/screenshots/xss.mjs "$RUNNER_TEMP/xss.html"

  # リリースの設定が壊れていないかを、タグを打つ前に確かめる（公開はしない）
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # リリースと同じく、キャッシュを使わずにビルドする
      # GoReleaser が SBOM を作るのに使う syft を入れる（版を固定する。上げるときはここを書き換える）
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2 # 版を固定する（Dependabot は追わないので、上げるときはここを書き換える）
          args: release --snapshot --clean
      # リリースノートを抜き出す仕組みが壊れていないか（いちばん上の節で試す。Unreleased か、タグを打つ直前の版）
      - run: sh tools/release-notes.sh "$(grep -m1 '^## ' CHANGELOG.md | cut -d' ' -f2)"
      # X に投稿する下書き（Release のジョブのまとめに出す）も、同じ節から作れるか
      - run: sh tools/x-post.sh "$(grep -m1 '^## ' CHANGELOG.md | cut -d' ' -f2)"
      # リリースする版（まだタグのない、いちばん上の版の節）が、中身から決まる番号と合っているか（tools/next-version.sh）
      - name: Version matches the changelog
        run: |
          top=$(grep -m1 '^## ' CHANGELOG.md | cut -d' ' -f2)
          case "$top" in v*) ;; *) exit 0 ;; esac
          git rev-parse -q --verify "refs/tags/$top" >/dev/null && exit 0
          want=$(sh tools/next-version.sh "$top")
          if [ "${top%%-*}" != "$want" ]; then  # v0.2.0-rc.1 のようなプレリリースは v0.2.0 と比べる
            echo "::error file=CHANGELOG.md::$top の中身からすると、版は $want です（sh tools/next-version.sh $top）"
            exit 1
          fi

  # install.sh が最新のリリースを落として置けるか（macOS は shasum、Linux は sha256sum の道を通る）
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read # gh attestation verify で、リリースの出どころの証明を読む
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # トークンを .git に残さない（後のステップから読めないように）
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh tools/*.sh
      - name: install
        run: |
          KIROKU_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/kiroku" --version
      # 出どころの証明（gh attestation verify）を必ず確かめる道。gh はランナーに入っている
      - name: install (attestation required)
        env:
          GH_TOKEN: ${{ github.token }}
          KIROKU_REQUIRE_ATTESTATION: "1"
        run: |
          KIROKU_INSTALL_DIR="$RUNNER_TEMP/bin-attested" sh install.sh
          "$RUNNER_TEMP/bin-attested/kiroku" --version
