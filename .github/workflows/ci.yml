name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o kiroku-ci .

  # リリースの設定が壊れていないかを、タグを打つ前に確かめる（公開はしない）
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # リリースノートを抜き出す仕組みが壊れていないか（いちばん上の節で試す。Unreleased か、タグを打つ直前の版）
      - run: sh tools/release-notes.sh "$(grep -m1 '^## ' CHANGELOG.md | cut -d' ' -f2)"
      # リリースする版（まだタグのない、いちばん上の版の節）が、中身から決まる番号と合っているか（tools/next-version.sh）
      - name: Version matches the changelog
        run: |
          top=$(grep -m1 '^## ' CHANGELOG.md | cut -d' ' -f2)
          case "$top" in v*) ;; *) exit 0 ;; esac
          git rev-parse -q --verify "refs/tags/$top" >/dev/null && exit 0
          want=$(sh tools/next-version.sh "$top")
          if [ "$top" != "$want" ]; then
            echo "::error file=CHANGELOG.md::$top の中身からすると、版は $want です（sh tools/next-version.sh $top）"
            exit 1
          fi

  # install.sh が最新のリリースを落として置けるか（macOS は shasum、Linux は sha256sum の道を通る）
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: install
        run: |
          KIROKU_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/kiroku" --version
