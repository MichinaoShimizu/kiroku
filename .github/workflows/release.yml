name: Release

# v で始まるタグ（例: v0.1.0）を push すると、3 OS でテストしてから
# GoReleaser で各 OS 向けのファイルを作り、GitHub Releases に載せる。
# tag.yml がタグを打ったときは、ここを呼び出す（GITHUB_TOKEN で push したタグでは push の起動がかからないため）。
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # ほかのワークフロー（e2e の npm など）が書いたキャッシュでビルドしない
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # 出どころの証明（attestation）に署名するため
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # リリースノートは CHANGELOG.md のその版の節（英語）を使う。節がなければここで止まる
      - name: Release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: sh tools/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      # GoReleaser が SBOM を作るのに使う syft を入れる（版を固定する。上げるときはここを書き換える）
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2 # 版を固定する（Dependabot は追わないので、上げるときはここを書き換える）
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
      # 各ファイルが、このリポジトリのこのワークフローで作られたことの証明を残す
      # （gh attestation verify <file> --repo MichinaoShimizu/kiroku で確かめられる）
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
      # 同じ証明（Sigstore の署名つきバンドル）をリリースにも載せる。GitHub の API に届かなくても、
      # gh attestation verify <file> --repo MichinaoShimizu/kiroku --bundle <これ> で確かめられる
      - name: Attach the provenance bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          out="$RUNNER_TEMP/kiroku_${TAG#v}.sigstore.json"
          cp "$BUNDLE" "$out"
          gh release upload "$TAG" "$out" --repo "$GITHUB_REPOSITORY"

  # X に投稿する下書き。CHANGELOG のその版の節から文面を作り、X の投稿画面をその文面で開くリンクと一緒に、
  # このジョブのまとめ（Summary）に出す。投稿は人がリンクを開いて行う（X の鍵をここに置かない）。プレリリースは出さない
  announce:
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Draft a post for X
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          post=$(sh tools/x-post.sh "$TAG")
          link="https://x.com/intent/post?text=$(printf '%s' "$post" | jq -sRr @uri)"
          {
            echo "## Post $TAG on X"
            echo
            echo "Check the draft, then open the link to post it (nothing is posted automatically):"
            echo
            echo "[Open the X post box with this text]($link)"
            echo
            echo '````text'
            printf '%s\n' "$post"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
