name: Release

# v で始まるタグ（例: v0.1.0）を push すると、3 OS でテストしてから
# GoReleaser で各 OS 向けのファイルを作り、GitHub Releases に載せる。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # リリースノートは CHANGELOG.md のその版の節（英語）を使う。節がなければここで止まる
      - name: Release notes
        run: sh tools/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
