name: Feature request
description: Suggest an idea or a new agent to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to understand or improve?
      description: Describe the situation first, then the idea. English or Japanese is fine.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: markdown
    attributes:
      value: kiroku stays local-only. It reads your history on this computer and shows it with `kiroku serve` (on 127.0.0.1) or a static HTML file from `kiroku serve --html`; it runs no AI agent and sends no telemetry. Ideas that send history or anything derived from it off the machine, need a hosted service or an external API, or run an AI agent are out of scope.
