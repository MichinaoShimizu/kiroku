name: Feature request
description: Suggest an idea or a new agent to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to understand or improve?
      description: Describe the situation first, then the idea. English or Japanese is fine.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: markdown
    attributes:
      value: kiroku stays local-only, never calls an AI and outputs a single static HTML file. Ideas that need a server or an external API are out of scope.
