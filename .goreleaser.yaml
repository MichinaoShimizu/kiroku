version: 2
project_name: kiroku
before:
  hooks:
    - go mod tidy -diff
builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # 同じコミットからは同じアーカイブができるよう、入れるファイルの時刻もコミットの時刻にそろえる
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
# アーカイブごとに、中の kiroku が何でできているか（Go の版と依存モジュールとその版）を SPDX の SBOM にする。
# syft が要る（リリースのワークフローで入れる）。SBOM も checksums.txt と出どころの証明に入る
sboms:
  - artifacts: archive
checksum:
  name_template: checksums.txt
release:
  prerelease: auto # v0.1.0-rc.1 のようなタグはプレリリースにする
changelog:
  use: github
