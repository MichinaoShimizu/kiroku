<!doctype html>
<html lang="en" translate="no"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/*@style.css*/
</style></head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <a data-t class="home" id="home" href="/" title="Back to the start"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>
      <h1 class="word">kiroku</h1></a><span class="ver" id="ver" hidden></span>
      <button type="button" data-t class="live" id="live" hidden title="Updates automatically as your history grows" aria-label="LIVE"></button>
    </div>
    <label class="search"><span data-t class="sr">Search</span>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input data-t id="q" type="search" placeholder="Prompts, files, commits" aria-label="Search prompts, files and commits" autocomplete="off"><kbd>/</kbd></label>
    <button type="button" data-t class="themebtn" id="theme" aria-pressed="false" aria-label="Dark mode" title="Dark mode"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>
<main class="wrap">
  <p class="scope" id="scopebar" role="note" hidden></p>
  <section data-t class="week" aria-label="Period">
    <nav data-t class="wk" aria-label="Change period">
      <div class="lbl" aria-live="polite"><div class="y" id="ry"></div><div class="d" id="rd"></div></div>
      <div class="nav">
        <button data-t class="iconbtn" id="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button data-t class="iconbtn" id="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button data-t class="pill" id="today">This week</button>
        <div class="view-controls"><div class="control-group"><span data-t class="control-label">Period</span><div data-t class="segc mode" role="group" aria-label="Period" id="mode"><button data-t data-v="week">Week</button><button data-t data-v="month">Month</button></div></div><div class="control-group"><span data-t class="control-label">View</span><div data-t class="segc vsel" role="group" aria-label="View" id="view"><button data-t data-v="cal">Calendar</button><button data-t data-v="sum">Summary</button></div></div></div>
      </div>
    </nav>
    <div class="kpis" id="kpis"></div>
  </section>
  <div data-t class="legend" id="legend" aria-label="Legend"></div>
  <section data-t class="srbox" id="sres" aria-label="Search results" hidden></section>
  <p class="fnote" id="fnote" role="note" hidden></p>
  <a data-t class="skip" id="skipcal" href="#review">Go to the summary</a>
  <section data-t class="tlbox" id="tl" aria-label="Calendar"></section>
  <section data-t id="review"></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dkind dtitle" aria-hidden="true">
  <div class="dh"><span data-t class="sr" id="dkind">Session details</span><span data-t class="dt" id="dtop" aria-hidden="true"></span><button data-t class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
    <button data-t class="iconbtn" id="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="panel"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="hint" id="hpop" role="dialog" hidden></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="keys">
  <form method="dialog" class="dclose"><button data-t class="iconbtn" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
  <h2 data-t>Keyboard shortcuts</h2>
  <div class="keys">
    <kbd>←</kbd><span data-t>Previous week / month</span><kbd>→</kbd><span data-t>Next week / month</span><kbd>T</kbd><span data-t>Back to this week / month</span>
    <kbd>/</kbd><span data-t>Search</span><kbd>↑ ↓</kbd><span data-t>Move through search results</span>
    <kbd>W</kbd><span data-t>Week view</span><kbd>M</kbd><span data-t>Month view</span><kbd>V</kbd><span data-t>Calendar / summary</span>
    <kbd>Esc</kbd><span data-t>Close details</span><kbd>?</kbd><span data-t>This list</span>
  </div>
</dialog>
<dialog id="wk" class="wkdlg" aria-labelledby="wkh"></dialog>
<dialog id="md" class="wkdlg mdlg" aria-labelledby="mdh"></dialog>
<script>
//@js/*.js
</script></body></html>
