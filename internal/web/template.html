<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/* ── tokens ─────────────────────────────────────────────
   グラファイトの面に、インディゴを 1 色だけ。区分の色は Okabe–Ito（色覚の違いがあっても見分けやすい 8 色） */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --ink:#121419; --ink-2:#464b56; --ink-3:#5f6573;
  --rule:#e1e4ea; --rule-2:#cdd2db; --acc:#4338ca; --acc-ink:#3730a3; --on-acc:#ffffff; --acc-soft:rgba(67,56,202,.08); --warn:#b42318; --on-warn:#ffffff;
  --night:rgba(18,20,25,.035); --weekend:rgba(18,20,25,.022);
  --shadow:0 1px 2px rgba(16,18,24,.06),0 12px 32px -14px rgba(16,18,24,.22);
  --c0:#0072b2; --c1:#d55e00; --c2:#009e73; --c3:#cc79a7; --c4:#e69f00; --c5:#56b4e9; --c6:#7a5cc4; --c7:#9a8a00; --other:#9aa0ab;
  --sans:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e0f13; --surface:#16181e; --surface-2:#1e2129; --ink:#eceef3; --ink-2:#b4b9c4; --ink-3:#8c92a0;
  --rule:#252832; --rule-2:#333743; --acc:#818cf8; --acc-ink:#a5b4fc; --on-acc:#0e0f13; --acc-soft:rgba(129,140,248,.12); --warn:#f97066; --on-warn:#0e0f13;
  --night:rgba(255,255,255,.025); --weekend:rgba(255,255,255,.018);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
  --c0:#3a9be0; --c1:#f07a2b; --c2:#1fbf8f; --c3:#e08fbd; --c4:#f2b53a; --c5:#7cc6f0; --c6:#9c84e6; --c7:#c9b51c; --other:#6b7180;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f13; --surface:#16181e; --surface-2:#1e2129; --ink:#eceef3; --ink-2:#b4b9c4; --ink-3:#8c92a0;
  --rule:#252832; --rule-2:#333743; --acc:#818cf8; --acc-ink:#a5b4fc; --on-acc:#0e0f13; --acc-soft:rgba(129,140,248,.12); --warn:#f97066; --on-warn:#0e0f13;
  --night:rgba(255,255,255,.025); --weekend:rgba(255,255,255,.018);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
  --c0:#3a9be0; --c1:#f07a2b; --c2:#1fbf8f; --c3:#e08fbd; --c4:#f2b53a; --c5:#7cc6f0; --c6:#9c84e6; --c7:#c9b51c; --other:#6b7180;
}

/* ── base ───────────────────────────────────────────────── */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1560px;margin:0 auto;padding:0 28px}

/* ── header ─────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:10;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:28px;height:28px;flex:none}
.word{font:700 16px/1 var(--sans);letter-spacing:-.01em}
.tag{font-size:11.5px;color:var(--ink-3);padding-left:10px;margin-left:2px;border-left:1px solid var(--rule-2);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--sans);letter-spacing:.12em;color:var(--acc-ink);background:var(--acc-soft);border-radius:99px;padding:5px 8px 5px 7px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2.4s var(--ease) infinite}
.live.off{color:var(--ink-3);background:var(--surface-2)} .live.off::before{animation:none;opacity:.5}
.live[hidden]{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2);transition:background .2s var(--ease),color .2s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.pill{height:30px;padding:0 12px;border:1px solid var(--rule-2);border-radius:8px;font-size:12px;color:var(--ink-2);background:var(--surface);transition:all .2s var(--ease);white-space:nowrap}
.pill:hover{border-color:var(--ink-3);color:var(--ink)}
.segc{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.segc button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--ink-2);transition:all .2s var(--ease);white-space:nowrap}
.segc button:hover{color:var(--ink)}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.search{position:relative}
.search input{width:220px;height:32px;border-radius:9px;border:1px solid var(--rule-2);background:var(--surface);padding:0 30px 0 32px;font-size:12.5px;transition:border-color .2s,width .3s var(--ease)}
.search input:focus{outline:none;border-color:var(--acc);width:260px}
.search svg{position:absolute;left:10px;top:8px;color:var(--ink-3)}
.search kbd{position:absolute;right:8px;top:7px}
kbd{font:11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-3);background:var(--surface)}

/* ── week strip ─────────────────────────────────────────── */
.week{display:flex;align-items:flex-end;gap:28px;padding:26px 0 18px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:6px}
.wk .lbl{min-width:0}
.wk .y{font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--acc-ink);text-transform:uppercase}
.wk .d{font:700 30px/1.1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:6px}
.wk .d span{color:var(--ink-3);font-weight:500;margin:0 .18em}
.wk .nav{display:flex;gap:4px;align-self:flex-end;margin-left:10px}
.kpis{display:flex;gap:0;margin-left:auto;border:1px solid var(--rule);border-radius:14px;background:var(--surface);overflow:hidden}
.kpi{padding:10px 18px 9px;min-width:118px;border-left:1px solid var(--rule)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:11px;color:var(--ink-3);white-space:nowrap}
.kpi .v{font:700 20px/1.3 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi.alert .v{color:var(--warn)}

/* ── legend ─────────────────────────────────────────────── */
.legend{display:flex;align-items:center;gap:6px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend .lab{font-size:11px;letter-spacing:.08em;color:var(--ink-3);margin-right:4px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 9px;border-radius:7px;font-size:12px;color:var(--ink-2);border:1px solid var(--rule);background:var(--surface);transition:all .2s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--rule-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45}.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.legend .count{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:12px}

/* ── week calendar（曜日が列、時刻が縦） ───────────────── */
.tlbox{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden;position:relative}
.calscroll{overflow:auto;max-height:min(74vh,880px);scrollbar-width:thin;overscroll-behavior:contain}
.calin{min-width:720px;position:relative}
.heads,.cgrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.heads{position:sticky;top:0;z-index:4;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.head{padding:10px 12px 9px;border-left:1px solid var(--rule);min-width:0}
.head .dd{display:flex;align-items:baseline;gap:6px}
.head b{font:700 17px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.head i{font-style:normal;font-size:11px;color:var(--ink-3)}
.head small{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
.head.today{box-shadow:inset 0 -2px 0 var(--acc)}
.head.today b,.head.today i{color:var(--acc-ink)}
.hours{position:sticky;left:0;z-index:3;background:var(--surface)}
.heads>div:first-child{position:sticky;left:0;z-index:5;background:var(--surface)}
.hours span{position:absolute;right:9px;transform:translateY(-50%);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hours span.now{right:4px;color:var(--on-acc);background:var(--acc);border-radius:5px;padding:1px 4px;font-weight:600;z-index:3}
.day{position:relative;border-left:1px solid var(--rule);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% var(--hh)}
.day.we{background-color:var(--weekend)}
.day.today{background-color:var(--acc-soft)}
.day .nb{position:absolute;left:0;right:0;background:var(--night);pointer-events:none}
.run{position:absolute;border-radius:8px;padding:4px 7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  background:color-mix(in oklab,var(--c) var(--fill),var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 55%,transparent);
  font-size:11px;line-height:1.3;color:var(--ink);text-align:left;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .25s var(--ease),filter .25s;
  animation:rise .5s var(--ease) both;animation-delay:var(--delay,0ms)}
.run.thin{padding:0;border-radius:4px}
.run .t{display:flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.run .t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.run .t span{overflow:hidden;text-overflow:ellipsis}
.run .m{color:var(--ink-2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.run:hover{box-shadow:inset 0 0 0 1.5px var(--c),var(--shadow);z-index:2}
.tlbox.focus .run{opacity:.25;filter:saturate(.5)}
.tlbox.focus .run.sel{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--c),var(--shadow);z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--acc);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.empty{padding:56px 16px 60px;text-align:center;color:var(--ink-3)}
.empty svg{width:56px;height:56px;color:var(--rule-2);stroke-width:1.2}
.empty p{margin:10px 0 0}

/* tooltip */
.tip{position:fixed;z-index:40;pointer-events:none;max-width:300px;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px;color:color-mix(in oklab,var(--bg) 72%,transparent);font-variant-numeric:tabular-nums}
.tip .r i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ── review（ふりかえり：判断・参照値・かたち の 3 列） ──── */
.rvhead{display:flex;align-items:baseline;gap:14px;padding:40px 0 16px;flex-wrap:wrap}
.rvhead h2{font:700 22px/1.2 var(--sans);letter-spacing:-.02em;margin:0}
.rvhead p{margin:0;color:var(--ink-3);font-size:12.5px}
.rvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;padding-bottom:48px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 22px 22px;min-width:0}
.panel.decide{border-color:color-mix(in oklab,var(--acc) 35%,var(--rule))}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ph .no{font:700 11px/22px var(--sans);width:22px;height:22px;border-radius:7px;text-align:center;background:var(--ink);color:var(--bg)}
.panel.decide .ph .no{background:var(--acc);color:var(--on-acc)}
.ph b{font:700 14px/1.3 var(--sans)}
.ph span{font-size:11.5px;color:var(--ink-3)}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;display:flex;align-items:center;gap:8px;font-weight:600}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
h2{font:700 19px/1.4 var(--sans);margin:6px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
h3{font:600 12px/1.2 var(--sans);color:var(--ink-2);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.hero{margin:10px 0 4px}
.hero .big{display:flex;align-items:baseline;gap:2px}
.hero .big .num{font:700 40px/1 var(--sans);letter-spacing:-.04em}
.hero .big .u{font:500 14px var(--sans);color:var(--ink-2);margin:0 6px 0 3px}
.hero .cap{color:var(--ink-2);margin-top:8px;font-size:12.5px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 8px;margin-left:8px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{padding:11px 12px 10px;border-radius:10px;background:var(--surface-2)}
.stat:last-child:nth-child(odd){grid-column:1/-1}
.stat .k{font-size:11.5px;color:var(--ink-3)}
.stat .v{font:700 19px/1.3 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:2px}
.stat .s{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.5;margin-top:2px}
.rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:128px;padding-top:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:default;min-width:0}
.colbar{width:100%;max-width:28px;border-radius:6px;background:var(--acc);display:flex;flex-direction:column-reverse;overflow:hidden;min-height:2px;opacity:.85;transition:opacity .2s}
.colbar .nt{background:repeating-linear-gradient(135deg,var(--acc) 0 2px,color-mix(in oklab,var(--acc) 40%,var(--surface)) 2px 4px)}
.col:hover .colbar{opacity:1}
.col .l{font-size:11px;color:var(--ink-3)}
.col.today .l{color:var(--acc-ink);font-weight:700}
.col .v{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;height:14px}
.keyrow{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:12px;justify-content:flex-end}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:var(--acc);opacity:.85}
.keyrow i.nt{background:repeating-linear-gradient(135deg,var(--acc) 0 2px,color-mix(in oklab,var(--acc) 40%,var(--surface)) 2px 4px)}
.stack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-bottom:10px}
.stack span{background:var(--c);min-width:2px}
.prow{display:grid;grid-template-columns:12px 1fr auto 40px;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.prow i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tm{color:var(--ink-2);font-variant-numeric:tabular-nums}
.prow .pc{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.focusrow{display:grid;grid-template-columns:86px 1fr 62px;gap:10px;align-items:center;padding:4px 0;font-size:12px}
.focusrow .when{color:var(--ink-2);font-variant-numeric:tabular-nums}
.focusrow .track2{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.focusrow .track2 span{display:block;height:100%;background:var(--c);border-radius:3px}
.focusrow .len{text-align:right;font-variant-numeric:tabular-nums}
.card{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;transition:all .2s var(--ease);background:var(--surface)}
.card:hover{border-color:var(--rule-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card .ti{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .me{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.tagx{font-size:11px;color:var(--warn);background:color-mix(in oklab,var(--warn) 10%,transparent);border-radius:4px;padding:0 6px}
.none{color:var(--ink-3);font-size:12.5px}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3);line-height:1.75}
.code{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--surface-2);border-radius:8px;padding:7px 8px 7px 11px;font:11.5px/1.5 var(--mono);color:var(--ink-2)}
.code code{flex:1;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.copy{font:11px var(--sans);color:var(--ink-2);border:1px solid var(--rule-2);border-radius:6px;padding:3px 8px;background:var(--surface);flex:none}
.copy:hover{color:var(--ink);border-color:var(--ink-3)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.back:hover{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta span{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 9px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.mini>div{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.mini .k{font-size:11px;color:var(--ink-3)}
.mini .v{font:700 18px/1.3 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}.mini .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:1px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:44px;top:6px;bottom:6px;width:1px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:38px 1fr;gap:18px;padding:5px 0;position:relative;font-size:12.5px;line-height:1.6}
.tl li::before{content:"";position:absolute;left:41px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--c)}
.tl li.fix::before{background:var(--warn);box-shadow:none}
.tl time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.tl p{margin:0;overflow-wrap:anywhere}
.more{font-size:12px;color:var(--ink-3);margin:6px 0 0 56px}
.trow{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.trow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.trow .track2{height:6px;border-radius:3px;background:var(--surface-2)}
.trow .track2 span{display:block;height:100%;border-radius:3px;background:var(--ink-3)}
.trow .n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.files{list-style:none;padding:0;margin:0;font:11.5px/1.7 var(--mono);color:var(--ink-2)}
.files li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.files li span{direction:ltr;unicode-bidi:plaintext}

/* 判断の流れ */
.focuscard{margin:12px 0 4px;padding:16px 16px 14px;border-radius:12px;background:var(--acc-soft);position:relative}
.focuscard .csf{font:700 16px/1.4 var(--sans);margin:4px 0 10px}
.focuscard .mlabel{font-size:12px;color:var(--ink-2)}
.focuscard .row2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.focuscard .val{display:flex;align-items:baseline;gap:4px}
.focuscard .val .num{font:700 40px/1.05 var(--sans);letter-spacing:-.04em}
.focuscard .val .u{font:500 14px var(--sans);color:var(--ink-2)}
.focuscard .meta2{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.focuscard .note{margin-top:8px}
.spark{width:132px;height:44px;flex:none;overflow:visible}
.spark .ln{fill:none;stroke:var(--acc);stroke-width:1.75}
.spark .md{stroke:var(--rule-2);stroke-dasharray:3 3}
.spark .pt{fill:var(--surface);stroke:var(--acc);stroke-width:1.5}
.spark .cur{fill:var(--acc);stroke:var(--acc)}
.choose{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.choose li{font-size:12.5px;padding:7px 10px;border:1px dashed color-mix(in oklab,var(--acc) 35%,var(--rule-2));border-radius:8px;display:flex;justify-content:space-between;gap:8px;background:var(--surface)}
.choose li span:last-child{color:var(--ink-3);font-size:11.5px;text-align:right}
.steps{counter-reset:step}
.step h3::before{counter-increment:step;content:counter(step,lower-alpha);font:700 10.5px/18px var(--sans);width:18px;height:18px;border-radius:6px;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.grow{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.grow:last-of-type{border-bottom:0}
.grow .nm{min-width:0}
.grow .nm small{display:block;color:var(--ink-3);font-size:11px;line-height:1.5}
.grow .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grow .v small{color:var(--ink-3);margin-left:3px}
.state{font-size:11px;border-radius:6px;padding:1px 8px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.state.over{background:var(--warn);color:var(--on-warn);font-weight:600}
.state.building,.state.unknown{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-3)}
.mlist{list-style:none;padding:0;margin:0;font-size:12px;color:var(--ink-2)}
.mlist li{padding:3px 0;display:flex;gap:8px}
.mlist li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-top:8px;flex:none}
.mlist li.warn::before{background:var(--warn)}
.decision{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--surface)}
.decision dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:8px 0 0;font-size:12.5px}
.decision dt{color:var(--ink-3)}
.decision dd{margin:0;overflow-wrap:anywhere}
.dchip{display:inline-block;font:600 12px var(--sans);padding:2px 10px;border-radius:6px;background:var(--acc);color:var(--on-acc)}
.dchip.none{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule-2);font-weight:500}
.due{font-size:11px;color:var(--warn);margin-left:8px}
.optrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.optrow span{font-size:11.5px;border:1px solid var(--rule-2);border-radius:6px;padding:1px 9px;color:var(--ink-2)}
/* エージェント別 */
.ngroup{border:1px solid var(--rule);border-radius:12px;padding:10px 14px 6px;margin-bottom:10px}
.ngroup .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.ngroup .hd b{font:600 13px var(--sans)}
.ngroup .hd span{font-size:11px;color:var(--ink-3)}
.nrow{display:grid;grid-template-columns:1fr auto 52px;gap:10px;padding:5px 0;border-top:1px dashed var(--rule);font-size:12.5px;align-items:baseline}
.nrow .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.nrow .n{font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
/* AI の使い方 */
.mrow{display:grid;grid-template-columns:1fr auto 40px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mrow .nm i{width:9px;height:9px;border-radius:3px;background:var(--acc);opacity:var(--o);flex:none}
.mrow .tm{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.mrow .tm small{color:var(--ink-3);margin-left:6px}
.mrow .pc{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mstack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-bottom:8px}
.mstack span{background:var(--acc);opacity:var(--o);min-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 9px;font-variant-numeric:tabular-nums}
.chips span b{font-weight:600;color:var(--ink);margin-left:4px}
.chips span.mono{font-family:var(--mono);font-size:11px}
.sub{padding:9px 0 10px;border-bottom:1px solid var(--rule)}
.sub:last-child{border-bottom:0}
.sub .hd{display:flex;align-items:center;gap:8px;font-size:12.5px}
.sub .ty{font:600 11px var(--mono);color:var(--ink);background:var(--surface-2);border-radius:5px;padding:1px 7px;flex:none}
.sub .ds{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.sub .bg{font-size:10.5px;color:var(--acc-ink);flex:none}
.sub .lane{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin:8px 0 6px}
.sub .lane span{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c);min-width:3px}
.sub .ft{display:flex;gap:12px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.note{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.7}

/* ── drawer（セッションの詳細） ──────────────────────────── */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.28);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(480px,100vw);background:var(--surface);border-left:1px solid var(--rule);box-shadow:-24px 0 60px -30px rgba(0,0,0,.45);
  transform:translateX(102%);transition:transform .32s var(--ease);display:flex;flex-direction:column}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px 24px;border-bottom:1px solid var(--rule)}
.drawer .db{overflow:auto;padding:20px 24px 40px;flex:1;scrollbar-width:thin}

/* toast & dialog */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:all .25s var(--ease);z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:16px;padding:26px 28px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,16,.35);backdrop-filter:blur(3px)}
dialog h2{margin-top:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:12.5px;margin-top:14px;align-items:center}
.keys kbd{justify-self:start}

/* ── responsive ─────────────────────────────────────────── */
@media (max-width:1320px){.rvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel.shape{grid-column:1/-1}}
@media (max-width:1180px){.tag{display:none}.kpis{margin-left:0;width:100%}.kpi{flex:1;min-width:0}}
@media (max-width:1000px){#colorBy{display:none}.search kbd{display:none}.search input,.search input:focus{width:160px}}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .bar{height:54px;gap:8px}
  .zoom{display:none}
  .search input,.search input:focus{width:120px}
  .week{padding:18px 0 14px;gap:14px}
  .wk .d{font-size:24px}
  .kpis{display:grid;grid-template-columns:1fr 1fr}
  .kpi{border-left:0;border-top:1px solid var(--rule)}
  .kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--rule)}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .calin{min-width:660px}
  .calscroll{max-height:70vh}
  .rvgrid{grid-template-columns:minmax(0,1fr)}
  .panel{padding:18px 16px}
  .drawer .db{padding:18px 16px 40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.run{border:1px solid CanvasText}}
</style></head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>
      <span class="word">kiroku</span><span class="tag">AIと過ごした時間の記録</span>
      <span class="live" id="live" hidden title="履歴が増えると自動で反映します">LIVE</span>
    </div>
    <div class="segc" role="group" aria-label="色分け" id="colorBy">
      <button data-v="project">プロジェクト</button><button data-v="branch">ブランチ</button><button data-v="source">ツール</button>
    </div>
    <div class="segc zoom" role="group" aria-label="ズーム">
      <button id="zout" aria-label="縮小">−</button><button id="zin" aria-label="拡大">＋</button>
    </div>
    <label class="search"><span class="sr">検索</span>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="タイトル・依頼文で探す" autocomplete="off"><kbd>/</kbd></label>
    <button class="iconbtn" id="theme" aria-label="テーマを切り替え"></button>
    <button class="iconbtn" id="help" aria-label="ショートカット"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/></svg></button>
  </div>
</header>
<main class="wrap">
  <section class="week" aria-label="週">
    <nav class="wk" aria-label="週の移動">
      <div class="lbl" aria-live="polite"><div class="y" id="ry"></div><div class="d" id="rd"></div></div>
      <div class="nav">
        <button class="iconbtn" id="prev" aria-label="前の週"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="next" aria-label="次の週"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="pill" id="today">今週</button>
      </div>
    </nav>
    <div class="kpis" id="kpis"></div>
  </section>
  <div class="legend" id="legend" aria-label="凡例"></div>
  <section class="tlbox" id="tl" aria-label="週のカレンダー"></section>
  <section id="review" aria-live="polite"></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="セッションの詳細" aria-hidden="true">
  <div class="dh"><button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>週のふりかえりへ</button>
    <button class="iconbtn" id="close" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="panel"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="keys">
  <div class="eyebrow">Shortcuts</div><h2>キーボード操作</h2>
  <div class="keys">
    <kbd>←</kbd><span>前の週</span><kbd>→</kbd><span>次の週</span><kbd>T</kbd><span>今週に戻る</span>
    <kbd>/</kbd><span>検索</span><kbd>+</kbd><span>拡大（<kbd>−</kbd> で縮小）</span>
    <kbd>Esc</kbd><span>詳細を閉じる</span><kbd>?</kbd><span>この一覧</span>
  </div>
  <form method="dialog" style="margin-top:22px;text-align:right"><button class="pill">閉じる</button></form>
</dialog>
<script>
let DATA = __DATA__;
let WEEKS = __WEEKS__;
let META = __META__;
let GENERATED = __GEN__;
const LIVE = __LIVE__; // kiroku --serve で開いたとき true
const DOW = ["日","月","火","水","木","金","土"], SLOTS = 8;
const $ = s => document.querySelector(s);
const store = { get(k,d){ try { const v = localStorage.getItem("kiroku:"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k,v){ try { localStorage.setItem("kiroku:"+k, JSON.stringify(v)); } catch(e){} } };
const st = { z: store.get("zh", 2), colorBy: store.get("colorBy", "project"), theme: store.get("theme", "auto"),
             week: mondayOf(new Date()), hidden: new Set(), sel: null, q: "", animate: true };

/* ── helpers ── */
function mondayOf(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function addDays(d,n){ d = new Date(d); d.setDate(d.getDate()+n); return d; }
function key(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hm(t){ return new Date(t*1000).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}); }
function md(t){ const d = new Date(t*1000); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function dur(m, html){ m = Math.round(m); const h = Math.floor(m/60), r = m%60;
  if (!html) return h ? `${h}時間${r ? String(r).padStart(2,"0")+"分" : ""}` : `${r}分`;
  return h ? `${h}<small>時間</small>${r ? String(r).padStart(2,"0")+"<small>分</small>" : ""}` : `${r}<small>分</small>`; }
function tok(n){ n = n || 0; return n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"K" : String(n); }
function usd(v){ return v == null ? "—" : v > 0 && v < 0.01 ? "<$0.01" : "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2)); }
function shade(i){ return [1,.72,.5,.34,.22,.14][Math.min(i,5)]; }
function secs(v){ return v == null ? "—" : v < 60 ? `${v}秒` : `${Math.floor(v/60)}分${String(v%60).padStart(2,"0")}秒`; }
function isoWeek(d){ d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate()+4-n);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(((d-y0)/864e5+1)/7); }
const keyOf = s => st.colorBy === "project" ? s.project : st.colorBy === "source" ? s.source : `${s.project} · ${s.branch || "—"}`;
let slot = {};
function assignColors(){ // 全期間の多い順に固定。週を変えても、非表示にしても色は変わらない
  const n = {}; DATA.forEach(s => n[keyOf(s)] = (n[keyOf(s)]||0) + 1);
  slot = {}; Object.keys(n).sort((a,b)=>n[b]-n[a]).forEach((k,i) => slot[k] = i < SLOTS ? `var(--c${i})` : "var(--other)");
}
const colorOf = k => slot[k] || "var(--other)";
function matches(s){
  if (st.hidden.has(keyOf(s))) return false;
  if (!st.q) return true;
  return (s.title+" "+s.project+" "+(s.branch||"")+" "+s.source+" "+s.prompts.map(p=>p.text).join(" ")).toLowerCase().includes(st.q);
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("on"), 1600); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("コピーしました"); } catch(e){ toast("コピーできませんでした"); } }
const ICON = { auto:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg>',
  light:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  dark:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>' };
function applyTheme(){ const r = document.documentElement; st.theme === "auto" ? r.removeAttribute("data-theme") : r.setAttribute("data-theme", st.theme);
  $("#theme").innerHTML = ICON[st.theme]; $("#theme").setAttribute("aria-label", `テーマ: ${{auto:"自動",light:"ライト",dark:"ダーク"}[st.theme]}`); }

/* ── render ── */
const HOURS = [28, 36, 44, 56, 72, 96]; // 1 時間の高さ（ズーム）
function render(){
  assignColors();
  const ws = st.week.getTime()/1000, we = addDays(st.week,7).getTime()/1000;
  const todayKey = key(new Date()), end = addDays(st.week,6);
  $("#ry").textContent = `${st.week.getFullYear()} · Week ${isoWeek(st.week)}`;
  $("#rd").innerHTML = `${st.week.getMonth()+1}.${st.week.getDate()}<span>—</span>${end.getMonth()+1}.${end.getDate()}`;
  document.querySelectorAll("#colorBy button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.colorBy));

  const inWeek = DATA.filter(s => s.end >= ws && s.start < we);
  const shown = inWeek.filter(matches);
  kpis();
  // legend（今週あるものを多い順に）
  const cnt = {}; inWeek.forEach(s => cnt[keyOf(s)] = (cnt[keyOf(s)]||0)+1);
  $("#legend").innerHTML = `<span class="lab">${{project:"プロジェクト",branch:"ブランチ",source:"ツール"}[st.colorBy]}</span>` +
    Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k => `<button class="chip" style="--c:${colorOf(k)}" data-k="${esc(k)}" aria-pressed="${!st.hidden.has(k)}"><span class="dot"></span>${esc(k)}<span class="n">${cnt[k]}</span></button>`).join("") +
    `<span class="count">${shown.length} / ${inWeek.length} セッション</span>`;
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { const k = c.dataset.k; st.hidden.has(k) ? st.hidden.delete(k) : st.hidden.add(k); render(); });

  timeline(shown, inWeek, ws, we, todayKey);
  summary();
  const s = st.sel && DATA.find(x => x.id === st.sel);
  if (st.sel && !s) st.sel = null;
  if (s) detail(s);

/* 週のカレンダー：曜日が列、時刻が縦。重なるセッションだけ横に並べる */
function timeline(shown, inWeek, ws, we, todayKey){
  const T = $("#tl"), hh = HOURS[st.z] || 44, H = 24*hh;
  if (!inWeek.length || !shown.length){
    T.innerHTML = `<div class="empty"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><p>${inWeek.length ? "条件に合うセッションはありません" : "この週の記録はありません。← → で週を移動できます"}</p></div>`;
    return;
  }
  const keep = T.querySelector(".calscroll"), top = keep ? keep.scrollTop : null;
  const nowS = Date.now()/1000, w = WEEKS[key(st.week)];
  let heads = '<div></div>', hours = "", cols = "";
  for (let h=1; h<24; h++) hours += `<span style="top:${h*hh}px">${String(h).padStart(2,"0")}:00</span>`;
  if (nowS >= ws && nowS < we){ const d0 = new Date(nowS*1000); d0.setHours(0,0,0,0); hours += `<span class="now" style="top:${(nowS - d0.getTime()/1000)/3600*hh}px">${hm(nowS)}</span>`; }
  const runs = [];
  for (let d=0; d<7; d++){
    const day = addDays(st.week,d), ds = day.getTime()/1000, de = addDays(st.week,d+1).getTime()/1000, isToday = key(day) === todayKey;
    const act = w && w.days[d] ? w.days[d].active : 0;

    const blocks = [];
    shown.forEach(s => s.segs.forEach(([a,b,n]) => { const x = Math.max(a,ds), y = Math.min(b,de); if (y > x) blocks.push({s, a:x, b:y, n}); }));
    blocks.sort((p,q) => p.a-q.a || q.b-p.b);
    // 重なるものだけ横に並べる（かたまりごとに列の数を決める）
    let cluster = [], cEnd = -1;
    const flush = () => { const lanes = []; cluster.forEach(bk => { let i = lanes.findIndex(e => e <= bk.a); if (i<0){ i = lanes.length; lanes.push(0); } lanes[i] = bk.b; bk.lane = i; }); cluster.forEach(bk => bk.L = lanes.length); cluster = []; };
    blocks.forEach(bk => { if (bk.a >= cEnd){ flush(); cEnd = bk.b; } else cEnd = Math.max(cEnd, bk.b); cluster.push(bk); }); flush();
    let html = `<div class="nb" style="top:0;height:${6*hh}px"></div><div class="nb" style="top:${22*hh}px;height:${2*hh}px"></div>`;
    blocks.forEach((bk, j) => {
      const y = (bk.a-ds)/3600*hh, h = Math.max(4, (bk.b-bk.a)/3600*hh - 2), mins = (bk.b-bk.a)/60;
      const dens = Math.min(1, bk.n / Math.max(1, mins) / 2.5), id = runs.length;
      runs.push(bk);
      html += `<button class="run${h < 16 ? " thin" : ""}${st.sel === bk.s.id ? " sel" : ""}" data-r="${id}" style="top:${y}px;height:${h}px;left:calc(${bk.lane/bk.L*100}% + 3px);width:calc(${100/bk.L}% - 6px);--c:${colorOf(keyOf(bk.s))};--fill:${Math.round(16+30*dens)}%;${st.animate?`--delay:${d*30+Math.min(j,14)*10}ms`:"animation:none"}" aria-label="${esc(`${bk.s.title}、${bk.s.project}、${md(bk.a)} ${hm(bk.a)}から${hm(bk.b)}`)}">${h >= 20 ? `<span class="t"><span>${esc(bk.s.title)}</span></span>` + (h >= 38 ? `<span class="m">${hm(bk.a)}–${hm(bk.b)} · ${esc(bk.s.project)}</span>` : "") : ""}</button>`;
    });
    if (isToday && nowS >= ds && nowS < de) html += `<div class="nowline" style="top:${(nowS-ds)/3600*hh}px"></div>`;
    cols += `<div class="day${day.getDay()%6===0?" we":""}${isToday?" today":""}" style="height:${H}px">${html}</div>`;
  }
  T.innerHTML = `<div class="calscroll" style="--hh:${hh}px"><div class="calin"><div class="heads">${heads}</div><div class="cgrid"><div class="hours" style="height:${H}px">${hours}</div>${cols}</div></div></div>`;
  if (top != null) T.querySelector(".calscroll").scrollTop = top;
  T.querySelectorAll(".run").forEach(el => { const bk = runs[+el.dataset.r];
    el.onclick = e => { e.stopPropagation(); select(bk.s.id); };
    el.onmouseenter = e => tipOn(e, bk); el.onmousemove = tipMove; el.onmouseleave = tipOff; });
}

function fmtM(k, v){ if (v == null) return "不明"; const u = META.metrics[k].unit;
  return u === "分" ? dur(v) : u === "$" ? (v < 1 ? "$"+v.toFixed(3) : usd(v)) : `${v}${u}`; }
function bigM(k, v){ if (v == null) return `<span class="num">不明</span>`; const u = META.metrics[k].unit;

  return `<span class="num">${v}</span><span class="u">${u}</span>`; }
function spark(series, median){

    ${series.map((p,i)=> p[1]==null ? "" : `<circle class="pt${i===series.length-1?" cur":""}" cx="${x(i)}" cy="${y(p[1])}" r="${i===series.length-1?3.2:2.4}"><title>${p[0]}: ${fmtM(series.k||"",p[1])}</title></circle>`).join("")}</svg>`;

      ${u.tokens ? stat("キャッシュから読んだ割合", u.cacheHit==null ? "—" : `${Math.round(u.cacheHit*100)}<small>%</small>`, "入力のうち") : ""}
      ${stat("サブエージェント", `${u.subagents}<small>回</small>`, u.subagents ? `延べ ${dur(u.subMin)}` : "使っていません")}
      ${u.credits ? stat("Kiro クレジット", `${u.credits}`, "履歴に残った実績") : ""}
    </div>
    ${u.models.length ? `<div style="margin-top:16px" class="k muted">モデル別${byCost ? "（目安コスト）" : "（トークン）"}</div>
      <div class="mstack" style="margin-top:8px">${u.models.map((r,i)=>`<span style="flex:${byCost?r[1]:r[2]};--o:${shade(i)}" title="${esc(r[0])}"></span>`).join("")}</div>
      ${u.models.slice(0,6).map((r,i)=>`<div class="mrow"><span class="nm"><i style="--o:${shade(i)}"></i>${esc(r[0])}</span><span class="tm">${usd(r[1])}<small>${tok(r[2])}</small></span><span class="pc">${Math.round((byCost?r[1]/totalC:r[2]/totalT)*100)}%</span></div>`).join("")}` : ""}
    ${u.subTypes.length ? `<div style="margin-top:14px" class="chips">${u.subTypes.map(([k,v])=>`<span class="mono">${esc(k)}<b>${v}</b></span>`).join("")}</div>` : ""}
    ${u.heavy.length ? `<div style="margin-top:16px" class="k muted">重かったセッション</div><div style="margin-top:8px">${u.heavy.map(h=>`<button class="card" data-id="${esc(h.id)}"><span class="ti">${esc(h.title)}</span><span class="me">${md(h.start)} · ${esc(h.project)} · ${usd(h.cost)}${h.subagents?` · サブエージェント ${h.subagents}`:""}</span></button>`).join("")}</div>` : ""}
    ${u.tokens ? `<p class="note">目安コストは、履歴のトークン数に API の公開料金をかけた換算です。サブスクリプションの請求額とは別物です。料金表は <code>--prices</code> で変えられます。</p>` : ""}`;
}
function nativeText(v){
  const num = (x, d) => Number(x.toFixed(d)).toLocaleString("ja-JP");
  return v.unit === "%" ? `${num(v.v,1)}%` : v.unit === "秒" ? `${num(v.v,1)}秒` : v.unit === "クレジット" ? `${num(v.v,2)} クレジット` : `${num(v.v,0)} ${v.unit}`;
}
function nativeRows(values){
  return values.map(v=>`<div class="nrow"><span>${esc(v.label)}</span><span class="v">${nativeText(v)}</span><span class="n">n=${v.n}</span></div>`).join("");
}
function nativeSection(w){
  if (!w.native || !w.native.length) return "";
  return `<h3>エージェント別の参考指標</h3>
    ${w.native.map(g=>`<div class="ngroup"><div class="hd"><b>${esc(g.source)}</b><span>${g.sessions} セッション</span></div>${nativeRows(g.values)}</div>`).join("")}
    <p class="note">それぞれのエージェントが記録している数字です。定義がエージェントごとに違うので、エージェント同士では比べないでください。</p>`;
}
function foot(cmd){
  return `<div class="foot">待たせ時間は、AI が返してから次の依頼を出すまで（30分以内）。切り替えは、続けて出した依頼のプロジェクトが変わった回数です。どれも履歴からの目安で、<b>自分のふりかえり用</b>。人と比べたり評価に使ったりするための数字ではありません。
    ${cmd ? `<div class="code"><code>${esc(cmd)}</code><button class="copy" data-copy="${esc(cmd)}">コピー</button></div>` : ""}
    <div style="margin-top:12px">生成 ${new Date(GENERATED*1000).toLocaleString("ja-JP")} · <button class="muted" id="openhelp" style="text-decoration:underline dotted">ショートカット</button></div></div>`;
}
function bindCopy(root){ root.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy)); const h = root.querySelector("#openhelp"); if (h) h.onclick = () => $("#keys").showModal(); }

/* ── drawer: session detail ── */
function detail(s){
  if (!s){ st.sel = null; return summary(); }
  const active = s.segs.reduce((t,[a,b])=>t+(b-a),0)/60, waits = s.waits.map(x=>x[1]).sort((a,b)=>a-b);
  const med = waits.length ? waits[Math.floor(waits.length/2)] : null, maxT = Math.max(1, ...s.tools.map(t=>t[1]));
  const sameDay = new Date(s.start*1000).toDateString() === new Date(s.end*1000).toDateString();
  const allTok = [s.usage, ...s.subagents.map(a=>a.usage)].reduce((t,u)=>t + (u ? u.in+u.out+u.cw+u.cw1h+u.cr : 0), 0);
  const P = $("#panel");
  P.innerHTML = `<div style="--c:${colorOf(keyOf(s))}">
    <div class="eyebrow"><span class="dot"></span>${esc(s.source)}</div>
    <h2>${esc(s.title)}</h2>
    <div class="muted" style="font-variant-numeric:tabular-nums">${md(s.start)} ${hm(s.start)} 〜 ${sameDay ? "" : md(s.end)+" "}${hm(s.end)}</div>
    <div class="meta"><span>${esc(s.project)}</span>${s.branch?`<span>${esc(s.branch)}</span>`:""}</div>
    <div class="mini">
      <div><div class="k">実働</div><div class="v">${dur(active,true)}</div></div>
      <div><div class="k">依頼</div><div class="v">${s.nPrompts}<small>件</small></div></div>
      <div><div class="k">待たせ（中央値）</div><div class="v">${med==null?"—":secs(med).replace(/(分|秒)/g,"<small>$1</small>")}</div></div>
      <div><div class="k">言い直し・中断</div><div class="v">${s.corrections + s.interrupts}<small>回</small></div></div>
      ${s.source === "Claude Code" ? `<div><div class="k">目安コスト</div><div class="v">${usd(s.cost).replace("$","<small>$</small>")}</div></div>
      <div><div class="k">トークン</div><div class="v">${tok(allTok)}</div></div>` : s.credits ? `<div><div class="k">Kiro クレジット</div><div class="v">${s.credits}</div></div><div><div class="k">1依頼あたり</div><div class="v">${s.nPrompts ? (s.credits/s.nPrompts).toFixed(2) : "—"}<small>クレジット</small></div></div>` : ""}
    </div>
    ${s.models.length ? `<h3>使ったモデル</h3><div class="chips">${s.models.map(([m,n])=>`<span class="mono">${esc(m)}<b>${n}</b></span>`).join("")}</div>` : ""}
    <h3>依頼の流れ</h3>
    ${s.prompts.length ? `<ol class="tl">${s.prompts.slice(0,30).map(p=>`<li class="${/違う|ちがう|そうじゃな|やり直|戻して|元に戻|取り消|じゃなくて|wrong|revert|undo/i.test(p.text)?"fix":""}"><time>${p.t?hm(p.t):""}</time><p>${esc(p.text.length>220?p.text.slice(0,220)+"…":p.text)}</p></li>`).join("")}</ol>${s.prompts.length>30?`<p class="more">ほか ${s.nPrompts-30} 件</p>`:""}` : '<p class="none">依頼の記録はありません。</p>'}
    ${s.subagents.length ? `<h3>サブエージェント · ${s.subagents.length}</h3>${s.subagents.map(a=>{
        const span = Math.max(1, s.end - s.start), l = a.start ? Math.max(0,(a.start - s.start)/span*100) : 0, w = a.start && a.end ? Math.max(.8,(a.end - a.start)/span*100) : .8;
        const t = a.usage, tt = t.in + t.out + t.cw + t.cw1h + t.cr;
        return `<div class="sub"><div class="hd"><span class="ty">${esc(a.type)}</span><span class="ds">${esc(a.desc || "（説明なし）")}</span>${a.bg?'<span class="bg">バックグラウンド</span>':""}</div>
          <div class="lane"><span style="left:${l}%;width:${Math.min(w,100-l)}%"></span></div>
          <div class="ft">${a.start?`<span>${hm(a.start)}${a.end?"–"+hm(a.end):""}</span>`:""}${a.start&&a.end?`<span>${dur((a.end-a.start)/60)}</span>`:""}${tt?`<span>${tok(tt)} トークン</span>`:t.reportedTokens?`<span>${tok(t.reportedTokens)} トークン（報告値）</span>`:""}${t.cost?`<span>${usd(t.cost)}</span>`:""}${a.model?`<span>${esc(a.model)}</span>`:""}${a.tools?`<span>ツール ${a.tools} 回</span>`:""}</div></div>`; }).join("")}` : ""}
    ${s.native && s.native.length ? `<h3>${esc(s.source)} の参考指標</h3>${nativeRows(s.native)}<p class="note">このエージェントが記録している数字です。ほかのエージェントとは定義が違います。</p>` : ""}
    <h3>使ったツール</h3>
    ${s.tools.length ? s.tools.map(([k,v])=>`<div class="trow"><span class="nm">${esc(k)}</span><span class="track2"><span style="width:${v/maxT*100}%"></span></span><span class="n">${v}</span></div>`).join("") : '<p class="none">記録なし</p>'}
    <h3>変更したファイル · ${s.nFiles}</h3>
    ${s.files.length ? `<ul class="files">${s.files.map(f=>`<li title="${esc(f)}"><span>${esc(f)}</span></li>`).join("")}</ul>` : '<p class="none">なし</p>'}
    ${s.resume ? `<h3>続きから再開</h3><div class="code"><code>${esc(s.resume)}</code><button class="copy" data-copy="${esc(s.resume)}">コピー</button></div>` : ""}
  </div>`;
  bindCopy(P);
}
function select(id){ st.sel = id; tipOff(); render(); if (id) $("#panel").scrollTop = 0; }

/* ── events ── */
function go(n){ st.week = n == null ? mondayOf(new Date()) : addDays(st.week, 7*n); st.sel = null; st.animate = true; render(); scrollToWork(); }
$("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1); $("#today").onclick = () => go(null);
$("#zin").onclick = () => zoom(1); $("#zout").onclick = () => zoom(-1);
function zoom(dv){ st.z = Math.max(0, Math.min(HOURS.length-1, st.z+dv)); store.set("zh", st.z); render(); scrollToWork(); }
document.querySelectorAll("#colorBy button").forEach(b => b.onclick = () => { st.colorBy = b.dataset.v; st.hidden.clear(); store.set("colorBy", st.colorBy); render(); });
$("#q").oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
$("#theme").onclick = () => { st.theme = {auto:"light",light:"dark",dark:"auto"}[st.theme]; store.set("theme", st.theme); applyTheme(); };
$("#help").onclick = () => $("#keys").showModal();
$("#scrim").onclick = () => select(null); $("#close").onclick = () => select(null); $("#back").onclick = () => select(null);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT"){ if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || $("#keys").open) return;
  const k = e.key;
  if (k === "ArrowLeft") go(-1); else if (k === "ArrowRight") go(1); else if (k === "t" || k === "T") go(null);
  else if (k === "/"){ e.preventDefault(); $("#q").focus(); } else if (k === "+" || k === "=") zoom(1); else if (k === "-") zoom(-1);
  else if (k === "Escape" && st.sel) select(null); else if (k === "?") $("#keys").showModal();
});
function scrollToWork(){ // その週でいちばん早く始まった時刻の少し前へ
  const sc = $("#tl .calscroll"); if (!sc) return;
  const ws = st.week.getTime()/1000, we = ws + 7*86400; let first = 24;
  DATA.forEach(s => s.segs.forEach(([a,b]) => { if (b > ws && a < we){ const d = new Date(Math.max(a,ws)*1000); first = Math.min(first, d.getHours()); } }));
  sc.scrollTop = Math.max(0, Math.max(0, (first === 24 ? 8 : first) - 1) * (HOURS[st.z] || 44) - 14);
}
// 今週に記録がなければ、いちばん新しい記録の週から開く
if (DATA.length && !WEEKS[key(st.week)]) st.week = mondayOf(new Date(DATA[DATA.length-1].end*1000));
const mq = matchMedia("(max-width:820px)"), ph = () => $("#q").placeholder = mq.matches ? "検索" : "タイトル・依頼文で探す";
mq.addEventListener("change", () => { ph(); render(); }); ph();
applyTheme(); render(); scrollToWork();

/* ── live（kiroku --serve） ── 新しい履歴を見つけたら、見ている週・選んだセッションはそのままで取り込む */
if (LIVE){
  const badge = $("#live"); badge.hidden = false;
  let busy = false;
  async function poll(){
    if (busy || document.hidden) return; busy = true;
    try {
      const r = await fetch("stamp", {cache:"no-store"}); if (!r.ok) throw new Error(r.status);
      if (parseFloat(await r.text()) !== GENERATED){
        const j = await (await fetch("data.json", {cache:"no-store"})).json(), before = DATA.length;
        DATA = j.sessions || []; WEEKS = j.weeks || {}; META = j.meta; GENERATED = j.generated;
        if (st.sel && !DATA.some(s => s.id === st.sel)) st.sel = null;
        render();
        const d = DATA.length - before;
        toast(d > 0 ? `新しいセッションを ${d} 件取り込みました` : "最新の履歴を反映しました");
      }
      badge.classList.remove("off"); badge.title = `履歴が増えると自動で反映します（最終確認 ${new Date().toLocaleTimeString("ja-JP")}）`;
    } catch(e){ badge.classList.add("off"); badge.title = "kiroku --serve とつながっていません。止めた場合は、もう一度起動すると再開します"; }
    busy = false;
  }
  setInterval(poll, 3000); document.addEventListener("visibilitychange", poll);
}
</script></body></html>
