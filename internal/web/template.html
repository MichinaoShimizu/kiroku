<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/* ── tokens ─────────────────────────────────────────────
   グラファイトの面に、インディゴを 1 色だけ。区分の色は Okabe–Ito（色覚の違いがあっても見分けやすい 8 色） */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --ink:#121419; --ink-2:#464b56; --ink-3:#5f6573;
  --rule:#e1e4ea; --rule-2:#cdd2db; --acc:#4338ca; --acc-ink:#3730a3; --on-acc:#ffffff; --heatk:22%; --acc-soft:rgba(67,56,202,.08); --warn:#b42318; --on-warn:#ffffff;
  --night:rgba(18,20,25,.035); --weekend:rgba(18,20,25,.022);
  --shadow:0 1px 2px rgba(16,18,24,.06),0 12px 32px -14px rgba(16,18,24,.22);
  --c0:#0072b2; --c1:#d55e00; --c2:#009e73; --c3:#cc79a7; --c4:#e69f00; --c5:#56b4e9; --c6:#7a5cc4; --c7:#9a8a00; --other:#9aa0ab;
  --sans:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e0f13; --surface:#16181e; --surface-2:#1e2129; --ink:#eceef3; --ink-2:#b4b9c4; --ink-3:#8c92a0;
  --rule:#252832; --rule-2:#333743; --acc:#818cf8; --acc-ink:#a5b4fc; --on-acc:#0e0f13; --heatk:42%; --acc-soft:rgba(129,140,248,.12); --warn:#f97066; --on-warn:#0e0f13;
  --night:rgba(255,255,255,.025); --weekend:rgba(255,255,255,.018);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
  --c0:#3a9be0; --c1:#f07a2b; --c2:#1fbf8f; --c3:#e08fbd; --c4:#f2b53a; --c5:#7cc6f0; --c6:#9c84e6; --c7:#c9b51c; --other:#6b7180;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f13; --surface:#16181e; --surface-2:#1e2129; --ink:#eceef3; --ink-2:#b4b9c4; --ink-3:#8c92a0;
  --rule:#252832; --rule-2:#333743; --acc:#818cf8; --acc-ink:#a5b4fc; --on-acc:#0e0f13; --heatk:42%; --acc-soft:rgba(129,140,248,.12); --warn:#f97066; --on-warn:#0e0f13;
  --night:rgba(255,255,255,.025); --weekend:rgba(255,255,255,.018);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
  --c0:#3a9be0; --c1:#f07a2b; --c2:#1fbf8f; --c3:#e08fbd; --c4:#f2b53a; --c5:#7cc6f0; --c6:#9c84e6; --c7:#c9b51c; --other:#6b7180;
}

/* ── base ───────────────────────────────────────────────── */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1560px;margin:0 auto;padding:0 28px}

/* ── header ─────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:10;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:28px;height:28px;flex:none}
.word{font:700 16px/1 var(--sans);letter-spacing:-.01em}
.tag{font-size:11.5px;color:var(--ink-3);padding-left:10px;margin-left:2px;border-left:1px solid var(--rule-2);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--sans);letter-spacing:.12em;color:var(--acc-ink);background:var(--acc-soft);border-radius:99px;padding:5px 8px 5px 7px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2.4s var(--ease) infinite}
.live.off{color:var(--ink-3);background:var(--surface-2)} .live.off::before{animation:none;opacity:.5}
.live[hidden]{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2);transition:background .2s var(--ease),color .2s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.pill{height:30px;padding:0 12px;border:1px solid var(--rule-2);border-radius:8px;font-size:12px;color:var(--ink-2);background:var(--surface);transition:all .2s var(--ease);white-space:nowrap}
.pill:hover{border-color:var(--ink-3);color:var(--ink)}
.segc{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.segc button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--ink-2);transition:all .2s var(--ease);white-space:nowrap}
.segc button:hover{color:var(--ink)}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.search{position:relative}
.search input{width:220px;height:32px;border-radius:9px;border:1px solid var(--rule-2);background:var(--surface);padding:0 30px 0 32px;font-size:12.5px;transition:border-color .2s,width .3s var(--ease)}
.search input:focus{outline:none;border-color:var(--acc);width:260px}
.search svg{position:absolute;left:10px;top:8px;color:var(--ink-3)}
.search kbd{position:absolute;right:8px;top:7px}
kbd{font:11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-3);background:var(--surface)}

/* ── week strip ─────────────────────────────────────────── */
.week{display:flex;align-items:flex-end;gap:28px;padding:26px 0 18px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:6px}
.wk .lbl{min-width:0}
.wk .y{font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--acc-ink);text-transform:uppercase}
.wk .d{font:700 30px/1.1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:6px}
.wk .d span{color:var(--ink-3);font-weight:500;margin:0 .18em}
.wk .nav{display:flex;gap:4px;align-self:flex-end;margin-left:10px}
.kpis{display:flex;gap:0;margin-left:auto;border:1px solid var(--rule);border-radius:14px;background:var(--surface);overflow:hidden}
.kpi{padding:10px 18px 9px;min-width:118px;border-left:1px solid var(--rule)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:11px;color:var(--ink-3);white-space:nowrap}
.kpi .v{font:700 20px/1.3 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi.alert .v{color:var(--warn)}

/* ── legend ─────────────────────────────────────────────── */
.legend{display:flex;align-items:center;gap:6px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend .lab{font-size:11px;letter-spacing:.08em;color:var(--ink-3);margin-right:4px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 9px;border-radius:7px;font-size:12px;color:var(--ink-2);border:1px solid var(--rule);background:var(--surface);transition:all .2s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--rule-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45}.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.legend .count{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:12px}

/* ── week calendar（曜日が列、時刻が縦） ───────────────── */
.tlbox{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden;position:relative}
.calscroll{overflow:auto;max-height:min(74vh,880px);scrollbar-width:thin;overscroll-behavior:contain}
.calin{min-width:720px;position:relative}
.heads,.cgrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.heads{position:sticky;top:0;z-index:4;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.head{padding:10px 12px 9px;border-left:1px solid var(--rule);min-width:0}
.head .dd{display:flex;align-items:baseline;gap:6px}
.head b{font:700 17px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.head i{font-style:normal;font-size:11px;color:var(--ink-3)}
.head small{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
.head.today{box-shadow:inset 0 -2px 0 var(--acc)}
.head.today b,.head.today i{color:var(--acc-ink)}
.hours{position:sticky;left:0;z-index:3;background:var(--surface)}
.heads>div:first-child{position:sticky;left:0;z-index:5;background:var(--surface)}
.hours span{position:absolute;right:9px;transform:translateY(-50%);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hours span.now{right:4px;color:var(--on-acc);background:var(--acc);border-radius:5px;padding:1px 4px;font-weight:600;z-index:3}
.day{position:relative;border-left:1px solid var(--rule);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% var(--hh)}
.day.we{background-color:var(--weekend)}
.day.today{background-color:color-mix(in oklab,var(--acc) 4%,transparent)}
.day .nb{position:absolute;left:0;right:0;background:var(--night);pointer-events:none}
.run{position:absolute;border-radius:8px;padding:4px 7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  background:color-mix(in oklab,var(--c) var(--fill),var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 55%,transparent);
  font-size:11px;line-height:1.3;color:var(--ink);text-align:left;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .25s var(--ease),filter .25s;
  animation:rise .5s var(--ease) both;animation-delay:var(--delay,0ms)}
.run.thin{padding:0;border-radius:4px}
.run .t{display:flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.run .t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.run .t span{overflow:hidden;text-overflow:ellipsis}
.run .m{color:var(--ink-2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.run:hover{box-shadow:inset 0 0 0 1.5px var(--c),var(--shadow);z-index:4}
.tlbox.focus .run{opacity:.25;filter:saturate(.5)}
.tlbox.focus .run.sel{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--c),var(--shadow);z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.lim{position:absolute;left:3px;z-index:3;height:16px;margin-top:-8px;padding:0 6px;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;color:var(--on-warn);background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.lim:hover{filter:brightness(1.1)}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--acc);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.empty{padding:56px 16px 60px;text-align:center;color:var(--ink-3)}
.empty svg{width:56px;height:56px;color:var(--rule-2);stroke-width:1.2}
.empty p{margin:10px 0 0}

.head .use,.cell .use{display:block;font-size:10.5px;color:var(--acc-ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar{display:grid;gap:3px;align-items:end;height:132px;padding-top:6px}
.ubar .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.ubar .b{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--acc);opacity:.85;min-height:0}
.ubar .c:hover .b{opacity:1}
.ubar .l{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;height:12px}
.ubar .c.today .l{color:var(--acc-ink);font-weight:700}
.ubar .v{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;height:12px;white-space:nowrap}
.useg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 4px}
.useg .segc button{height:24px;font-size:11.5px}
/* ── project（プロジェクト別のまとめ） ──────────────────── */
.panel.projs,.panel.oc{grid-column:1/-1}
.ocgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;margin-top:8px}
.panel.fd{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:10px}
.fcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 16px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);border-top:3px solid var(--acc)}
.fno{position:absolute;top:12px;right:14px;font:700 11px/1 var(--sans);color:var(--ink-3)}
.fcard p{margin:0}
.fcard .see{font-size:14px;font-weight:650;line-height:1.55;padding-right:18px}
.fcard .why{font-size:12px;color:var(--ink-2);line-height:1.65}
.fcard .act{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:8px;background:var(--acc-soft);font-size:12.5px;line-height:1.6}
.fcard .act b{font-size:10.5px;letter-spacing:.06em;color:var(--acc-ink)}
.fss{display:flex;flex-direction:column;gap:2px}
.fses{display:flex;align-items:center;gap:7px;font-size:12px;text-align:left;padding:3px 0;min-width:0}
.fses i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.fses small{color:var(--ink-3);font-size:11px;flex:none}
.fses span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fses:hover span{color:var(--acc-ink);text-decoration:underline}
.ff{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--rule);font-size:11px;color:var(--ink-3)}
.flink{color:var(--acc-ink);font-size:11.5px;font-weight:600}
.flink:hover{text-decoration:underline}
.fmore{margin-top:12px}
.fmore summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.fok{font-size:13px;color:var(--ink-2);margin-top:8px}
.sact{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--acc-soft)}
.sact .pill{align-self:flex-start;color:var(--acc-ink);border-color:color-mix(in oklab,var(--acc) 35%,var(--rule-2));font-weight:600}
.sact span{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.moreS{margin-top:10px}
.moreS summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:4px 0}
.moreS .stats{margin-top:8px}
.ocl{font:600 11px/1 var(--sans);letter-spacing:.06em;color:var(--ink-3);margin:6px 0 -6px}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:12px}
.pcard{border:1px solid var(--rule);border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;
  background:linear-gradient(180deg,color-mix(in oklab,var(--c) 7%,var(--surface)),var(--surface) 70px)}
.pcard .hd{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .hd i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pcard .hd b{font:700 15px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .hd span{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pcard .bar2{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:-4px}
.pcard .bar2 span{display:block;height:100%;background:var(--c);border-radius:3px}
.pcard .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pcard .kv>div{background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .kv .k{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.pcard .kv .v{font:700 14px/1.3 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .lab{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.pcard .mods{display:flex;flex-wrap:wrap;gap:5px}
.pcard .mods span{font:11px var(--mono);color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.pcard .mods span b{font-family:var(--sans);font-weight:600;color:var(--ink);margin-left:4px}
.pses{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:5px 0;border-top:1px dashed var(--rule);font-size:12.5px;align-items:baseline}
.pses:first-of-type{border-top:0}
.pses .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pses .m{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pses:hover .t{color:var(--acc-ink);text-decoration:underline}
.pheavy{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:7px 9px;border-radius:8px;background:color-mix(in oklab,var(--warn) 7%,var(--surface));text-align:left;width:100%}
.pheavy em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--warn);white-space:nowrap}
.pheavy .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pheavy .m{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pmore{margin-top:10px}
.xl{color:var(--acc-ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--acc) 40%,transparent);text-underline-offset:2px}.xl:hover{text-decoration-color:currentColor}
a.pill{display:inline-flex;align-items:center;text-decoration:none}
.gc{position:absolute;right:calc(3px + var(--ln,0) * 70px);display:inline-flex;align-items:center;gap:3px;height:17px;margin-top:-8.5px;padding:0 5px 0 3px;border-radius:9px;background:var(--surface);border:1px solid var(--ink-3);color:var(--ink-2);font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gc.ai{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.gc:hover,.gc.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent);z-index:3}
.gi{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;vertical-align:-2px;margin-right:2px}
.gtag{display:inline-flex;align-items:center;gap:2px;padding:0 5px 0 3px;border-radius:8px;border:1px solid var(--ink-3);font:600 10.5px/16px ui-monospace,SFMono-Regular,Menlo,monospace;font-style:normal;color:var(--ink-2)}.gtag.ai{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.drawer .gfiles{font-size:12.5px;line-height:1.8;list-style:none;padding:0;margin:0}.drawer .gfiles li{display:flex;gap:10px;justify-content:space-between;border-bottom:1px dashed var(--rule)}.drawer .gfiles span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.drawer .gfiles b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-3)}.drawer .gfiles b i{font-style:normal;color:var(--acc-ink)}
.drawer .gbody{white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--ink-2);margin:0}
.drawer .gc-row{display:flex;gap:10px;width:100%;text-align:left;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:13px}.drawer .gc-row time{color:var(--ink-3);font-variant-numeric:tabular-nums}.drawer .gc-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drawer .gc-row b{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.head .gch,.cell .gcm{display:block;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pout{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}.pout span{color:var(--ink-3)}
.panel.ask{grid-column:1/-1}
.askbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.askpre{margin:0;max-height:320px;overflow:auto;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
/* ── month（月カレンダー：日ごとの作業量） ───────────────── */
.mgrid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr))}
.mgrid .mh{padding:10px 12px 8px;font-size:11px;color:var(--ink-3);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mgrid .mh:first-child{border-left:0}
.mgrid .wkno{display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:10.5px;color:var(--ink-3);border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;text-align:center}
.mgrid .wkno:hover{color:var(--acc-ink)}
.cell{position:relative;min-height:104px;padding:8px 10px 10px;border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);text-align:left;display:flex;flex-direction:column;gap:4px;
  background:color-mix(in oklab,var(--acc) calc(var(--heat,0) * var(--heatk)),var(--surface));transition:box-shadow .2s var(--ease)}
.cell:hover{box-shadow:inset 0 0 0 1.5px var(--acc);z-index:1}
.cell.out{background:var(--surface);opacity:.35;pointer-events:none}
.cell.we{background-image:linear-gradient(var(--weekend),var(--weekend))}
.cell .dn{font:700 14px/1 var(--sans);font-variant-numeric:tabular-nums}
.cell.today .dn{color:var(--on-acc);background:var(--acc);border-radius:6px;padding:3px 5px;margin:-3px 0 0 -5px;align-self:flex-start}
.cell .ac{font:700 15px/1.2 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:auto}
.cell .ac small{font-size:10.5px;font-weight:500;color:var(--ink-2)}
.cell .acs{display:none}
.cell .sub2{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cell .pj{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden}
.cell .pj span{background:var(--c);min-width:2px}
.mlegend{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 14px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--rule)}
.mlegend i{width:16px;height:10px;border-radius:3px;background:color-mix(in oklab,var(--acc) calc(var(--h) * var(--heatk)),var(--surface));box-shadow:inset 0 0 0 1px var(--rule)}
.wk .mode{margin-left:10px}

/* tooltip */
.tip{position:fixed;z-index:40;pointer-events:none;max-width:300px;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px;color:color-mix(in oklab,var(--bg) 72%,transparent);font-variant-numeric:tabular-nums}
.tip .r i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ── summary（週次・月次サマリー：時間・AI・かたち の 3 列） ── */
.rvhead{display:flex;align-items:baseline;gap:14px;padding:40px 0 16px;flex-wrap:wrap}
.rvhead h2{font:700 22px/1.2 var(--sans);letter-spacing:-.02em;margin:0}
.rvhead p{margin:0;color:var(--ink-3);font-size:12.5px}
.rvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;padding-bottom:48px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 22px 22px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ph .no{font:700 11px/22px var(--sans);width:22px;height:22px;border-radius:7px;text-align:center;background:var(--ink);color:var(--bg)}
.ph b{font:700 14px/1.3 var(--sans)}
.ph span{font-size:11.5px;color:var(--ink-3)}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;display:flex;align-items:center;gap:8px;font-weight:600}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
h2{font:700 19px/1.4 var(--sans);margin:6px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
h3{font:600 12px/1.2 var(--sans);color:var(--ink-2);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.hero{margin:10px 0 4px}
.hero .big{display:flex;align-items:baseline;gap:2px}
.hero .big .num{font:700 40px/1 var(--sans);letter-spacing:-.04em}
.hero .big .u{font:500 14px var(--sans);color:var(--ink-2);margin:0 6px 0 3px}
.hero .cap{color:var(--ink-2);margin-top:8px;font-size:12.5px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 8px;margin-left:8px;font-variant-numeric:tabular-nums}
.hb{opacity:.6;display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border:1px solid var(--rule-2);border-radius:50%;font:600 10px/1 var(--sans);color:var(--ink-3);vertical-align:1px;flex:none}
.hb:hover,.hb[aria-expanded="true"]{color:var(--acc-ink);border-color:var(--acc)}
.hint{margin:8px 0 4px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);font-size:11.5px;line-height:1.65;color:var(--ink-2);font-weight:400;letter-spacing:0}
.stat:has(> .hint:not([hidden])){grid-column:1/-1} /* 説明を開いたカードは 1 行使う */
.hint p{margin:0 0 6px}.hint dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.hint dt{color:var(--ink-3);white-space:nowrap}.hint dd{margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{padding:11px 12px 10px;border-radius:10px;background:var(--surface-2)}
.stat:last-child:nth-child(odd){grid-column:1/-1}
.stat .k{font-size:11.5px;color:var(--ink-3)}
.stat .v{font:700 19px/1.3 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:2px}
.stat .s{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.5;margin-top:2px}
.rhythm{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:128px;padding-top:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:default;min-width:0}
.colbar{width:100%;max-width:28px;border-radius:6px;background:var(--acc);display:flex;flex-direction:column-reverse;overflow:hidden;min-height:2px;opacity:.85;transition:opacity .2s}
.colbar .nt{background:repeating-linear-gradient(135deg,var(--acc) 0 2px,color-mix(in oklab,var(--acc) 40%,var(--surface)) 2px 4px)}
.col:hover .colbar{opacity:1}
.col .l{font-size:11px;color:var(--ink-3)}
.col.today .l{color:var(--acc-ink);font-weight:700}
.col .v{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;height:14px}
.keyrow{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:12px;justify-content:flex-end}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:var(--acc);opacity:.85}
.keyrow i.nt{background:repeating-linear-gradient(135deg,var(--acc) 0 2px,color-mix(in oklab,var(--acc) 40%,var(--surface)) 2px 4px)}
.stack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-bottom:10px}
.stack span{background:var(--c);min-width:2px}
.prow{display:grid;grid-template-columns:12px 1fr auto 40px;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.prow i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tm{color:var(--ink-2);font-variant-numeric:tabular-nums}
.prow .pc{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.focusrow{display:grid;grid-template-columns:86px 1fr 62px;gap:10px;align-items:center;padding:4px 0;font-size:12px}
.focusrow .when{color:var(--ink-2);font-variant-numeric:tabular-nums}
.focusrow .track2{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.focusrow .track2 span{display:block;height:100%;background:var(--c);border-radius:3px}
.focusrow .len{text-align:right;font-variant-numeric:tabular-nums}
.card{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;transition:all .2s var(--ease);background:var(--surface)}
.card:hover{border-color:var(--rule-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card .ti{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .me{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.tagx{font-size:11px;color:var(--warn);background:color-mix(in oklab,var(--warn) 10%,transparent);border-radius:4px;padding:0 6px}
.none{color:var(--ink-3);font-size:12.5px}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3);line-height:1.75}
.code{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--surface-2);border-radius:8px;padding:7px 8px 7px 11px;font:11.5px/1.5 var(--mono);color:var(--ink-2)}
.code code{flex:1;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.copy{font:11px var(--sans);color:var(--ink-2);border:1px solid var(--rule-2);border-radius:6px;padding:3px 8px;background:var(--surface);flex:none}
.copy:hover{color:var(--ink);border-color:var(--ink-3)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.back:hover{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta span{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 9px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.mini>div{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.mini .k{font-size:11px;color:var(--ink-3)}
.mini .v{font:700 18px/1.3 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}.mini .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:1px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:44px;top:6px;bottom:6px;width:1px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:38px 1fr;gap:18px;padding:5px 0;position:relative;font-size:12.5px;line-height:1.6}
.tl li::before{content:"";position:absolute;left:41px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--c)}
.tl li.fix::before{background:var(--warn);box-shadow:none}
.tl time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.tl p{margin:0;overflow-wrap:anywhere}
.more{font-size:12px;color:var(--ink-3);margin:6px 0 0 56px}
.trow{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.trow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.trow .track2{height:6px;border-radius:3px;background:var(--surface-2)}
.trow .track2 span{display:block;height:100%;border-radius:3px;background:var(--ink-3)}
.trow .n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.files{list-style:none;padding:0;margin:0;font:11.5px/1.7 var(--mono);color:var(--ink-2)}
.files li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.files li span{direction:ltr;unicode-bidi:plaintext}

/* エージェント別 */
.ngroup{border:1px solid var(--rule);border-radius:12px;padding:10px 14px 6px;margin-bottom:10px}
.ngroup .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.ngroup .hd b{font:600 13px var(--sans)}
.ngroup .hd span{font-size:11px;color:var(--ink-3)}
.nrow{display:grid;grid-template-columns:1fr auto 52px;gap:10px;padding:5px 0;border-top:1px dashed var(--rule);font-size:12.5px;align-items:baseline}
.nrow .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.nrow .n{font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
/* AI の使い方 */
.mrow{display:grid;grid-template-columns:1fr auto 40px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mrow .nm i{width:9px;height:9px;border-radius:3px;background:var(--acc);opacity:var(--o);flex:none}
.mrow .tm{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.mrow .tm small{color:var(--ink-3);margin-left:6px}
.mrow .pc{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mstack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-bottom:8px}
.mstack span{background:var(--acc);opacity:var(--o);min-width:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 9px;font-variant-numeric:tabular-nums}
.chips span b{font-weight:600;color:var(--ink);margin-left:4px}
.chips span.mono{font-family:var(--mono);font-size:11px}
.sub{padding:9px 0 10px;border-bottom:1px solid var(--rule)}
.sub:last-child{border-bottom:0}
.sub .hd{display:flex;align-items:center;gap:8px;font-size:12.5px}
.sub .ty{font:600 11px var(--mono);color:var(--ink);background:var(--surface-2);border-radius:5px;padding:1px 7px;flex:none}
.sub .ds{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.sub .bg{font-size:10.5px;color:var(--acc-ink);flex:none}
.sub .lane{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin:8px 0 6px}
.sub .lane span{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c);min-width:3px}
.sub .ft{display:flex;gap:12px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.note{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.7}

/* ── drawer（セッションの詳細） ──────────────────────────── */
/* 画面の真ん中に出すモーダル。後ろのカレンダーはしっかり沈め、縁を線と影ではっきりさせる。ダークでは面の明るさが近いので幕を濃くする */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.62)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scrim{background:rgba(0,0,0,.62)}}
.drawer{position:fixed;top:50%;left:50%;z-index:21;width:min(760px,calc(100vw - 48px));max-height:min(92vh,1100px);background:var(--surface);border:1px solid var(--rule-2);border-radius:18px;
  box-shadow:0 40px 100px -20px rgba(0,0,0,.6);overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-48%) scale(.97);
  transition:transform .28s var(--ease),opacity .2s var(--ease),visibility 0s .28s;display:flex;flex-direction:column}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%);transition:transform .28s var(--ease),opacity .2s var(--ease)}
.drawer .mini{grid-template-columns:repeat(3,minmax(0,1fr))}
/* 広い画面では、左に「何をしたか」（数値・依頼の流れ）、右に「何が残ったか」（コミット・PR・ファイル） */
@media (min-width:1100px){
  .drawer{width:min(1080px,calc(100vw - 48px))}
  .drawer .dcols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 40px;margin-top:18px}
  .drawer .dcol>:first-child{margin-top:0}
  .drawer .dcol+.dcol{border-left:1px solid var(--rule);padding-left:40px}
}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px 28px;border-bottom:1px solid var(--rule)}
.drawer .db{overflow:auto;padding:22px 28px 48px;flex:1;scrollbar-width:thin;font-size:14px}
/* パネルの中は読み物なので、一覧より一回り大きく・濃く */
.drawer .back{font-size:13px;color:var(--ink-2)}
.drawer .eyebrow{font-size:11.5px}
.drawer h2{font-size:21px;margin:8px 0 6px}
.drawer h3{font-size:14px;font-weight:700;color:var(--ink);margin:30px 0 12px}
.drawer h3::after{background:var(--rule-2)}
.drawer .meta span,.drawer .chips span{font-size:12.5px;padding:2px 10px}
.drawer .chips span.mono{font-size:12px}
.drawer .mini{gap:10px}
.drawer .mini>div{padding:12px 14px}
.drawer .mini .k{font-size:12px;color:var(--ink-2)}
.drawer .mini .v{font-size:20px}
.drawer .tl li{font-size:14px;grid-template-columns:42px 1fr;padding:6px 0}
.drawer .tl::before{left:48px}
.drawer .tl li::before{left:45px;top:14px}
.drawer .tl time{font-size:12.5px;color:var(--ink-2)}
.drawer .more{margin-left:60px;font-size:13px}
.drawer .none{font-size:13.5px}
.drawer .sub{padding:12px 0}
.drawer .sub .hd{font-size:14px}
.drawer .sub .ty{font-size:12px}
.drawer .sub .ds{color:var(--ink)}
.drawer .sub .bg{font-size:11.5px}
.drawer .sub .ft{font-size:12.5px;color:var(--ink-2);gap:4px 14px}
.drawer .trow{font-size:13px;grid-template-columns:130px 1fr 32px;padding:4px 0}
.drawer .trow .nm{font-size:12.5px}
.drawer .trow .n{color:var(--ink-2)}
.drawer .files{font-size:12.5px;line-height:1.8}
.drawer .code{font-size:12.5px}
.drawer .copy{font-size:12px}
.drawer .note{font-size:12px;color:var(--ink-2)}
.drawer .nrow{font-size:13.5px}

/* toast & dialog */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:all .25s var(--ease);z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:16px;padding:26px 28px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,16,.35);backdrop-filter:blur(3px)}
dialog h2{margin-top:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:12.5px;margin-top:14px;align-items:center}
.keys kbd{justify-self:start}

/* ── responsive ─────────────────────────────────────────── */
@media (max-width:1320px){.rvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel.shape{grid-column:1/-1}}
@media (max-width:1180px){.tag{display:none}.kpis{margin-left:0;width:100%}.kpi{flex:1;min-width:0}}
@media (max-width:1000px){#colorBy{display:none}.search kbd{display:none}.search input,.search input:focus{width:160px}}
@media (max-width:820px){
  .fgrid{grid-template-columns:1fr}
  .mgrid{grid-template-columns:28px repeat(7,minmax(0,1fr))}
  .cell{min-height:64px;padding:6px 6px 7px}.cell .sub2,.cell .ac{display:none}.cell .acs{display:block;font:700 12px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin-top:auto}
  .ph{flex-wrap:wrap;row-gap:2px}.ph span:not(.no){flex-basis:100%;padding-left:32px}
  .mgrid .mh{padding:8px 6px}
  .wrap{padding:0 16px}
  .bar{height:54px;gap:8px}
  .zoom{display:none}
  .search input,.search input:focus{width:120px}
  .week{padding:18px 0 14px;gap:14px}
  .wk .d{font-size:24px}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{border-left:1px solid var(--rule);border-top:1px solid var(--rule);padding:8px 10px 7px}
  .kpi:nth-child(-n+3){border-top:0}.kpi:nth-child(3n+1){border-left:0}
  .kpi .k{font-size:10px;white-space:normal;line-height:1.3}.kpi .v{font-size:16px}
  .gc{right:calc(2px + var(--ln,0) * 17px);width:15px;height:15px;margin-top:-7.5px;padding:0;justify-content:center}.gc span{display:none}.gc .gi{margin:0;width:11px;height:11px}
  .ocgrid{grid-template-columns:minmax(0,1fr);gap:12px}.stats.s3{grid-template-columns:1fr 1fr}
  .calin{min-width:660px}
  .calscroll{max-height:70vh}
  .rvgrid{grid-template-columns:minmax(0,1fr)}
  .panel{padding:18px 16px}
  .drawer .db{padding:18px 16px 40px}
  .drawer .dh{padding-left:16px}
  /* スマホでは画面いっぱいに出す */
  .drawer{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0;transform:translate(-50%,-50%) translateY(16px)}
  .drawer .mini{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.run{border:1px solid CanvasText}}
</style></head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>
      <span class="word">kiroku</span><span class="tag">AIと過ごした時間の記録</span>
      <span class="live" id="live" hidden title="履歴が増えると自動で反映します">LIVE</span>
    </div>
    <div class="segc" role="group" aria-label="色分け" id="colorBy">
      <button data-v="project">プロジェクト</button><button data-v="branch">ブランチ</button><button data-v="source">ツール</button>
    </div>
    <div class="segc zoom" role="group" aria-label="ズーム">
      <button id="zout" aria-label="縮小">−</button><button id="zin" aria-label="拡大">＋</button>
    </div>
    <label class="search"><span class="sr">検索</span>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="タイトル・依頼文で探す" autocomplete="off"><kbd>/</kbd></label>
    <button class="iconbtn" id="theme" aria-label="テーマを切り替え"></button>
    <button class="iconbtn" id="help" aria-label="ショートカット"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/></svg></button>
  </div>
</header>
<main class="wrap">
  <section class="week" aria-label="期間">
    <nav class="wk" aria-label="期間の移動">
      <div class="lbl" aria-live="polite"><div class="y" id="ry"></div><div class="d" id="rd"></div></div>
      <div class="nav">
        <button class="iconbtn" id="prev" aria-label="前へ"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="next" aria-label="次へ"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="pill" id="today">今週</button>
        <div class="segc mode" role="group" aria-label="表示" id="mode"><button data-v="week">週</button><button data-v="month">月</button></div>
      </div>
    </nav>
    <div class="kpis" id="kpis"></div>
  </section>
  <div class="legend" id="legend" aria-label="凡例"></div>
  <section class="tlbox" id="tl" aria-label="カレンダー"></section>
  <section id="review" aria-live="polite"></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="セッションの詳細" aria-hidden="true">
  <div class="dh"><button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>サマリーへ戻る</button>
    <button class="iconbtn" id="close" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="panel"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="keys">
  <div class="eyebrow">Shortcuts</div><h2>キーボード操作</h2>
  <div class="keys">
    <kbd>←</kbd><span>前の週 / 月</span><kbd>→</kbd><span>次の週 / 月</span><kbd>T</kbd><span>今週 / 今月に戻る</span>
    <kbd>/</kbd><span>検索</span><kbd>+</kbd><span>拡大（<kbd>−</kbd> で縮小）</span>
    <kbd>W</kbd><span>週の表示</span><kbd>M</kbd><span>月の表示</span>
    <kbd>Esc</kbd><span>詳細を閉じる</span><kbd>?</kbd><span>この一覧</span>
  </div>
  <form method="dialog" style="margin-top:22px;text-align:right"><button class="pill">閉じる</button></form>
</dialog>
<script>
let DATA = __DATA__;
let WEEKS = __WEEKS__;
let MONTHS = __MONTHS__;
let META = __META__;
let GENERATED = __GEN__;
const LIVE = __LIVE__; // kiroku serve で開いたとき true
const DOW = ["日","月","火","水","木","金","土"], SLOTS = 8;
const $ = s => document.querySelector(s);
const store = { get(k,d){ try { const v = localStorage.getItem("kiroku:"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k,v){ try { localStorage.setItem("kiroku:"+k, JSON.stringify(v)); } catch(e){} } };
const st = { z: store.get("zh", 2), colorBy: store.get("colorBy", "project"), theme: store.get("theme", "auto"),
             week: mondayOf(new Date()), month: monthOf(new Date()), mode: store.get("mode", "week"), use: store.get("use", "tokens"),
             hidden: new Set(), sel: null, q: "", animate: true };

/* ── helpers ── */
function mondayOf(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function monthOf(d){ d = new Date(d); return new Date(d.getFullYear(), d.getMonth(), 1); }
function mkey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function addDays(d,n){ d = new Date(d); d.setDate(d.getDate()+n); return d; }
function key(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hm(t){ return new Date(t*1000).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}); }
function md(t){ const d = new Date(t*1000); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function dur(m, html){ m = Math.round(m); const h = Math.floor(m/60), r = m%60;
  if (!html) return h ? `${h}時間${r ? String(r).padStart(2,"0")+"分" : ""}` : `${r}分`;
  return h ? `${h}<small>時間</small>${r ? String(r).padStart(2,"0")+"<small>分</small>" : ""}` : `${r}<small>分</small>`; }
function tok(n){ n = n || 0; return n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"K" : String(n); }
function usd(v){ return v == null ? "—" : v > 0 && v < 0.01 ? "<$0.01" : "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2)); }
function cr(v){ return `${Number(v.toFixed(2)).toLocaleString("ja-JP")} cr`; }
function useShort(d){ if (!d) return ""; const p = []; if (d.tokens) p.push(tok(d.tokens)); if (d.cost >= 0.005) p.push(usd(d.cost)); if (d.credits) p.push(cr(d.credits)); return p.join(" · "); }
function shade(i){ return [1,.72,.5,.34,.22,.14][Math.min(i,5)]; }
function secs(v){ return v == null ? "—" : v < 60 ? `${v}秒` : `${Math.floor(v/60)}分${String(v%60).padStart(2,"0")}秒`; }
function isoWeek(d){ d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate()+4-n);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(((d-y0)/864e5+1)/7); }
const keyOf = s => st.colorBy === "project" ? s.project : st.colorBy === "source" ? s.source : `${s.project} · ${s.branch || "—"}`;
let slot = {};
function assignColors(){ // 全期間の多い順に固定。週を変えても、非表示にしても色は変わらない
  const n = {}; DATA.forEach(s => n[keyOf(s)] = (n[keyOf(s)]||0) + 1);
  slot = {}; Object.keys(n).sort((a,b)=>n[b]-n[a]).forEach((k,i) => slot[k] = i < SLOTS ? `var(--c${i})` : "var(--other)");
}
const colorOf = k => slot[k] || "var(--other)";
function matches(s){
  if (st.hidden.has(keyOf(s))) return false;
  if (!st.q) return true;
  return (s.title+" "+s.project+" "+(s.branch||"")+" "+s.source+" "+s.prompts.map(p=>p.text).join(" ")).toLowerCase().includes(st.q);
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("on"), 1600); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast("コピーしました"); } catch(e){ toast("コピーできませんでした"); } }
const ICON = { auto:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg>',
  light:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  dark:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>' };
function applyTheme(){ const r = document.documentElement; st.theme === "auto" ? r.removeAttribute("data-theme") : r.setAttribute("data-theme", st.theme);
  $("#theme").innerHTML = ICON[st.theme]; $("#theme").setAttribute("aria-label", `テーマ: ${{auto:"自動",light:"ライト",dark:"ダーク"}[st.theme]}`); }

/* ── render ── */
const HOURS = [28, 36, 44, 56, 72, 96]; // 1 時間の高さ（ズーム）
function period(){ // 今見ている期間 [ws, we) と、その集計
  if (st.mode === "month"){ const a = st.month, b = new Date(a.getFullYear(), a.getMonth()+1, 1); return {ws:a.getTime()/1000, we:b.getTime()/1000, S:MONTHS[mkey(a)], P:MONTHS[mkey(new Date(a.getFullYear(), a.getMonth()-1, 1))]}; }
  return {ws:st.week.getTime()/1000, we:addDays(st.week,7).getTime()/1000, S:WEEKS[key(st.week)], P:WEEKS[key(addDays(st.week,-7))]};
}
function render(){
  assignColors();
  const {ws, we} = period(), M = st.mode === "month";
  const todayKey = key(new Date()), end = addDays(st.week,6);
  if (M){ $("#ry").textContent = `${st.month.getFullYear()} · Month`; $("#rd").innerHTML = `${st.month.getFullYear()}<span>.</span>${st.month.getMonth()+1}`; }
  else { $("#ry").textContent = `${st.week.getFullYear()} · Week ${isoWeek(st.week)}`; $("#rd").innerHTML = `${st.week.getMonth()+1}.${st.week.getDate()}<span>—</span>${end.getMonth()+1}.${end.getDate()}`; }
  $("#today").textContent = M ? "今月" : "今週";
  $("#prev").setAttribute("aria-label", M ? "前の月" : "前の週"); $("#next").setAttribute("aria-label", M ? "次の月" : "次の週");
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.mode));
  document.querySelectorAll("#colorBy button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.colorBy));
  document.querySelector(".zoom").style.visibility = M ? "hidden" : "";

  const inRange = DATA.filter(s => s.end >= ws && s.start < we);
  const shown = inRange.filter(matches);
  kpis();
  // legend（この期間にあるものを多い順に）
  const cnt = {}; inRange.forEach(s => cnt[keyOf(s)] = (cnt[keyOf(s)]||0)+1);
  $("#legend").innerHTML = `<span class="lab">${{project:"プロジェクト",branch:"ブランチ",source:"ツール"}[st.colorBy]}</span>` +
    Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k => `<button class="chip" style="--c:${colorOf(k)}" data-k="${esc(k)}" aria-pressed="${!st.hidden.has(k)}"><span class="dot"></span>${esc(k)}<span class="n">${cnt[k]}</span></button>`).join("") +
    `<span class="count">${shown.length} / ${inRange.length} セッション</span>`;
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { const k = c.dataset.k; st.hidden.has(k) ? st.hidden.delete(k) : st.hidden.add(k); render(); });

  M ? monthGrid(shown, ws, we, todayKey) : timeline(shown, inRange, ws, we, todayKey);
  try { summary(); } catch(e){ // サマリーで失敗しても、カレンダーと詳細は使えるようにする
    console.error(e); $("#review").innerHTML = `<div class="panel"><p class="none">この期間のサマリーを表示できませんでした（${esc(e.message)}）。issue で教えてください。</p></div>`; }
  const gc = st.sel && st.sel.startsWith("git:") && (META.git || []).find(x => "git:" + x.hash === st.sel);
  const s = !gc && st.sel && DATA.find(x => x.id === st.sel), open = !!(s || gc);
  if (st.sel && !open) st.sel = null;
  if (s) detail(s); else if (gc) commitDetail(gc);
  document.body.classList.toggle("open", open); document.body.classList.toggle("lock", open);
  $("#drawer").setAttribute("aria-hidden", String(!open));
  $("#tl").classList.toggle("focus", open);
  st.animate = false;
}

/* 期間の要点（上の帯） */
function kpis(){
  const {S:w} = period(), K = $("#kpis"), M = st.mode === "month";
  if (!w){ K.innerHTML = `<div class="kpi"><div class="k">${M ? "この月" : "この週"}</div><div class="v">記録なし</div></div>`; return; }
  const kpi = (k, v) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const u = w.usage || {}, days = w.days.filter(d => d.active).length;
  K.innerHTML = kpi("作業していた時間", dur(w.active, true)) + kpi("作業した日", `${days}<small>/ ${w.days.length} 日</small>`) +
    kpi("セッション / 依頼", `${w.sessions}<small>/</small>${w.prompts}`) +
    (u.tokens ? kpi("トークン", tok(u.tokens)) + kpi("目安コスト", usd(u.cost).replace("$","<small>$</small>")) : "") +
    (u.credits ? kpi("Kiro クレジット", `${Number(u.credits.toFixed(2)).toLocaleString("ja-JP")}<small>cr</small>`) : "") +
    (() => { const {ws, we} = period(), n = limitHits(ws, we).length; return n ? kpi("利用上限に当たった", `<span style="color:var(--warn)">${n}</span><small>回</small>`) : ""; })() +
    (w.git && w.git.commits ? kpi("コミット（うち AI）", `${w.git.commits}<small>（${w.git.ai}）</small>`) :
     w.outputs && w.outputs.commits ? kpi("AI のコミット", `${w.outputs.commits}<small>回</small>`) : "");
}

/* 月のカレンダー：日ごとの作業時間を濃さで、プロジェクトの配分を細い帯で */
function monthGrid(shown, ms, me, todayKey){
  const T = $("#tl"), S = MONTHS[mkey(st.month)], first = mondayOf(st.month);
  const max = S ? Math.max(1, ...S.days.map(d => d.active)) : 1;
  let h = `<div class="mgrid"><div class="mh"></div>${["月","火","水","木","金","土","日"].map(d=>`<div class="mh">${d}</div>`).join("")}`;
  for (let r = 0; r < 6; r++){
    const wk = addDays(first, 7*r); if (wk.getTime()/1000 >= me) break;
    h += `<button class="wkno" data-w="${key(wk)}" title="この週を開く">W${isoWeek(wk)}</button>`;
    for (let c = 0; c < 7; c++){
      const d = addDays(wk, c), ds = d.getTime()/1000, de = addDays(d,1).getTime()/1000, inM = d.getMonth() === st.month.getMonth();
      if (!inM){ h += `<div class="cell out"><span class="dn">${d.getDate()}</span></div>`; continue; }
      const x = S ? S.days[d.getDate()-1] : null, act = x ? x.active : 0;
      const by = {}; shown.forEach(s => s.segs.forEach(([a,b]) => { const o = Math.min(b,de) - Math.max(a,ds); if (o > 0) by[keyOf(s)] = (by[keyOf(s)]||0) + o; }));
      const pj = Object.entries(by).sort((a,b)=>b[1]-a[1]);
      h += `<button class="cell${d.getDay()%6===0?" we":""}${key(d)===todayKey?" today":""}" data-w="${key(mondayOf(d))}" style="--heat:${(act/max).toFixed(3)}" title="${md(ds)} 作業 ${dur(act)}${x ? `・依頼 ${x.prompts}・深夜 ${dur(x.night)}${useShort(x) ? `・${useShort(x)}` : ""}` : ""}">
        <span class="dn">${d.getDate()}</span>${act ? `<span class="ac">${dur(act, true)}</span><span class="acs">${act >= 60 ? (act/60).toFixed(1)+"h" : act+"m"}</span><span class="sub2">依頼 ${x.prompts}</span>` : ""}${x && useShort(x) ? `<span class="use">${useShort(x)}</span>` : ""}${x && x.commits ? `<span class="gcm" title="git のコミット">${GIT_ICON}${x.commits}</span>` : ""}
        ${pj.length ? `<span class="pj">${pj.map(([k,v])=>`<span style="flex:${v};--c:${colorOf(k)}"></span>`).join("")}</span>` : ""}</button>`;
    }
  }
  h += `</div><div class="mlegend"><span style="white-space:nowrap">少ない</span> ${[0,.25,.5,.75,1].map(v=>`<i style="--h:${v}"></i>`).join("")} 多い（作業していた時間）・日付を押すとその週を開きます</div>`;
  T.innerHTML = h;
  T.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { const [y,m,dd] = b.dataset.w.split("-").map(Number); st.week = new Date(y, m-1, dd); setMode("week"); });
}

/* 週のカレンダー：曜日が列、時刻が縦。重なるセッションだけ横に並べる */
function timeline(shown, inWeek, ws, we, todayKey){
  const T = $("#tl"), hh = HOURS[st.z] || 44, H = 24*hh;
  if (!inWeek.length || !shown.length){
    T.innerHTML = `<div class="empty"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><p>${inWeek.length ? "条件に合うセッションはありません" : "この週の記録はありません。← → で週を移動できます"}</p></div>`;
    return;
  }
  const keep = T.querySelector(".calscroll"), top = keep ? keep.scrollTop : null;
  const nowS = Date.now()/1000, w = WEEKS[key(st.week)];
  let heads = '<div></div>', hours = "", cols = "";
  const nowH = nowS >= ws && nowS < we ? (() => { const d0 = new Date(nowS*1000); d0.setHours(0,0,0,0); return (nowS - d0.getTime()/1000)/3600; })() : -9;
  for (let h=1; h<24; h++) if (Math.abs(h - nowH) * hh >= 14) hours += `<span style="top:${h*hh}px">${String(h).padStart(2,"0")}:00</span>`;
  if (nowS >= ws && nowS < we){ const d0 = new Date(nowS*1000); d0.setHours(0,0,0,0); hours += `<span class="now" style="top:${(nowS - d0.getTime()/1000)/3600*hh}px">${hm(nowS)}</span>`; }
  const runs = [];
  for (let d=0; d<7; d++){
    const day = addDays(st.week,d), ds = day.getTime()/1000, de = addDays(st.week,d+1).getTime()/1000, isToday = key(day) === todayKey;
    const act = w && w.days[d] ? w.days[d].active : 0;
    const dU = w && w.days[d] ? useShort(w.days[d]) : "";
    heads += `<div class="head${isToday?" today":""}"><div class="dd"><b>${day.getMonth()+1}/${day.getDate()}</b><i>${DOW[day.getDay()]}</i></div><small>${act ? dur(act) : "—"}</small>${dU ? `<span class="use" title="トークン・目安コスト・クレジット">${dU}</span>` : ""}${w && w.days[d] && w.days[d].commits ? `<span class="gch" title="git のコミット">${GIT_ICON}${w.days[d].commits}</span>` : ""}</div>`;
    const blocks = [];
    shown.forEach(s => s.segs.forEach(([a,b,n]) => { const x = Math.max(a,ds), y = Math.min(b,de); if (y > x) blocks.push({s, a:x, b:y, n}); }));
    blocks.sort((p,q) => p.a-q.a || q.b-p.b);
    // 重なるものだけ横に並べる（かたまりごとに列の数を決める）
    let cluster = [], cEnd = -1;
    const flush = () => { const lanes = []; cluster.forEach(bk => { let i = lanes.findIndex(e => e <= bk.a); if (i<0){ i = lanes.length; lanes.push(0); } lanes[i] = bk.b; bk.lane = i; }); cluster.forEach(bk => bk.L = lanes.length); cluster = []; };
    blocks.forEach(bk => { if (bk.a >= cEnd){ flush(); cEnd = bk.b; } else cEnd = Math.max(cEnd, bk.b); cluster.push(bk); }); flush();
    let html = `<div class="nb" style="top:0;height:${6*hh}px"></div><div class="nb" style="top:${22*hh}px;height:${2*hh}px"></div>`;
    blocks.forEach((bk, j) => {
      const y = (bk.a-ds)/3600*hh, h = Math.max(4, (bk.b-bk.a)/3600*hh - 2), mins = (bk.b-bk.a)/60;
      const dens = Math.min(1, bk.n / Math.max(1, mins) / 2.5), id = runs.length;
      runs.push(bk);
      html += `<button class="run${h < 16 ? " thin" : ""}${st.sel === bk.s.id ? " sel" : ""}" data-r="${id}" style="top:${y}px;height:${h}px;left:calc(${bk.lane/bk.L*100}% + 3px);width:calc(${100/bk.L}% - 6px);--c:${colorOf(keyOf(bk.s))};--fill:${Math.round(16+30*dens)}%;${st.animate?`--delay:${d*30+Math.min(j,14)*10}ms`:"animation:none"}" aria-label="${esc(`${bk.s.title}、${bk.s.project}、${md(bk.a)} ${hm(bk.a)}から${hm(bk.b)}`)}">${h >= 20 ? `<span class="t"><span>${esc(bk.s.title)}</span></span>` + (h >= 38 ? `<span class="m">${hm(bk.a)}–${hm(bk.b)} · ${esc(bk.s.project)}</span>` : "") : ""}</button>`;
    });
    const glanes = []; // 時刻の近いコミットは重ならないよう、右から順に横へずらす
    (META.git || []).forEach(c => { if (!(c.t >= ds && c.t < de && (!st.hidden.size || st.colorBy !== "project" || !st.hidden.has(c.project)))) return;
      const y = (c.t-ds)/3600*hh; let ln = glanes.findIndex(v => y - v >= 19); if (ln < 0){ ln = glanes.length; glanes.push(0); } glanes[ln] = y;
      html += `<button class="gc${c.ai ? " ai" : ""}${st.sel === "git:"+c.hash ? " sel" : ""}" data-c="${esc(c.hash)}" style="top:${y}px;--ln:${ln}" title="${esc(`${hm(c.t)} ${c.project}${c.branch ? " · "+c.branch : ""} · ${c.hash}\n${c.subject}\n${c.nFiles} ファイル +${c.added} −${c.removed}${c.ai ? " · AI が実行" : ""}`)}" aria-label="${esc(`コミット ${hm(c.t)} ${c.subject}`)}">${GIT_ICON}<span>${esc(c.hash.slice(0,7))}</span></button>`; });
    limitHits(ds, de).filter(h => matches(h.s)).forEach(h => { html += `<button class="lim" data-id="${esc(h.s.id)}" style="top:${(h.t-ds)/3600*hh}px" title="${esc(`${hm(h.t)} 利用上限に当たりました（${h.s.title}）`)}" aria-label="${esc(`${hm(h.t)} 利用上限`)}">上限</button>`; });
    if (isToday && nowS >= ds && nowS < de) html += `<div class="nowline" style="top:${(nowS-ds)/3600*hh}px"></div>`;
    cols += `<div class="day${day.getDay()%6===0?" we":""}${isToday?" today":""}" style="height:${H}px">${html}</div>`;
  }
  T.innerHTML = `<div class="calscroll" style="--hh:${hh}px"><div class="calin"><div class="heads">${heads}</div><div class="cgrid"><div class="hours" style="height:${H}px">${hours}</div>${cols}</div></div></div>`;
  if (top != null) T.querySelector(".calscroll").scrollTop = top;
  T.querySelectorAll(".lim").forEach(el => el.onclick = e => { e.stopPropagation(); select(el.dataset.id); });
  T.querySelectorAll(".gc").forEach(el => el.onclick = e => { e.stopPropagation(); select("git:" + el.dataset.c); });
  T.querySelectorAll(".run").forEach(el => { const bk = runs[+el.dataset.r];
    el.onclick = e => { e.stopPropagation(); select(bk.s.id); };
    el.onmouseenter = e => tipOn(e, bk); el.onmousemove = tipMove; el.onmouseleave = tipOff; });
}

/* ── tooltip ── */
function tipOn(e, bk){ const t = $("#tip"), s = bk.s;
  t.innerHTML = `<b>${esc(s.title)}</b><div class="r" style="--c:${colorOf(keyOf(s))}"><i></i>${esc(s.project)}${s.branch?` · ${esc(s.branch)}`:""}</div><div class="r">${md(bk.a)} ${hm(bk.a)}–${hm(bk.b)}（${dur((bk.b-bk.a)/60)}）</div><div class="r">${esc(s.source)} · 依頼 ${s.nPrompts} 件${s.cost ? ` · ${usd(s.cost)}` : ""}${s.credits ? ` · ${s.credits} クレジット` : ""}${s.subagents.length ? ` · サブエージェント ${s.subagents.length}` : ""}</div>`;
  t.classList.add("on"); tipMove(e); }
function tipMove(e){ const t = $("#tip"), w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 12) x = e.clientX - w - 14; if (y + h > innerHeight - 12) y = e.clientY - h - 14;
  t.style.left = x+"px"; t.style.top = y+"px"; }
function tipOff(){ $("#tip").classList.remove("on"); }

/* ── 週次・月次サマリー：① 気づきと試せること ② プロジェクト別 ③ コストと成果 ④ 時間 ⑤ AI ⑥ かたち ⑦ 改善案を聞く ── */
function summary(){
  const {S:w, P:pw} = period(), R = $("#review"), M = st.mode === "month", unit = M ? "月" : "週";
  const head = `<div class="rvhead"><h2>${M ? "月次サマリー" : "週次サマリー"}</h2><p>自分の使い方を振り返るための目安です。人と比べたり、評価に使ったりするための数字ではありません。</p></div>`;
  if (!w){ R.innerHTML = `${head}<div class="rvgrid"><div class="panel"><p class="none">この${unit}の記録はありません。← → で移動できます。</p>${foot()}</div></div>`; bindCopy(R); return; }
  const d = pw ? w.active - pw.active : null;
  const longest = Math.max(0, ...w.focus.map(b=>b.min));
  const total = w.projects.reduce((t,[,v])=>t+v,0) || 1;
  const stat = (k, v, s, h) => `<div class="stat"><div class="k">${k}${hb(h)}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:""}${hint(h)}</div>`;
  const ph = (n, t, s, h) => `<div class="ph"><span class="no">${n}</span><b>${t}${hb(h)}</b><span>${s}</span></div>${hint(h)}`;
  const pct = v => v == null ? "不明" : `${v}<small>%</small>`;
  R.innerHTML = `${head}<div class="rvgrid">
  ${findPanel(w, pw, unit, ph)}
  ${projectPanel(w, ph, unit)}
  ${outcomePanel(w, pw, unit, ph, stat)}
  <section class="panel">${ph(4, "時間の使い方", "いつ・どれくらい動いていたか")}
    <div class="hero"><div class="big">${dur(w.active,true).replace(/(\d+)/g,'<span class="num">$1</span>').replace(/<small>(.*?)<\/small>/g,'<span class="u">$1</span>')}</div>
      <div class="cap">どれかのセッションが動いていた時間${hb("active")}${d==null?"":`<span class="delta">先${unit}より ${d>=0?"+":"−"}${dur(Math.abs(d))}</span>`}</div>${hint("active")}</div>
    <div class="stats">
      ${stat("集中ブロック（60分以上）", `${w.focus.length}<small>回</small>`, longest ? `最長 ${dur(longest)}` : "まとまった時間はなし", "focus")}
      ${stat("深夜（22〜6時）", dur(w.night,true), "", "night")}
      ${stat("週末", dur(w.weekend,true), "", "weekend")}
      ${stat("AIの延べ稼働", dur(w.ai,true), "並列ぶんも合計。人の削減時間ではありません", "ai")}
      ${(() => { const {ws, we} = period(), H = limitHits(ws, we); return stat("利用上限に当たった", `${H.length}<small>回</small>`, H.length ? H.slice(-4).map(h => `${md(h.t)} ${hm(h.t)}`).join("・") + (H.length > 4 ? " など" : "") : "Claude Code の履歴から", "limits"); })()}
    </div>
    <details class="moreS" id="moreS"${st.moreS ? " open" : ""}><summary>詳しい指標（推定を含む）</summary><div class="stats">
      ${stat("言い直し・中断のあった依頼", pct(w.fixRate), `n=${w.prompts}・依頼文の言葉と中断から推定`, "fix")}
      ${stat("1日の切り替え", `${w.switchesAvg}<small>回</small>`, `最大 ${w.switchesMax} 回`, "switches")}
      ${stat("並列で動かした時間", dur(w.parallel,true), `最大 ${w.maxConc} 本同時`, "parallel")}
      ${stat("待たせ時間（中央値）", secs(w.waitMedian).replace(/(分|秒)/g,"<small>$1</small>"), `n=${w.waitCount}・90%点 ${secs(w.waitP90)}・短いほど良いとは限りません`, "wait")}
    </div></details>
    ${foot()}</section>
  <section class="panel">${ph(5, "AI の使い方", "使った量・費用・エージェント")}
    ${usageChart(w, M)}
    ${aiUsage(w, pw, unit) || '<p class="none">トークンやクレジットの記録はありません。</p>'}
    ${nativeSection(w)}</section>
  <section class="panel shape">${ph(6, M ? "月のかたち" : "週のかたち", "どこに時間を使ったか")}
    ${rhythm(w, M)}
    <h3>プロジェクトの配分${hb("share")}</h3>${hint("share")}
    <div class="stack" role="img" aria-label="プロジェクト別の配分">${w.projects.map(([k,v])=>`<span style="flex:${v};--c:${st.colorBy==="project"?colorOf(k):"var(--ink-3)"}" title="${esc(k)} ${dur(v)}"></span>`).join("")}</div>
    ${w.projects.slice(0,8).map(([k,v])=>`<div class="prow" style="--c:${st.colorBy==="project"?colorOf(k):"var(--ink-3)"}"><i></i><span class="nm">${esc(k)}</span><span class="tm">${dur(v)}</span><span class="pc">${Math.round(v*100/total)}%</span></div>`).join("")}
    <h3>集中ブロック${hb("focusList")}</h3>${hint("focusList")}
    ${w.focus.length ? [...w.focus].sort((a,b)=>b.min-a.min).slice(0,5).map(b=>`<div class="focusrow" style="--c:${st.colorBy==="project"?colorOf(b.project):"var(--ink-3)"}"><span class="when">${md(b.t)} ${hm(b.t)}</span><span class="track2"><span style="width:${b.min/longest*100}%"></span></span><span class="len">${dur(b.min)}</span></div>`).join("") : '<p class="none">60分以上続いた作業はありませんでした。</p>'}
    <h3>こじれたかもしれない${hb("friction")}</h3>${hint("friction")}

    ${measure(w)}</section>
  <section class="panel ask">${ph(7, "AI に改善案を聞く", "このデータをもとに、使い方の改善案を聞くためのプロンプト")}
    <div class="askbar"><button class="pill" id="askcopy">プロンプトをコピー</button>
      <span class="muted" style="font-size:11.5px">お使いの AI エージェントに貼り付けて使います。kiroku は AI を呼び出しません。セッション名（依頼文の一部）とプロジェクト名を含むので、送る前に内容を確認してください。</span></div>
    <pre class="askpre" id="askpre">${esc(askPrompt(w, pw, M))}</pre></section></div>`;
  R.querySelectorAll(".card,.pses,.pheavy,.fses").forEach(c => c.onclick = () => select(c.dataset.id));
  R.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { // 気づきから、元の指標へ移動して説明を開く
    const t = R.querySelector(`.panel:not(.fd) .hb[data-help="${b.dataset.goto}"]`) || R.querySelector(`.panel.${b.dataset.goto}`); if (!t) return;
    const dt = t.closest("details"); if (dt && !dt.open){ dt.open = true; st.moreS = true; }
    t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
    if (t.classList.contains("hb") && t.getAttribute("aria-expanded") !== "true") t.click(); });
  const more = R.querySelector("#pmore"); if (more) more.onclick = () => { st.allProj = !st.allProj; summary(); };
  const ms = R.querySelector("#moreS"); if (ms) ms.ontoggle = () => { st.moreS = ms.open; };
  const ac = R.querySelector("#askcopy"); if (ac) ac.onclick = () => copy($("#askpre").textContent);
  R.querySelectorAll("#useBy button").forEach(b => b.onclick = () => { st.use = b.dataset.v; store.set("use", st.use); summary(); });
  bindCopy(R); bindHelp(R);
}
/* プロジェクト別：何に何時間、どれだけのトークン・コスト・クレジットを、どのモデル中心に使い、何が重かったか */
function projectPanel(w, ph, unit){
  const ps = w.projectStats || []; if (!ps.length) return "";
  const total = w.projects.reduce((t,[,v])=>t+v,0) || 1, LIMIT = 6, shown = st.allProj ? ps : ps.slice(0, LIMIT);
  const use = x => [x.cost >= 0.005 ? usd(x.cost) : "", x.credits ? cr(x.credits) : "", !x.cost && x.tokens ? tok(x.tokens)+" tok" : ""].filter(Boolean).join(" · ");
  const cards = shown.map(p => {
    const c = st.colorBy === "project" ? colorOf(p.project) : "var(--ink-3)", share = Math.round(p.minutes*100/total);
    const mt = p.models.reduce((t,m)=>t+m.tokens,0) || 1; // トークンのないモデル（Kiro など）は回数で出す
    return `<article class="pcard" style="--c:${c}">
      <div class="hd"><i></i><b title="${esc(p.project)}">${esc(p.project)}</b><span>${p.minutes ? dur(p.minutes) : "—"}${p.minutes ? ` · ${share}%` : ""}</span></div>
      <div class="bar2"><span style="width:${share}%"></span></div>
      <div class="kv"><div><div class="k">セッション/依頼</div><div class="v">${p.sessions}/${p.prompts}</div></div>
        <div><div class="k">トークン</div><div class="v">${p.tokens ? tok(p.tokens) : "—"}</div></div>
        <div><div class="k">目安コスト</div><div class="v">${p.cost >= 0.005 ? usd(p.cost) : "—"}</div></div>
        <div><div class="k">クレジット</div><div class="v">${p.credits ? cr(p.credits) : "—"}</div></div></div>
      ${(p.git && p.git.commits) || (p.outputs && (p.outputs.commits || p.outputs.prs)) ? `<div><div class="lab">成果の印</div><div class="pout">コミット ${p.git && p.git.commits ? `${p.git.commits}（AI ${p.git.ai}）` : p.outputs.commits} · PR ${p.outputs ? p.outputs.prs : 0} · <span>+${p.git && p.git.commits ? p.git.added : p.outputs.added} −${p.git && p.git.commits ? p.git.removed : p.outputs.removed} 行</span></div></div>` : ""}
      ${p.models.length ? `<div><div class="lab">中心のモデル</div><div class="mods">${p.models.map(m=>`<span title="${esc(m.model)}">${esc(m.model)}<b>${m.tokens ? Math.round(m.tokens*100/mt)+"%" : m.turns+"回"}</b></span>`).join("")}</div></div>` : ""}
      <div><div class="lab">何に時間を使ったか</div>${p.top.map(t=>`<button class="pses" data-id="${esc(t.id)}"><span class="t">${esc(t.title)}</span><span class="m">${dur(t.minutes)}${use(t) ? " · "+use(t) : ""}</span></button>`).join("")}</div>
      ${p.heavy && use(p.heavy) ? `<button class="pheavy" data-id="${esc(p.heavy.id)}"><em>いちばん重い</em><span class="t">${esc(p.heavy.title)}</span><span class="m">${use(p.heavy)}</span></button>` : ""}
    </article>`; }).join("");
  return `<section class="panel projs">${ph(2, "プロジェクト別", `この${unit}、どのプロジェクトに時間と AI を使ったか`, "projects")}
    <div class="pgrid">${cards}</div>
    ${ps.length > LIMIT ? `<button class="pill pmore" id="pmore">${st.allProj ? "上位だけにする" : `ほか ${ps.length - LIMIT} プロジェクトも見る`}</button>` : ""}</section>`;
}

    "- 数値はすべて履歴から推定した目安です。データから言えないことは、推測であると明記してください",
    "- 各指標の定義と、そこから言えること・言えないことは末尾の「指標の読み方」を参照してください",
    "", "# kiroku が基準で拾った気づき（判定ではなく候補）",

    "", "# 全体",
