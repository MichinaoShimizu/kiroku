  const allTok = [s.usage, ...s.subagents.map(a=>a.usage)].reduce((t,u)=>t + (u ? u.in+u.out+u.cw+u.cw1h+u.cr : 0), 0);
  const P = $("#panel");
  P.innerHTML = `<div style="--c:${colorOf(keyOf(s))}">
    <div class="eyebrow"><span class="dot"></span>${esc(s.source)}</div>
    <h2>${esc(s.title)}</h2>
    <div class="muted" style="font-variant-numeric:tabular-nums">${md(s.start)} ${hm(s.start)} 〜 ${sameDay ? "" : md(s.end)+" "}${hm(s.end)}</div>
    <div class="meta"><span>${esc(s.project)}</span>${s.branch?`<span>${esc(s.branch)}</span>`:""}</div>
    <div class="dcols"><div class="dcol">
    <div class="mini">
      <div><div class="k">作業していた時間</div><div class="v">${dur(active,true)}</div></div>
      <div><div class="k">依頼</div><div class="v">${s.nPrompts}<small>件</small></div></div>
      <div><div class="k">待たせ（中央値）</div><div class="v">${med==null?"—":secs(med).replace(/(分|秒)/g,"<small>$1</small>")}</div></div>
      <div><div class="k">言い直し・中断</div><div class="v">${s.corrections + s.interrupts}<small>回</small></div></div>
      ${s.limits && s.limits.length ? `<div><div class="k">利用上限に当たった</div><div class="v" style="color:var(--warn)">${s.limits.length}<small>回</small></div><div class="k" style="margin-top:2px">${s.limits.map(hm).join("・")}</div></div>` : ""}
      ${s.source === "Claude Code" ? `<div><div class="k">目安コスト${s.costReported ? "（Claude Code の集計）" : ""}</div><div class="v">${usd(s.cost).replace("$","<small>$</small>")}</div></div>
      <div><div class="k">トークン</div><div class="v">${tok(allTok)}</div></div>
      ${s.outputs && (s.outputs.commits || s.outputs.prs) ? `<div><div class="k">コミット / PR</div><div class="v">${s.outputs.commits}<small>/</small>${s.outputs.prs}</div></div>` : ""}
      ${s.outputs && (s.outputs.added || s.outputs.removed) ? `<div><div class="k">変更した行</div><div class="v"><small>+</small>${s.outputs.added}<small> −${s.outputs.removed}</small></div></div>` : ""}` : s.credits ? `<div><div class="k">Kiro クレジット</div><div class="v">${s.credits}</div></div><div><div class="k">1依頼あたり</div><div class="v">${s.nPrompts ? (s.credits/s.nPrompts).toFixed(2) : "—"}<small>クレジット</small></div></div>` : ""}
    </div>
    <div class="sact"><button class="pill" id="sreview">このセッションを AI と振り返る（プロンプトをコピー）</button>
      <span>依頼の流れと数値から、依頼の仕方や作業の分け方の改善点を聞きます。依頼文を含むので、送る前に確認してください。</span></div>
    <h3>依頼の流れ</h3>
    ${s.prompts.length ? `<ol class="tl">${s.prompts.slice(0,30).map(p=>`<li class="${/違う|ちがう|そうじゃな|やり直|戻して|元に戻|取り消|じゃなくて|wrong|revert|undo/i.test(p.text)?"fix":""}"><time>${p.t?hm(p.t):""}</time><p>${esc(p.text.length>220?p.text.slice(0,220)+"…":p.text)}</p></li>`).join("")}</ol>${s.prompts.length>30?`<p class="more">ほか ${s.nPrompts-30} 件</p>`:""}` : `<p class="none">依頼の記録はありません。${s.source === "Kiro Crew" ? "Kiro Crew は会話の記録を一定期間で消すため、使用量の記録だけが残っている会話です。" : ""}</p>`}
    ${s.subagents.length ? `<h3>サブエージェント · ${s.subagents.length}</h3>${s.subagents.map(a=>{
        const span = Math.max(1, s.end - s.start), l = a.start ? Math.max(0,(a.start - s.start)/span*100) : 0, w = a.start && a.end ? Math.max(.8,(a.end - a.start)/span*100) : .8;
        const t = a.usage, tt = t.in + t.out + t.cw + t.cw1h + t.cr;
        return `<div class="sub"><div class="hd"><span class="ty">${esc(a.type)}</span><span class="ds">${esc(a.desc || "（説明なし）")}</span>${a.bg?'<span class="bg">バックグラウンド</span>':""}</div>
          <div class="lane"><span style="left:${l}%;width:${Math.min(w,100-l)}%"></span></div>
          <div class="ft">${a.start?`<span>${hm(a.start)}${a.end?"–"+hm(a.end):""}</span>`:""}${a.start&&a.end?`<span>${dur((a.end-a.start)/60)}</span>`:""}${tt?`<span>${tok(tt)} トークン</span>`:t.reportedTokens?`<span>${tok(t.reportedTokens)} トークン（報告値）</span>`:""}${t.cost?`<span>${usd(t.cost)}</span>`:""}${a.model?`<span>${esc(a.model)}</span>`:""}${a.tools?`<span>ツール ${a.tools} 回</span>`:""}</div></div>`; }).join("")}` : ""}
    ${s.native && s.native.length ? `<h3>${esc(s.source)} の参考指標</h3>${nativeRows(s.native)}<p class="note">このエージェントが記録している数字です。ほかのエージェントとは定義が違います。</p>` : ""}
    </div><div class="dcol">
    ${sessionCommits(s)}
    ${s.prs && s.prs.length ? `<h3>作った PR · ${s.prs.length}</h3><ul class="files">${s.prs.map(u => `<li title="${esc(u)}"><span>${ext(u, esc(u.replace(/^https?:\/\//, "")))}</span></li>`).join("")}</ul>` : ""}
    <h3>変更したファイル · ${s.nFiles}</h3>
    ${s.files.length ? `<ul class="files">${s.files.map(f=>{ const u = fileLink(s, f); return `<li title="${esc(f)}"><span>${u ? ext(u, esc(f)) : esc(f)}</span></li>`; }).join("")}</ul>` : '<p class="none">なし</p>'}
    ${s.files.length && commitsOf(s).some(c => c.url) ? '<p class="note">リンクは、このセッションの間のコミットでの、そのファイルを開きます。</p>' : ""}
    ${s.models.length ? `<h3>使ったモデル</h3><div class="chips">${s.models.map(([m,n])=>`<span class="mono">${esc(m)}<b>${n}</b></span>`).join("")}</div>` : ""}
    <h3>使ったツール</h3>
    ${s.tools.length ? s.tools.map(([k,v])=>`<div class="trow"><span class="nm">${esc(k)}</span><span class="track2"><span style="width:${v/maxT*100}%"></span></span><span class="n">${v}</span></div>`).join("") : '<p class="none">記録なし</p>'}
    ${s.file ? `<h3>履歴ファイル</h3><div class="code"><code>${esc(s.file)}</code><a class="copy" href="${esc(LIVE ? "history?id=" + encodeURIComponent(s.id) : fileHref(s.file))}" target="_blank" rel="noopener">開く</a><button class="copy" data-copy="${esc(s.file)}">コピー</button></div>` : ""}
    ${s.resume ? `<h3>続きから再開</h3><div class="code"><code>${esc(s.resume)}</code><button class="copy" data-copy="${esc(s.resume)}">コピー</button></div>` : ""}
  </div></div></div>`;
  P.querySelectorAll("[data-git]").forEach(b => b.onclick = () => select("git:" + b.dataset.git));
  P.querySelector("#sreview").onclick = () => copy(sessionPrompt(s, active, med));
  bindCopy(P);
}
/* 1 つのセッションを AI と振り返るためのプロンプト（kiroku 自身は AI を呼ばない） */
function sessionPrompt(s, active, med){
  const o = s.outputs || {}, L = [
    "あなたは AI エージェント活用のアドバイザーです。以下は、私が AI エージェントと行った 1 つのセッションの記録です（kiroku で集計）。",
    "", "# 回答してほしいこと",
    "1. このセッションの進め方で良かった点",
    "2. 最初の依頼にあれば手戻りを減らせた情報（前提・制約・完了条件など）",
    "3. 依頼の分け方や順番の改善案と、次に同じような作業をするときの最初の依頼文の例",
    "", "# 前提",
    "- 数値は履歴から推定した目安です。データから言えないことは、推測であると明記してください",
    "- 目安コストは API の公開料金での換算値で、実際の請求額ではありません",
    "", "# セッション",
    `- エージェント: ${s.source}`, `- プロジェクト: ${s.project}${s.branch ? `（ブランチ ${s.branch}）` : ""}`,
    `- 時間: ${md(s.start)} ${hm(s.start)}〜${hm(s.end)}、作業していた時間 ${dur(active)}`,
    `- 依頼: ${s.nPrompts} 件、言い直し ${s.corrections} 回、中断 ${s.interrupts} 回${med == null ? "" : `、待たせ時間の中央値 ${secs(med)}`}`];
  if (s.limits && s.limits.length) L.push(`- 利用上限に当たった: ${s.limits.length} 回（${s.limits.map(hm).join("、")}）`);
  if (s.cost) L.push(`- 目安コスト: ${usd(s.cost)}`);
  if (s.credits) L.push(`- Kiro クレジット: ${s.credits}`);
  if (o.commits || o.prs) L.push(`- コミット ${o.commits} 回、PR ${o.prs} 件、変更した行 +${o.added} −${o.removed}`);
  else L.push("- コミット・PR の記録はありません");
  if (s.tools.length) L.push(`- よく使ったツール: ${s.tools.slice(0,6).map(([k,v]) => `${k} ${v}`).join("、")}`);
  if (s.subagents.length) L.push(`- サブエージェント: ${s.subagents.length} 回`);
  L.push("", "# 依頼の流れ（時刻と依頼文。長いものは省略）");
  if (s.prompts.length) s.prompts.slice(0, 40).forEach(p => { const t = String(p.text || "").replace(/\s+/g, " ").trim(); L.push(`- ${p.t ? hm(p.t) : "--:--"} ${t.length > 300 ? t.slice(0, 300) + "…" : t}`); });
  else L.push("- 依頼の記録はありません");
  if (s.prompts.length > 40) L.push(`- ほか ${s.nPrompts - 40} 件`);
  return L.join("\n");
}
function select(id){ st.sel = id; tipOff(); render(); if (id) $("#panel").scrollTop = 0; }

/* ── events ── */
function go(n){
  if (st.mode === "month") st.month = n == null ? monthOf(new Date()) : new Date(st.month.getFullYear(), st.month.getMonth()+n, 1);
  else st.week = n == null ? mondayOf(new Date()) : addDays(st.week, 7*n);
  st.sel = null; st.animate = true; render(); scrollToWork(); }
function setMode(m){ if (m === "month" && st.mode !== "month") st.month = monthOf(addDays(st.week, 3));
  if (m === "week" && st.mode === "month" && monthOf(st.week).getTime() !== st.month.getTime()) st.week = mondayOf(st.month);
  st.mode = m; store.set("mode", m); st.sel = null; st.animate = true; render(); scrollToWork(); }
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => setMode(b.dataset.v));
$("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1); $("#today").onclick = () => go(null);
$("#zin").onclick = () => zoom(1); $("#zout").onclick = () => zoom(-1);
function zoom(dv){ st.z = Math.max(0, Math.min(HOURS.length-1, st.z+dv)); store.set("zh", st.z); render(); scrollToWork(); }
document.querySelectorAll("#colorBy button").forEach(b => b.onclick = () => { st.colorBy = b.dataset.v; st.hidden.clear(); store.set("colorBy", st.colorBy); render(); });
$("#q").oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
$("#theme").onclick = () => { st.theme = {auto:"light",light:"dark",dark:"auto"}[st.theme]; store.set("theme", st.theme); applyTheme(); };
$("#help").onclick = () => $("#keys").showModal();
$("#scrim").onclick = () => select(null); $("#close").onclick = () => select(null); $("#back").onclick = () => select(null);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT"){ if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || $("#keys").open) return;
  const k = e.key;
  if (k === "ArrowLeft") go(-1); else if (k === "ArrowRight") go(1); else if (k === "t" || k === "T") go(null);
  else if (k === "/"){ e.preventDefault(); $("#q").focus(); } else if (k === "+" || k === "=") zoom(1); else if (k === "-") zoom(-1);
  else if (k === "Escape" && st.sel) select(null); else if (k === "?") $("#keys").showModal();
  else if (k === "w" || k === "W") setMode("week"); else if (k === "m" || k === "M") setMode("month");
});
function scrollToWork(){ // その週の作業が始まるころの少し前へ
  const sc = $("#tl .calscroll"); if (!sc) return;
  const ws = st.week.getTime()/1000, we = ws + 7*86400, hs = [];
  DATA.forEach(s => s.segs.forEach(([a,b]) => { if (b > ws && a < we) hs.push(new Date(Math.max(a,ws)*1000).getHours()); }));
  hs.sort((a,b) => a-b); // 深夜の 1 本に引っぱられないよう、早いほうから 2 割の開始時刻へ
  const first = hs.length ? hs[Math.floor(hs.length*0.2)] : 24;
  sc.scrollTop = Math.max(0, Math.max(0, (first === 24 ? 8 : first) - 1) * (HOURS[st.z] || 44) - 14);
}
// 今週に記録がなければ、いちばん新しい記録の週から開く
if (DATA.length && !WEEKS[key(st.week)]) st.week = mondayOf(new Date(DATA[DATA.length-1].end*1000));
if (DATA.length && !MONTHS[mkey(st.month)]) st.month = monthOf(new Date(DATA[DATA.length-1].end*1000));
const mq = matchMedia("(max-width:820px)"), ph = () => $("#q").placeholder = mq.matches ? "検索" : "タイトル・依頼文で探す";
mq.addEventListener("change", () => { ph(); render(); }); ph();
applyTheme(); render(); scrollToWork();

/* ── live（kiroku serve） ── 新しい履歴を見つけたら、見ている週・選んだセッションはそのままで取り込む */
if (LIVE){
  const badge = $("#live"); badge.hidden = false;
  let busy = false;
  async function poll(){
    if (busy || document.hidden) return; busy = true;
    try {
      const r = await fetch("stamp", {cache:"no-store"}); if (!r.ok) throw new Error(r.status);
      if (parseFloat(await r.text()) !== GENERATED){
        const j = await (await fetch("data.json", {cache:"no-store"})).json(), before = DATA.length;
        DATA = j.sessions || []; WEEKS = j.weeks || {}; MONTHS = j.months || {}; META = j.meta; GENERATED = j.generated;
        if (st.sel && !DATA.some(s => s.id === st.sel)) st.sel = null;
        render();
        const d = DATA.length - before;
        toast(d > 0 ? `新しいセッションを ${d} 件取り込みました` : "最新の履歴を反映しました");
      }
      badge.classList.remove("off"); badge.title = `履歴が増えると自動で反映します（最終確認 ${new Date().toLocaleTimeString("ja-JP")}）`;
    } catch(e){ badge.classList.add("off"); badge.title = "kiroku serve とつながっていません。止めた場合は、もう一度起動すると再開します"; }
    busy = false;
  }
  setInterval(poll, 3000); document.addEventListener("visibilitychange", poll);
}
</script></body></html>
