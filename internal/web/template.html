<!doctype html>
<html lang="ja" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/* ── tokens ─────────────────────────────────────────────
   グラファイトの面に、インディゴを 1 色だけ。区分の色は Okabe–Ito（色覚の違いがあっても見分けやすい 8 色） */
:root{
  color-scheme:light;
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --ink:#121419; --ink-2:#464b56; --ink-3:#5f6573;
  --rule:#e1e4ea; --rule-2:#cdd2db; --acc:#4338ca; --acc-ink:#3730a3; --on-acc:#ffffff; --heatk:22%; --acc-soft:rgba(67,56,202,.08); --warn:#b42318; --on-warn:#ffffff;
  --night:rgba(18,20,25,.035); --weekend:rgba(18,20,25,.022);
  --shadow:0 1px 2px rgba(16,18,24,.06),0 12px 32px -14px rgba(16,18,24,.22);
  --c0:#0072b2; --c1:#d55e00; --c2:#009e73; --c3:#cc79a7; --c4:#e69f00; --c5:#56b4e9; --c6:#7a5cc4; --c7:#9a8a00; --other:#9aa0ab;
  --sans:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f13; --surface:#16181e; --surface-2:#1e2129; --ink:#eceef3; --ink-2:#b4b9c4; --ink-3:#8c92a0;
  --rule:#252832; --rule-2:#333743; --acc:#818cf8; --acc-ink:#a5b4fc; --on-acc:#0e0f13; --heatk:42%; --acc-soft:rgba(129,140,248,.12); --warn:#f97066; --on-warn:#0e0f13;
  --night:rgba(255,255,255,.025); --weekend:rgba(255,255,255,.018);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
  --c0:#3a9be0; --c1:#f07a2b; --c2:#1fbf8f; --c3:#e08fbd; --c4:#f2b53a; --c5:#7cc6f0; --c6:#9c84e6; --c7:#c9b51c; --other:#6b7180;
}

/* ── base ───────────────────────────────────────────────── */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1560px;margin:0 auto;padding:0 28px}

/* ── header ─────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:10;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:28px;height:28px;flex:none}
.word{font:700 16px/1 var(--sans);letter-spacing:-.01em}
.tag{font-size:11.5px;color:var(--ink-3);padding-left:10px;margin-left:2px;border-left:1px solid var(--rule-2);white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--sans);letter-spacing:.12em;color:var(--acc-ink);background:var(--acc-soft);border-radius:99px;padding:5px 8px 5px 7px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2.4s var(--ease) infinite}
.live.off{color:var(--ink-3);background:var(--surface-2)} .live.off::before{animation:none;opacity:.5}
.live[hidden]{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2);transition:background .2s var(--ease),color .2s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.pill{height:30px;padding:0 12px;border:1px solid var(--rule-2);border-radius:8px;font-size:12px;color:var(--ink-2);background:var(--surface);transition:all .2s var(--ease);white-space:nowrap}
.pill:hover{border-color:var(--ink-3);color:var(--ink)}
.segc{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.segc button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--ink-2);transition:all .2s var(--ease);white-space:nowrap}
.segc button:hover{color:var(--ink)}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.search{position:relative}
.search input{width:250px;height:32px;border-radius:9px;border:1px solid var(--rule-2);background:var(--surface);padding:0 30px 0 32px;font-size:12.5px;transition:border-color .2s,width .3s var(--ease)}
.search input:focus{outline:none;border-color:var(--acc);width:290px}
.search svg{position:absolute;left:10px;top:8px;color:var(--ink-3)}
.search kbd{position:absolute;right:8px;top:7px}
kbd{font:11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-3);background:var(--surface)}

/* ── week strip ─────────────────────────────────────────── */
.week{display:flex;align-items:flex-end;gap:28px;padding:26px 0 18px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:6px}
.wk .lbl{min-width:0}
.wk .y{font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--acc-ink);text-transform:uppercase}
.wk .d{font:700 30px/1.1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:6px}
.wk .d span{color:var(--ink-3);font-weight:500;margin:0 .18em}
.wk .nav{display:flex;gap:4px;align-self:flex-end;margin-left:10px}
.kpis{display:flex;gap:0;margin-left:auto;border:1px solid var(--rule);border-radius:14px;background:var(--surface);overflow:hidden}
.kpi{padding:10px 18px 9px;min-width:118px;border-left:1px solid var(--rule)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:11px;color:var(--ink-3);white-space:nowrap}
.kpi .v{font:700 20px/1.3 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11.5px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi.alert .v{color:var(--warn)}

/* ── legend ─────────────────────────────────────────────── */
.legend{position:relative;display:flex;align-items:center;gap:6px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none} /* 読み上げ用の .sr（absolute）が横スクロールの外へはみ出してページを広げないように */
.legend::-webkit-scrollbar{display:none}
.legend .lab{font-size:11px;letter-spacing:.08em;color:var(--ink-3);margin-right:4px;white-space:nowrap}
.legend .lab small{letter-spacing:0;font-size:10px;margin-left:2px}
.cbsel{display:none;flex:none}
.langsel select{height:30px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12px;padding:0 4px;cursor:pointer}
.langsel select:hover{border-color:var(--ink-3);color:var(--ink)}
.cbsel select{height:28px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12px;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 9px;border-radius:7px;font-size:12px;color:var(--ink-2);border:1px solid var(--rule);background:var(--surface);transition:all .2s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--rule-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45}.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.legend .count{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:12px}

/* ── week calendar（曜日が列、時刻が縦） ───────────────── */
.tlbox{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden;position:relative}
.calscroll{overflow:auto;max-height:min(74vh,880px);scrollbar-width:thin;overscroll-behavior:contain}
.calin{min-width:720px;position:relative}
.heads,.cgrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.heads{position:sticky;top:0;z-index:8;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.head{padding:10px 12px 9px;border-left:1px solid var(--rule);min-width:0}
.head .dd{display:flex;align-items:baseline;gap:6px}
.head b{font:700 17px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.head i{font-style:normal;font-size:11px;color:var(--ink-3)}
.head small{display:block;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
.head.today{box-shadow:inset 0 -2px 0 var(--acc)}
.head.today b,.head.today i{color:var(--acc-ink)}
.hours{position:sticky;left:0;z-index:6;background:var(--surface)}
.heads>div:first-child{position:sticky;left:0;z-index:9;background:var(--surface)}
.hours span{position:absolute;right:9px;transform:translateY(-50%);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hours span.now{right:4px;color:var(--on-acc);background:var(--acc);border-radius:5px;padding:1px 4px;font-weight:600;z-index:3}
.day{position:relative;border-left:1px solid var(--rule);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% var(--hh)}
.day.we{background-color:var(--weekend)}
.day.today{background-color:color-mix(in oklab,var(--acc) 4%,transparent)}
.day .nb{position:absolute;left:0;right:0;background:var(--night);pointer-events:none}
.run{position:absolute;border-radius:8px;padding:4px 7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  background:color-mix(in oklab,var(--c) var(--fill),var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 55%,transparent);
  font-size:11px;line-height:1.3;color:var(--ink);text-align:left;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .25s var(--ease),filter .25s;
  animation:rise .5s var(--ease) both;animation-delay:var(--delay,0ms)}
.run.thin{padding:0;border-radius:4px}
.run .t{display:flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.run .t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.run .t span{overflow:hidden;text-overflow:ellipsis}
.run .m{color:var(--ink-2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.run:hover{box-shadow:inset 0 0 0 1.5px var(--c),var(--shadow);z-index:4}
.tlbox.focus .run{opacity:.25;filter:saturate(.5)}
.tlbox.focus .run.sel{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--c),var(--shadow);z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.lim{position:absolute;left:3px;z-index:3;height:16px;margin-top:-8px;padding:0 6px;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;color:var(--on-warn);background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.lim:hover{filter:brightness(1.1)}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--acc);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.empty{padding:56px 16px 60px;text-align:center;color:var(--ink-3)}
.empty svg{width:56px;height:56px;color:var(--rule-2);stroke-width:1.2}
.empty p{margin:10px 0 0}

.head .use,.cell .use{display:block;font-size:10.5px;color:var(--acc-ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar{display:grid;gap:3px;align-items:end;height:132px;padding-top:6px}
.ubar .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.ubar .b{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--acc);opacity:.85;min-height:0}
.ubar .c:hover .b{opacity:1}
.ubar .l{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;height:12px}
.ubar .c.today .l{color:var(--acc-ink);font-weight:700}
.ubar .v{font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums;height:12px;white-space:nowrap}
.useg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 4px}
.useg .segc button{height:24px;font-size:11.5px}
/* ── project（プロジェクト別のまとめ） ──────────────────── */
.panel.projs,.panel.oc{grid-column:1/-1}
.ocgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;margin-top:8px}
.fss{display:flex;flex-direction:column;gap:2px;min-width:0}
.fses{display:flex;align-items:center;gap:7px;font-size:12px;text-align:left;padding:3px 0;min-width:0}
.fses i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.fses small{color:var(--ink-3);font-size:11px;flex:none}
.fses span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fses:hover span{color:var(--acc-ink);text-decoration:underline}
.flink{color:var(--acc-ink);font-size:11.5px;font-weight:600}
.flink:hover{text-decoration:underline}
.spark{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--ink-3);min-width:0}
.spark svg{flex:none;overflow:visible}
.spark polyline{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--acc)}
.spark small{font-size:10.5px;line-height:1.4;flex:1 1 12em;min-width:0}
.spark small b{color:var(--ink-2);font-size:11.5px;font-variant-numeric:tabular-nums;margin-right:2px}
.flagsum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px;font-size:12.5px}
.flagsum .lbl{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--ink-2)}
.flagsum .hint{flex-basis:100%}
.fdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);flex:none}
.stat.flagged{box-shadow:inset 3px 0 0 var(--acc);grid-column:1/-1}
.fl .more{margin:0;font-size:11px}
.moreS summary .fdot{margin-left:8px;vertical-align:1px}
.fl{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:8px 0 2px;border-top:1px dashed var(--rule-2);min-width:0;overflow-wrap:anywhere}
.fl p{margin:0}
.fl .see{font-size:12.5px;font-weight:600;line-height:1.55;color:var(--ink)}
.fl .see .fdot{margin-right:7px;vertical-align:1px}
.fl .rule{font-size:11px;color:var(--ink-3)}
.fl .why{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.sact{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--acc-soft)}
.sact .pill{align-self:flex-start;max-width:100%;height:auto;min-height:30px;padding:6px 12px;white-space:normal;text-align:left;line-height:1.45;color:var(--acc-ink);border-color:color-mix(in oklab,var(--acc) 35%,var(--rule-2));font-weight:600}
.sact span{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.keep{margin:0 0 16px;padding:14px 18px;border-radius:12px;border:1px solid color-mix(in oklab,var(--warn) 45%,var(--rule));background:color-mix(in oklab,var(--warn) 7%,var(--surface))}
.keep b{display:block;font-size:14px;color:var(--warn);margin-bottom:4px}
.keep p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.keep code,.mlist code{font-size:11.5px;padding:0 4px;border-radius:4px;background:var(--surface-2)}
.keep .ka{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mlist .kw{color:var(--warn)}
.moreS{margin-top:10px}
.moreS summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:4px 0}
.moreS .stats{margin-top:8px}
.ocl{font:600 11px/1 var(--sans);letter-spacing:.06em;color:var(--ink-3);margin:6px 0 -6px}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.shh{margin:12px 0 2px}
.shn{margin:0;font-size:11px;color:var(--ink-3)}
.sharebox{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 28px;align-items:center;margin-top:10px}
@media (max-width:1000px){.sharebox{grid-template-columns:minmax(0,1fr)}}
.share{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.share .k{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.share .stack{margin:0;height:14px;border-radius:4px}
.shtab{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.shtab th,.shtab td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--rule)}
.shtab th{font-weight:600;color:var(--ink-3);font-size:11px}
.shtab th:first-child,.shtab td:first-child{text-align:left;max-width:0;width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shtab td:first-child i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.shtab tr:last-child td{border-bottom:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px;margin-top:12px}
.pcard{border:1px solid var(--rule);border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;
  background:linear-gradient(180deg,color-mix(in oklab,var(--c) 7%,var(--surface)),var(--surface) 70px)}
.pcard .hd{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .hd i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pcard .hd b{font:700 15px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .hd span{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pcard .bar2{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:-4px}
.pcard .bar2 span{display:block;height:100%;background:var(--c);border-radius:3px}
.pcard .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pcard .kv>div{background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0} /* 値はいつもラベルの下に（値の長さでカードごとに並びが変わらないように） */
.pcard .kv .k{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.pcard .kv .v{font:700 14px/1.3 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .lab{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.pcard .mods{display:flex;flex-wrap:wrap;gap:5px}
.pcard .mods span{font:11px var(--mono);color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.pcard .mods span b{font-family:var(--sans);font-weight:600;color:var(--ink);margin-left:4px}

/* AI の使い方 */
.mrow{display:grid;grid-template-columns:1fr auto 40px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--rule)}

.sub .ty{font:600 11px var(--mono);color:var(--ink);background:var(--surface-2);border-radius:5px;padding:1px 7px;flex:none}
.sub .ds{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.sub .bg{font-size:10.5px;color:var(--acc-ink);flex:none}

.note{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.7}

/* ── drawer（セッションの詳細） ──────────────────────────── */
/* 画面の真ん中に出すモーダル。後ろのカレンダーはしっかり沈め、縁を線と影ではっきりさせる。ダークでは面の明るさが近いので幕を濃くする */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}

.drawer{position:fixed;top:50%;left:50%;z-index:21;width:min(760px,calc(100vw - 48px));max-height:min(92vh,1100px);background:var(--surface);border:1px solid var(--rule-2);border-radius:18px;
  box-shadow:0 40px 100px -20px rgba(0,0,0,.6);overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-48%) scale(.97);
  transition:transform .28s var(--ease),opacity .2s var(--ease),visibility 0s .28s;display:flex;flex-direction:column}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%);transition:transform .28s var(--ease),opacity .2s var(--ease)}
.drawer .mini{grid-template-columns:repeat(3,minmax(0,1fr))}
/* 広い画面では、左に「何をしたか」（数値・依頼の流れ）、右に「何が残ったか」（コミット・PR・ファイル） */
@media (min-width:1100px){

}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px 28px;border-bottom:1px solid var(--rule)}
.drawer .db{overflow:auto;padding:22px 28px 48px;flex:1;scrollbar-width:thin;font-size:14px}
/* パネルの中は読み物なので、一覧より一回り大きく・濃く */
.drawer .back{font-size:13px;color:var(--ink-2)}

/* toast & dialog */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:all .25s var(--ease);z-index:50;pointer-events:none}

.yropts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12px;color:var(--ink-2)}

.yrtn>span{display:flex;flex-direction:column;align-items:center;gap:.1em} /* 縦書きは 1 字ずつ積む（writing-mode は縦の送り幅を持たないフォントで潰れる） */
.yrtn i{font-style:normal}.yrtn i.r{transform:rotate(90deg)}
.yrtn.h{flex-direction:column;gap:4px;font-size:30px;letter-spacing:0}.yrtn.h>span{display:inline}
.yrtn .pre{font-size:20px;font-weight:700;color:#d98a3a}:root:not([data-theme="dark"]) .yrtn .pre:not(.over){color:#a85a12} /* 白地でも 3:1 以上 */.yrtn .pre.over{color:var(--warn)}
.yrtd{margin:0;font-size:14px}
.yrev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 0}
.yrev div{border-top:1px solid var(--rule);padding-top:8px;min-width:0}
.yrev dt{font-size:11px;color:var(--ink-3)}
.yrev dd{margin:2px 0 0;font:700 18px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.yrtypes summary{cursor:pointer;font-size:12px;color:var(--ink-2);margin-top:14px}
.yrtypes ul{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:12px;color:var(--ink-2)}

.yrexp.ok{color:var(--acc-ink);border-color:var(--acc)}.yrexp.over{color:var(--warn);border-color:var(--warn)}
.yrmeter{display:grid;gap:10px;margin:12px 0 0}
.yrmeter div{display:grid;grid-template-columns:9em minmax(0,1fr);gap:12px;align-items:center;border-top:1px solid var(--rule);padding-top:8px}
.yrmeter dt{font-weight:700;font-size:13px}.yrmeter dt small{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}

.yrmeter .pp{display:inline-flex;gap:3px}.yrmeter .pp i{width:10px;height:8px;border-radius:3px;background:var(--rule-2)}.yrmeter .pp i.on{background:#ffae57;box-shadow:0 0 8px rgba(255,174,87,.6)}
.yrmeter .pv{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.yrmeter .neg .pp i.on{background:#ff7a5c;box-shadow:0 0 8px rgba(255,122,92,.6)}.yrgrade .yrexp + .yrexp{margin-left:6px}
@media (max-width:820px){dialog.yr{padding:18px 16px 24px;width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}
  .yrhow,.yrev,.yrtypes ul,.yrtype{grid-template-columns:minmax(0,1fr)}.yrtn{flex-direction:column;gap:4px;font-size:30px;letter-spacing:0}.yrtn>span{display:block}.yrtn i.r{transform:none}
  .yrmeter div{grid-template-columns:minmax(0,1fr)}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:12.5px;margin-top:14px;align-items:center}

@media (max-width:1320px){.rvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel.shape{grid-column:1/-1}}

}

<script>
let DATA = __DATA__;
let WEEKS = __WEEKS__;
let MONTHS = __MONTHS__;
let META = __META__;
let GENERATED = __GEN__;
/* デモ（GitHub Pages）では、ダミーデータを作った時間帯の時計で見せる。どこから開いても「朝から夜に作業した」ように見え、
   日ごとの集計（作った時間帯で区切っている）とも食い違わない。時刻らしい数（UNIX 秒）と「今」を同じだけずらす */
const SHIFT = META && META.demo ? META.demo.offset + new Date().getTimezoneOffset() * 60 : 0;
const nowMs = () => Date.now() + SHIFT * 1000, today0 = () => new Date(nowMs());
function shiftTimes(x){ if (!SHIFT) return x;
  const walk = v => Array.isArray(v) ? v.map(walk) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, y]) => [k, walk(y)])) : typeof v === "number" && v > 1e9 && v < 4e9 ? v + SHIFT : v;
  return walk(x); }
[DATA, WEEKS, MONTHS, META, GENERATED] = [shiftTimes(DATA), shiftTimes(WEEKS), shiftTimes(MONTHS), shiftTimes(META), shiftTimes(GENERATED)];
const LIVE = __LIVE__; // kiroku serve で開いたとき true
const PROMPT_RUNES = __PROMPT_RUNES__; // HTML に入れる依頼文の長さ（core.PromptRunes）
const YEAR_ON = false; // 1 年の露光は一旦隠す（ボタンと Y キーを出さない）。戻すときは true にする
const SLOTS = 8;
const $ = s => document.querySelector(s);
const store = { get(k,d){ try { const v = localStorage.getItem("kiroku:"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k,v){ try { localStorage.setItem("kiroku:"+k, JSON.stringify(v)); } catch(e){} } };
/* 言語：保存した設定、なければブラウザの言語（先頭が ja なら日本語、それ以外は英語）。文言は tr(日本語, 英語) で同じ場所に並べて書く */
let LANG = (() => { const v = store.get("lang", null); if (v === "ja" || v === "en") return v;
  const l = (navigator.languages && navigator.languages[0]) || navigator.language || ""; return /^ja/i.test(l) ? "ja" : "en"; })();
const EN = () => LANG === "en";
const tr = (ja, en) => EN() ? en : ja;
const LOC = () => tr("ja-JP", "en-US");
const DOW_JA = ["日","月","火","水","木","金","土"], DOW_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dow = i => (EN() ? DOW_EN : DOW_JA)[i];
const SRC_EN = {"Kiro IDE (旧)": "Kiro IDE (legacy)"}; // 画面に出すエージェント名（英語表示のとき）
const sn = x => EN() && SRC_EN[x] || x;
const mn = x => EN() && /^[（(]不明[）)]$/.test(x) ? "(unknown)" : x; // 名前のわからないモデル
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
const st = { z: store.get("zh", 2), colorBy: store.get("colorBy", "project"), theme: store.get("theme", "dark") === "light" ? "light" : "dark", // 既定はダーク（以前の「自動」もダークにする）
             week: mondayOf(today0()), month: monthOf(today0()), mode: store.get("mode", "week"), use: store.get("use", "tokens"),
             hidden: new Set(), sel: null, back: [], q: "", animate: true };

/* ── helpers ── */
function mondayOf(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function monthOf(d){ d = new Date(d); return new Date(d.getFullYear(), d.getMonth(), 1); }
function mkey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function addDays(d,n){ d = new Date(d); d.setDate(d.getDate()+n); return d; }
function key(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hm(t){ return new Date(t*1000).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}); }
function md(t){ const d = new Date(t*1000); return EN() ? `${DOW_EN[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}` : `${d.getMonth()+1}/${d.getDate()}(${DOW_JA[d.getDay()]})`; }
function dur(m, html){ m = Math.round(m); const h = Math.floor(m/60), r = m%60;
  if (EN()){ const u = x => html ? `<small>${x}</small>` : x; return h ? `${h}${u("h")}${r ? ` ${r}${u("m")}` : ""}` : `${r}${u("m")}`; }
  if (!html) return h ? `${h}時間${r ? String(r).padStart(2,"0")+"分" : ""}` : `${r}分`;
  return h ? `${h}<small>時間</small>${r ? String(r).padStart(2,"0")+"<small>分</small>" : ""}` : `${r}<small>分</small>`; }
function tok(n){ n = n || 0; return n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"K" : String(n); }
function usd(v){ return v == null ? "—" : v > 0 && v < 0.01 ? "<$0.01" : "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2)); }
function cr(v){ return `${Number(v.toFixed(2)).toLocaleString(LOC())} cr`; }
function useShort(d){ if (!d) return ""; const p = []; if (d.tokens) p.push(tok(d.tokens)); if (d.cost >= 0.005) p.push(usd(d.cost)); if (d.credits) p.push(cr(d.credits)); return p.join(" · "); }
function shade(i){ return [1,.72,.5,.34,.22,.14][Math.min(i,5)]; }
function secs(v){ return v == null ? "—" : EN() ? (v < 60 ? `${v}s` : `${Math.floor(v/60)}m ${v%60}s`) : v < 60 ? `${v}秒` : `${Math.floor(v/60)}分${String(v%60).padStart(2,"0")}秒`; }
function secsH(v){ return secs(v).replace(/(分|秒|(?<=\d)[ms]\b)/g, "<small>$1</small>"); } // 単位を小さく
function isoWeek(d){ d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate()+4-n);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(((d-y0)/864e5+1)/7); }
const keyOf = s => st.colorBy === "project" ? s.project : st.colorBy === "source" ? s.source : `${s.project} · ${s.branch || "—"}`;
let slot = {};
function assignColors(){ // 全期間の多い順に固定。週を変えても、非表示にしても色は変わらない
  const n = {}; DATA.forEach(s => n[keyOf(s)] = (n[keyOf(s)]||0) + 1);
  slot = {}; Object.keys(n).sort((a,b)=>n[b]-n[a]).forEach((k,i) => slot[k] = i < SLOTS ? `var(--c${i})` : "var(--other)");
}
const colorOf = k => slot[k] || "var(--other)";
function matches(s){
  if (st.hidden.has(keyOf(s))) return false;
  return !st.q || searchText(s).includes(st.q);
}
/* 検索の対象：タイトル・依頼文・プロジェクト・ブランチ・ツール・変更したファイル・PR・そのセッションの間のコミット（件名・ハッシュ・ファイル） */
const SQ = new WeakMap(); // DATA が入れ替わる（自動更新）と作り直される
function searchText(s){
  let t = SQ.get(s);
  if (t == null){ t = [s.title, s.project, s.branch || "", s.source, ...s.prompts.map(p => p.text), ...s.files, ...(s.prs || []),
      ...commitsOf(s).flatMap(c => [c.hash, c.subject, ...(c.files || []).map(f => f.path)])].join("\n").toLowerCase(); SQ.set(s, t); }
  return t;
}
function toast(msg, ms){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("on"), ms || 1600); }
async function copy(text, msg, ms){ try { await navigator.clipboard.writeText(text); toast(msg || tr("コピーしました", "Copied"), ms); } catch(e){ toast(tr("コピーできませんでした", "Couldn't copy")); } }
const ICON = { light:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  dark:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>' };

  const next = st.theme === "dark" ? "light" : "dark";
  $("#theme").innerHTML = ICON[next]; $("#theme").setAttribute("aria-label", tr(`${{light:"ライト",dark:"ダーク"}[next]}テーマに切り替え`, `Switch to ${next} theme`)); }
const CB = () => ({project: tr("プロジェクト", "Project"), branch: tr("ブランチ", "Branch"), source: tr("エージェント", "Agent")});

/* ── render ── */
const HOURS = [28, 36, 44, 56, 72, 96]; // 1 時間の高さ（ズーム）
function period(){ // 今見ている期間 [ws, we) と、その集計
  if (st.mode === "month"){ const a = st.month, b = new Date(a.getFullYear(), a.getMonth()+1, 1); return {ws:a.getTime()/1000, we:b.getTime()/1000, S:MONTHS[mkey(a)], P:MONTHS[mkey(new Date(a.getFullYear(), a.getMonth()-1, 1))]}; }

}
function render(){
  assignColors();
  const {ws, we} = period(), M = st.mode === "month";
  const todayKey = key(today0()), end = addDays(st.week,6);
  if (M){ $("#ry").textContent = `${st.month.getFullYear()} · Month`; $("#rd").innerHTML = `${st.month.getFullYear()}<span>.</span>${st.month.getMonth()+1}`; }
  else { $("#ry").textContent = `${st.week.getFullYear()} · Week ${isoWeek(st.week)}`; $("#rd").innerHTML = `${st.week.getMonth()+1}.${st.week.getDate()}<span>—</span>${end.getMonth()+1}.${end.getDate()}`; }
  $("#today").textContent = M ? tr("今月", "This month") : tr("今週", "This week");
  $("#yrbtn").textContent = tr("1 年の露光", "Year in review"); $("#yrbtn").hidden = !YEAR_ON || !DATA.length;
  $("#prev").setAttribute("aria-label", M ? tr("前の月", "Previous month") : tr("前の週", "Previous week")); $("#next").setAttribute("aria-label", M ? tr("次の月", "Next month") : tr("次の週", "Next week"));
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.mode));
  document.querySelectorAll("#colorBy button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.colorBy));
  document.querySelector(".zoom").style.visibility = M ? "hidden" : "";

  const inRange = DATA.filter(s => s.end >= ws && s.start < we);
  const shown = inRange.filter(matches);
  kpis();
  // legend（この期間にあるものを多い順に）
  const cnt = {}; inRange.forEach(s => cnt[keyOf(s)] = (cnt[keyOf(s)]||0)+1);
  $("#legend").innerHTML = `<label class="cbsel"><span class="sr">${tr("色分け", "Color by")}</span><select id="cb2">${Object.entries(CB()).map(([v,l]) => `<option value="${v}"${st.colorBy === v ? " selected" : ""}>${l}</option>`).join("")}</select></label><span class="lab"><span class="ln">${CB()[st.colorBy]}</span><small>${tr("（セッション数）", " (sessions)")}</small></span>` +
    Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k => `<button class="chip" style="--c:${colorOf(k)}" data-k="${esc(k)}" aria-pressed="${!st.hidden.has(k)}" title="${esc(tr(`${k}：${cnt[k]} セッション（押すと表示・非表示を切り替え）`, `${sn(k)}: ${plural(cnt[k], "session")} (click to show or hide)`))}"><span class="dot"></span>${esc(sn(k))}<span class="n">${cnt[k]}<span class="sr">${tr(" セッション", " sessions")}</span></span></button>`).join("") +
    `<span class="count">${shown.length} / ${inRange.length} ${tr("セッション", "sessions")}${st.q ? ` · <button class="flink" id="tosr">${tr("全期間の検索結果 ↓", "All-time search results ↓")}</button>` : ""}</span>`;
  const cb2 = $("#cb2"); if (cb2) cb2.onchange = () => { st.colorBy = cb2.value; st.hidden.clear(); store.set("colorBy", st.colorBy); render(); };
  const tosr = $("#tosr"); if (tosr) tosr.onclick = () => $("#review").scrollIntoView({behavior:"smooth"});
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { const k = c.dataset.k; st.hidden.has(k) ? st.hidden.delete(k) : st.hidden.add(k); render(); });

  M ? monthGrid(shown, ws, we, todayKey) : timeline(shown, inRange, ws, we, todayKey);
  try { st.q ? searchPanel() : summary(); } catch(e){ // サマリーで失敗しても、カレンダーと詳細は使えるようにする
    console.error(e); $("#review").innerHTML = `<div class="panel"><p class="none">${tr(`この期間のサマリーを表示できませんでした（${esc(e.message)}）。issue で教えてください。`, `Couldn't show the summary for this period (${esc(e.message)}). Please let us know in an issue.`)}</p></div>`; }
  const gc = st.sel && st.sel.startsWith("git:") && (META.git || []).find(x => "git:" + x.hash === st.sel);
  const s = !gc && st.sel && DATA.find(x => x.id === st.sel), open = !!(s || gc);
  if (st.sel && !open) st.sel = null;
  if (s) detail(s); else if (gc) commitDetail(gc);
  document.body.classList.toggle("open", open); document.body.classList.toggle("lock", open);
  $("#drawer").setAttribute("aria-hidden", String(!open));
  document.querySelector("header").inert = document.querySelector("main").inert = open; // 背後に Tab で入らない
  $("#back").hidden = !st.back.length;
  if (open && (!focusDrawer.was || focusDrawer.sel !== st.sel)) $(st.back.length ? "#back" : "#close").focus();
  if (!open && focusDrawer.was) focusOpener(focusDrawer.first);
  if (open && !focusDrawer.was) focusDrawer.first = st.sel;
  focusDrawer.was = open; focusDrawer.sel = st.sel;

}

/* 期間の要点（上の帯） */
function kpis(){
  const {S:w} = period(), K = $("#kpis"), M = st.mode === "month";
  if (!w){ K.innerHTML = `<div class="kpi"><div class="k">${M ? tr("この月", "This month") : tr("この週", "This week")}</div><div class="v">${tr("記録なし", "No records")}</div></div>`; return; }
  const kpi = (k, v) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const u = w.usage || {}, days = w.days.filter(d => d.active).length;
  K.innerHTML = kpi(tr("作業していた時間", "Active time"), dur(w.active, true)) + kpi(tr("作業した日", "Active days"), `${days}<small>/ ${w.days.length}${tr(" 日", "")}</small>`) +
    kpi(tr("セッション / 依頼", "Sessions / prompts"), `${w.sessions}<small>/</small>${w.prompts}`) +
    (u.tokens ? kpi(tr("トークン", "Tokens"), tok(u.tokens)) + kpi(tr("目安コスト", "Estimated cost"), usd(u.cost).replace("$","<small>$</small>")) : "") +
    (u.credits ? kpi(tr("Kiro クレジット", "Kiro credits"), `${Number(u.credits.toFixed(2)).toLocaleString(LOC())}<small>cr</small>`) : "") +
    (() => { const {ws, we} = period(), n = limitHits(ws, we).length; return n ? kpi(tr("利用上限に当たった", "Usage limit hits"), `<span style="color:var(--warn)">${n}</span>${tr("<small>回</small>", "")}`) : ""; })() +
    (w.git && w.git.commits ? kpi(tr("コミット（うち AI）", "Commits (by AI)"), `${w.git.commits}<small>${tr(`（${w.git.ai}）`, ` (${w.git.ai})`)}</small>`) :
     w.outputs && w.outputs.commits ? kpi(tr("AI のコミット", "AI commits"), `${w.outputs.commits}${tr("<small>回</small>", "")}`) : "");
}

/* 月のカレンダー：日ごとの作業時間を濃さで、プロジェクトの配分を細い帯で */
function monthGrid(shown, ms, me, todayKey){
  const T = $("#tl"), S = MONTHS[mkey(st.month)], first = mondayOf(st.month);
  const max = S ? Math.max(1, ...S.days.map(d => d.active)) : 1;
  let h = `<div class="mgrid"><div class="mh"></div>${[1,2,3,4,5,6,0].map(i=>`<div class="mh">${dow(i)}</div>`).join("")}`;
  for (let r = 0; r < 6; r++){
    const wk = addDays(first, 7*r); if (wk.getTime()/1000 >= me) break;
    h += `<button class="wkno" data-w="${key(wk)}" title="${tr("この週を開く", "Open this week")}">W${isoWeek(wk)}</button>`;
    for (let c = 0; c < 7; c++){
      const d = addDays(wk, c), ds = d.getTime()/1000, de = addDays(d,1).getTime()/1000, inM = d.getMonth() === st.month.getMonth();
      if (!inM){ h += `<div class="cell out"><span class="dn">${d.getDate()}</span></div>`; continue; }
      const x = S ? S.days[d.getDate()-1] : null, act = x ? x.active : 0;
      const by = {}; shown.forEach(s => s.segs.forEach(([a,b]) => { const o = Math.min(b,de) - Math.max(a,ds); if (o > 0) by[keyOf(s)] = (by[keyOf(s)]||0) + o; }));
      const pj = Object.entries(by).sort((a,b)=>b[1]-a[1]);
      h += `<button class="cell${d.getDay()%6===0?" we":""}${key(d)===todayKey?" today":""}" data-w="${key(mondayOf(d))}" style="--heat:${(act/max).toFixed(3)}" title="${tr(`${md(ds)} 作業 ${dur(act)}${x ? `・依頼 ${x.prompts}・深夜 ${dur(x.night)}${useShort(x) ? `・${useShort(x)}` : ""}` : ""}`, `${md(ds)} active ${dur(act)}${x ? ` · ${plural(x.prompts, "prompt")} · late night ${dur(x.night)}${useShort(x) ? ` · ${useShort(x)}` : ""}` : ""}`)}">
        <span class="dn">${d.getDate()}</span>${act ? `<span class="ac">${dur(act, true)}</span><span class="acs">${act >= 60 ? (act/60).toFixed(1)+tr("時間", "h") : act+tr("分", "m")}</span><span class="sub2">${tr(`依頼 ${x.prompts}`, plural(x.prompts, "prompt"))}</span>` : ""}${x && useShort(x) ? `<span class="use">${useShort(x)}</span>` : ""}${x && x.commits ? `<span class="gcm" title="${tr("git のコミット", "Git commits")}">${GIT_ICON}${x.commits}</span>` : ""}
        ${pj.length ? `<span class="pj">${pj.map(([k,v])=>`<span style="flex:${v};--c:${colorOf(k)}"></span>`).join("")}</span>` : ""}</button>`;
    }
  }
  h += `</div><div class="mlegend"><span style="white-space:nowrap">${tr("少ない", "Less")}</span> ${[0,.25,.5,.75,1].map(v=>`<i style="--h:${v}"></i>`).join("")} ${tr("多い（作業していた時間）・日付を押すとその週を開きます", "More (active time) · Click a date to open that week")}</div>`;
  T.innerHTML = h;
  T.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { const [y,m,dd] = b.dataset.w.split("-").map(Number); st.week = new Date(y, m-1, dd); setMode("week"); });
}

/* 週のカレンダー：曜日が列、時刻が縦。重なるセッションだけ横に並べる */
function timeline(shown, inWeek, ws, we, todayKey){
  const T = $("#tl"), hh = HOURS[st.z] || 44, H = 24*hh;
  if (!inWeek.length || !shown.length){
    T.innerHTML = `<div class="empty"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><p>${inWeek.length ? tr("条件に合うセッションはありません", "No sessions match the current filters") : tr("この週の記録はありません。← → で週を移動できます。", "No records this week. Use ← → to move between weeks.")}</p></div>`;
    return;
  }
  const keep = T.querySelector(".calscroll"), top = keep ? keep.scrollTop : null;
  const nowS = nowMs()/1000, w = WEEKS[key(st.week)];
  let heads = '<div></div>', hours = "", cols = "";
  const nowH = nowS >= ws && nowS < we ? (() => { const d0 = new Date(nowS*1000); d0.setHours(0,0,0,0); return (nowS - d0.getTime()/1000)/3600; })() : -9;
  for (let h=1; h<24; h++) if (Math.abs(h - nowH) * hh >= 20) hours += `<span style="top:${h*hh}px">${String(h).padStart(2,"0")}:00</span>`;
  if (nowS >= ws && nowS < we){ const d0 = new Date(nowS*1000); d0.setHours(0,0,0,0); hours += `<span class="now" style="top:${(nowS - d0.getTime()/1000)/3600*hh}px">${hm(nowS)}</span>`; }
  const runs = [];
  for (let d=0; d<7; d++){
    const day = addDays(st.week,d), ds = day.getTime()/1000, de = addDays(st.week,d+1).getTime()/1000, isToday = key(day) === todayKey;
    const act = w && w.days[d] ? w.days[d].active : 0;
    const dU = w && w.days[d] ? useShort(w.days[d]) : "";
    const dayGit = (META.git || []).filter(c => c.t >= ds && c.t < de && (!st.hidden.size || st.colorBy !== "project" || !st.hidden.has(c.project))).sort((a,b) => a.t - b.t);
    heads += `<div class="head${isToday?" today":""}"><div class="dd"><b>${day.getMonth()+1}/${day.getDate()}</b><i>${dow(day.getDay())}</i></div><small>${act ? dur(act) : "—"}</small>${dU ? `<span class="use" title="${tr("トークン・目安コスト・クレジット", "Tokens · estimated cost · credits")}">${dU}</span>` : ""}${dayGit.length ? `<span class="gch" title="${tr("git のコミット", "Git commits")}">${GIT_ICON}${dayGit.length}</span>` : ""}</div>`;
    const blocks = [];
    shown.forEach(s => s.segs.forEach(([a,b,n]) => { const x = Math.max(a,ds), y = Math.min(b,de); if (y > x) blocks.push({s, a:x, b:y, n}); }));
    blocks.sort((p,q) => p.a-q.a || q.b-p.b);
    // 重なるものだけ横に並べる（かたまりごとに列の数を決める）
    let cluster = [], cEnd = -1;
    const flush = () => { const lanes = []; cluster.forEach(bk => { let i = lanes.findIndex(e => e <= bk.a); if (i<0){ i = lanes.length; lanes.push(0); } lanes[i] = bk.b; bk.lane = i; }); cluster.forEach(bk => bk.L = lanes.length); cluster = []; };
    blocks.forEach(bk => { if (bk.a >= cEnd){ flush(); cEnd = bk.b; } else cEnd = Math.max(cEnd, bk.b); cluster.push(bk); }); flush();
    let html = `<div class="nb" style="top:0;height:${6*hh}px"></div><div class="nb" style="top:${22*hh}px;height:${2*hh}px"></div>`;
    blocks.forEach((bk, j) => {
      const y = (bk.a-ds)/3600*hh, h = Math.max(4, (bk.b-bk.a)/3600*hh - 2), mins = (bk.b-bk.a)/60;
      const dens = Math.min(1, bk.n / Math.max(1, mins) / 2.5), id = runs.length;
      runs.push(bk);
      html += `<button class="run${h < 16 ? " thin" : ""}${st.sel === bk.s.id ? " sel" : ""}" data-r="${id}" data-sid="${esc(bk.s.id)}" style="top:${y}px;height:${h}px;left:calc((100% - var(--g)) * ${(bk.lane/bk.L).toFixed(4)} + 3px);width:calc((100% - var(--g)) / ${bk.L} - 6px);--c:${colorOf(keyOf(bk.s))};--fill:${Math.round(16+30*dens)}%;${st.animate?`--delay:${d*30+Math.min(j,14)*10}ms`:"animation:none"}" aria-label="${esc(tr(`${bk.s.title}、${bk.s.project}、${md(bk.a)} ${hm(bk.a)}から${hm(bk.b)}`, `${bk.s.title}, ${bk.s.project}, ${md(bk.a)} ${hm(bk.a)} to ${hm(bk.b)}`))}">${h >= 20 ? `<span class="t"><span>${esc(bk.s.title)}</span></span>` + (h >= 38 ? `<span class="m">${hm(bk.a)}–${hm(bk.b)} · ${esc(bk.s.project)}</span>` : "") : ""}</button>`;
    });
    let gy = -99; // コミットは右端の溝に、時刻の順に置く（近すぎるものは少し下へずらす）
    dayGit.forEach(c => {
      const y = Math.max((c.t-ds)/3600*hh, gy + 17); gy = y;
      html += `<button class="gc${c.ai ? " ai" : ""}${st.sel === "git:"+c.hash ? " sel" : ""}" data-c="${esc(c.hash)}" style="top:${y}px" title="${esc(`${hm(c.t)} ${c.project}${c.branch ? " · "+c.branch : ""} · ${c.hash}\n${c.subject}\n${tr(`${c.nFiles} ファイル`, plural(c.nFiles, "file"))} +${c.added} −${c.removed}${c.ai ? tr(" · AI が実行", " · run by AI") : ""}`)}" aria-label="${esc(tr(`コミット ${hm(c.t)} ${c.subject}`, `Commit ${hm(c.t)} ${c.subject}`))}">${GIT_ICON}<span>${esc(c.hash.slice(0,7))}</span></button>`; });
    limitHits(ds, de).filter(h => matches(h.s)).forEach(h => { html += `<button class="lim" data-id="${esc(h.s.id)}" style="top:${(h.t-ds)/3600*hh}px" title="${esc(tr(`${hm(h.t)} 利用上限に当たりました（${h.s.title}）`, `${hm(h.t)} Hit the usage limit (${h.s.title})`))}" aria-label="${esc(tr(`${hm(h.t)} 利用上限`, `${hm(h.t)} usage limit`))}">${tr("上限", "Limit")}</button>`; });
    if (isToday && nowS >= ds && nowS < de) html += `<div class="nowline" style="top:${(nowS-ds)/3600*hh}px"></div>`;
    cols += `<div class="day${day.getDay()%6===0?" we":""}${isToday?" today":""}" style="height:${H}px;--g:${dayGit.length ? 18 : 0}px">${html}</div>`;
  }
  T.innerHTML = `<div class="calscroll" style="--hh:${hh}px"><div class="calin"><div class="heads">${heads}</div><div class="cgrid"><div class="hours" style="height:${H}px">${hours}</div>${cols}</div></div></div>`;
  if (top != null) T.querySelector(".calscroll").scrollTop = top;
  T.querySelectorAll(".lim").forEach(el => el.onclick = e => { e.stopPropagation(); select(el.dataset.id); });
  T.querySelectorAll(".gc").forEach(el => el.onclick = e => { e.stopPropagation(); select("git:" + el.dataset.c); });
  T.querySelectorAll(".run").forEach(el => { const bk = runs[+el.dataset.r];
    el.onclick = e => { e.stopPropagation(); select(bk.s.id); };
    el.onmouseenter = e => tipOn(e, bk); el.onmousemove = tipMove; el.onmouseleave = tipOff; });
}

function tipOn(e, bk){ const t = $("#tip"), s = bk.s;
  t.innerHTML = `<b>${esc(s.title)}</b><div class="r" style="--c:${colorOf(keyOf(s))}"><i></i>${esc(s.project)}${s.branch?` · ${esc(s.branch)}`:""}</div><div class="r">${md(bk.a)} ${hm(bk.a)}–${hm(bk.b)}${tr(`（${dur((bk.b-bk.a)/60)}）`, ` (${dur((bk.b-bk.a)/60)})`)}</div><div class="r">${esc(sn(s.source))} · ${tr(`依頼 ${s.nPrompts} 件`, plural(s.nPrompts, "prompt"))}${s.cost ? ` · ${usd(s.cost)}` : ""}${s.credits ? tr(` · ${s.credits} クレジット`, ` · ${s.credits} credits`) : ""}${s.subagents.length ? tr(` · サブエージェント ${s.subagents.length}`, ` · ${plural(s.subagents.length, "subagent")}`) : ""}</div>`;

  t.classList.add("on"); tipMove(e); }
function tipMove(e){ const t = $("#tip"), w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 12) x = e.clientX - w - 14; if (y + h > innerHeight - 12) y = e.clientY - h - 14;
  t.style.left = x+"px"; t.style.top = y+"px"; }
function tipOff(){ $("#tip").classList.remove("on"); }

/* 期間の言い方（unit は "週" か "月"） */
const uThis = unit => tr(`この${unit}`, unit === "月" ? "this month" : "this week");
const uLast = unit => tr(`先${unit}`, unit === "月" ? "last month" : "last week");
const uNext = unit => tr(`次の${unit}`, unit === "月" ? "next month" : "next week");
const whyOf = f => EN() && f.whyEn && f.whyEn.length === f.why.length ? f.whyEn : f.why; // こじれた理由（Go が両方の言語で書く）
/* 配分：作業時間・トークン・目安コスト・クレジットのそれぞれで、何割をどのくくりに使ったか。くくりは色分け（プロジェクト・ブランチ・エージェント）に合わせる。
   指標を縦に並べ、「時間の割にコストが多い」のようなずれを見比べられるようにする（上位 5 つ＋その他） */
function shareBlock(w, ps){
  const all = st.colorBy === "project" ? ps.map(p => ({key: p.project, minutes: p.minutes, tokens: p.tokens, cost: p.cost, credits: p.credits})) : ((w.shares || {})[st.colorBy] || []);
  const head = `<h3 class="shh">${tr(`${CB()[st.colorBy]}ごとの配分`, `Share by ${CB()[st.colorBy].toLowerCase()}`)}</h3><p class="shn">${tr("上の「プロジェクト・ブランチ・エージェント」の切り替えに合わせて変わります", "Follows the Project / Branch / Agent switch at the top")}</p>`;
  if (!all.length) return "";
  if (all.length < 2) return head + `<p class="none">${tr(`この期間の${CB()[st.colorBy]}は「${esc(all[0].key)}」だけです。`, `Only "${esc(all[0].key)}" this period.`)}</p>`;
  const N = 5, top = all.slice(0, N), rest = all.slice(N);
  const rows = top.map(p => ({name: p.key, c: colorOf(p.key), v: p}));
  if (rest.length) rows.push({name: tr(`その他（${rest.length}）`, `Other (${rest.length})`), c: "var(--other)", other: true,
    v: rest.reduce((a, p) => ({minutes: a.minutes + p.minutes, tokens: a.tokens + p.tokens, cost: a.cost + p.cost, credits: a.credits + p.credits}), {minutes: 0, tokens: 0, cost: 0, credits: 0})});
  const ms = [["minutes", tr("作業時間", "Active time"), dur], ["tokens", tr("トークン", "Tokens"), tok], ["cost", tr("目安コスト", "Est. cost"), usd], ["credits", tr("クレジット", "Credits"), cr]]
    .map(([k, n, f]) => ({k, n, f, t: rows.reduce((t, r) => t + (r.v[k] || 0), 0)})).filter(m => m.t > 0);
  if (!ms.length) return "";
  const pc = (r, m) => Math.round((r.v[m.k] || 0) * 100 / m.t);
  const bars = ms.map(m => `<span class="k">${m.n}</span><div class="stack" role="img" aria-label="${esc(`${m.n}: ${rows.map(r => `${r.name} ${pc(r, m)}%`).join(", ")}`)}">${rows.filter(r => r.v[m.k] > 0).map(r => `<span style="flex:${r.v[m.k]};--c:${r.c}" title="${esc(`${r.name}: ${m.f(r.v[m.k])} (${pc(r, m)}%)`)}"></span>`).join("")}</div>`).join("");
  const tab = `<table class="shtab"><thead><tr><th scope="col">${CB()[st.colorBy]}</th>${ms.map(m => `<th scope="col">${m.n}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr style="--c:${r.c}"><td title="${esc(r.name)}"><i aria-hidden="true"></i>${esc(r.name)}</td>${ms.map(m => `<td>${r.v[m.k] ? pc(r, m) + "%" : "—"}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return `${head}<div class="sharebox"><div class="share">${bars}</div>${tab}</div>`;
}
/* プロジェクト別：何に何時間、どれだけのトークン・コスト・クレジットを、どのモデル中心に使い、何が重かったか */
function projectPanel(w, ph, unit){
  const ps = w.projectStats || []; if (!ps.length) return "";
  const total = w.projects.reduce((t,[,v])=>t+v,0) || 1, LIMIT = 6, shown = st.allProj ? ps : ps.slice(0, LIMIT);
  const use = x => [x.cost >= 0.005 ? usd(x.cost) : "", x.credits ? cr(x.credits) : "", !x.cost && x.tokens ? tok(x.tokens)+" tok" : ""].filter(Boolean).join(" · ");
  const cards = shown.map(p => {
    const c = st.colorBy === "project" ? colorOf(p.project) : "var(--ink-3)", share = Math.round(p.minutes*100/total);
    const mt = p.models.reduce((t,m)=>t+m.tokens,0) || 1; // トークンのないモデル（Kiro など）は回数で出す
    return `<article class="pcard" style="--c:${c}">
      <div class="hd"><i></i><b title="${esc(p.project)}">${esc(p.project)}</b><span>${p.minutes ? dur(p.minutes) : "—"}${p.minutes ? ` · ${share}%` : ""}</span></div>
      <div class="bar2"><span style="width:${share}%"></span></div>
      <div class="kv"><div><div class="k">${tr("セッション/依頼", "Sessions/prompts")}</div><div class="v">${p.sessions}/${p.prompts}</div></div>
        <div><div class="k">${tr("トークン", "Tokens")}</div><div class="v">${p.tokens ? tok(p.tokens) : "—"}</div></div>
        <div><div class="k">${tr("目安コスト", "Est. cost")}</div><div class="v">${p.cost >= 0.005 ? usd(p.cost) : "—"}</div></div>
        <div><div class="k">${tr("クレジット", "Credits")}</div><div class="v">${p.credits ? cr(p.credits) : "—"}</div></div></div>
      ${(p.git && p.git.commits) || (p.outputs && (p.outputs.commits || p.outputs.prs)) ? `<div><div class="lab">${tr("アウトプット", "Outputs")}</div><div class="pout">${tr("コミット", "Commits")} ${p.git && p.git.commits ? tr(`${p.git.commits}（AI ${p.git.ai}）`, `${p.git.commits} (AI ${p.git.ai})`) : p.outputs.commits} · PR ${p.outputs ? p.outputs.prs : 0} · <span>+${p.git && p.git.commits ? p.git.added : p.outputs.added} −${p.git && p.git.commits ? p.git.removed : p.outputs.removed}${tr(" 行", " lines")}</span></div></div>` : ""}
      ${p.models.length ? `<div><div class="lab">${tr("中心のモデル", "Main models")}</div><div class="mods">${p.models.map(m=>`<span title="${esc(mn(m.model))}">${esc(mn(m.model))}<b>${m.tokens ? Math.round(m.tokens*100/mt)+"%" : tr(m.turns+"回", plural(m.turns, "turn"))}</b></span>`).join("")}</div></div>` : ""}
      <div><div class="lab">${tr("何に時間を使ったか", "Where the time went")}</div>${p.top.map(t=>`<button class="pses" data-id="${esc(t.id)}"><span class="t">${esc(t.title)}</span><span class="m">${dur(t.minutes)}${use(t) ? " · "+use(t) : ""}</span></button>`).join("")}</div>
      ${p.heavy && use(p.heavy) ? `<button class="pheavy" data-id="${esc(p.heavy.id)}"><em>${tr("いちばん重い", "Heaviest")}</em><span class="t">${esc(p.heavy.title)}</span><span class="m">${use(p.heavy)}</span></button>` : ""}
    </article>`; }).join("");
  return `<section class="panel projs">${ph(1, tr("プロジェクト別", "By project"), tr(`この${unit}、どのプロジェクトに時間と AI を使ったか`, `Where your time and AI went ${uThis(unit)}`), "projects")}
    ${shareBlock(w, ps)}
    <div class="pgrid">${cards}</div>
    ${ps.length > LIMIT ? `<button class="pill pmore" id="pmore">${st.allProj ? tr("上位だけにする", "Show top projects only") : tr(`ほか ${ps.length - LIMIT} プロジェクトも見る`, `Show ${plural(ps.length - LIMIT, "more project")}`)}</button>` : ""}</section>`;

}

  <canvas class="yrcard" id="yrcard" width="1600" height="900" role="img" aria-label="${esc(tr(`シェア用の画像。${x.y} 年に AI と過ごした時間 ${dur(x.active)}`, `Image to share: ${dur(x.active)} with AI in ${x.y}`))}"></canvas>
  <div class="yropts">${opt("out", tr("コミット・PR", "Commits and PRs"))}${opt("type", tr("光の名前", "Your light"))}${opt("grade", tr("腕前", "Skill"))}${opt("agents", tr("エージェントの内訳", "Agent breakdown"))}</div>
  <div class="yract"><button class="pill" id="yrsave">${tr("PNG で保存", "Save as PNG")}</button><button class="pill" id="yrcopy">${tr("画像をコピー", "Copy image")}</button></div>
  <p class="note">${tr("画像に載るのは、作業していた時間・セッション数などの集計と光の筋だけです。依頼文・プロジェクト名・ブランチ・ファイル・目安コストは載りません。画像はこのブラウザの中で作り、どこにも送りません。", "The image shows only totals such as active time and sessions, and the streaks of light. Prompts, project names, branches, files and estimated cost are never included. It is made in this browser and sent nowhere.")}</p>

  <h3>${tr("あなたの光の名前", "Your light")}</h3>
  <div class="yrtype"><div class="yrtn${EN() ? " h" : ""}"><span class="pre${G.over ? " over" : ""}">${vt(G.over ? tr(G.over.ja, G.over.en) : tr(`${G.tier.ja}の`, G.tier.en))}</span><span>${vt(name(L))}</span></div><div>
    <p class="yrtd">${tr(L.dj, L.de)}</p>
    <div class="yrgrade"><div class="yrexp ${G.exp}">${{under: tr("露出アンダー：これから伸びる", "Underexposed: room to grow"), ok: tr("適正露出：いい写り", "Well exposed"), over: tr(`露出オーバー：${G.over ? G.over.rj : ""}`, `Overexposed: ${G.over ? G.over.re : ""}`)}[G.exp]}</div>${G.grow ? `<div class="yrexp ok">${tr("↗ 上達中：前半より後半がうまくなった（等級を 1 段上げています）", "↗ Improving: the second half beat the first (one level up)")}</div>` : ""}
      ${meters(x, G)}</div>
    <dl class="yrev">${ev.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    <p class="note">${tr(`光の名前は、この 1 年の使い方の傾向を写真の言葉で表したもので、良し悪しではありません。決め手：${L.rj}`, `Your light describes the shape of your year in photography terms. It is not a verdict. Why: ${L.re}`)}${x.active < 600 ? tr("（記録が少ないので、参考程度に）", " (based on little history, so take it lightly)") : ""}</p>
    <details class="yrtypes"><summary>${tr("七つの光の名前と基準", "All seven and how they are chosen")}</summary><ul>${LIGHTS.map(l => `<li><b>${name(l)}</b> — ${tr(l.rj, l.re)}</li>`).join("")}</ul>
      <p class="note">${tr("上から順に、最初に当てはまったものを選びます。", "The first one that matches, from the top, is chosen.")}</p></details>
    <details class="yrtypes"><summary>${tr("腕前の等級と露出オーバー", "Skill levels and overexposure")}</summary>
      <ul>${TIERS.map((t, i) => `<li><b>${tr(t.ja, t.en)}</b> — ${tr(`点数が ${i*10}〜${i*10 + 10}%`, `Score ${i*10}–${i*10 + 10}%`)}</li>`).join("")}
        ${OVERS.map(o => `<li><b>${tr(o.ja.replace(/(した|の)$/, ""), o.en)}</b> — ${tr(o.rj, o.re)}</li>`).join("")}</ul>
      <p class="note">${tr("点数は、シャッター数・ピント・多重度の平均から、ノイズの 4 割を引いたものです。伝説は 3 つがどれも 80% 以上で、ノイズが 20% 以下のときだけ。年の前半より後半で言い直しが 3 ポイント以上減るか、1 コミットあたりのコストが 2 割以上下がると「上達中」として 1 段上がります。シャッター数は作業した日数（180 日）・依頼の数（3,000 件）・作業時間（800 時間）、ピントはコミットか PR まで行った割合（50%）と 1 コミットあたりの依頼の少なさ（5 件）、多重度は並列の割合（30%）・サブエージェント（200 回）・エージェントとモデルの使い分けのうち得意な 2 つ、ノイズは言い直し・長くなった会話・コミットにつながらなかったコスト・軽い作業に高いモデルから出します（かっこは満点の目安。年の途中は、経った日数のぶん半分まで下げます）。数字は目安で、腕前と関係のない理由でも上下するので、遊びとして見てください。", "The score is the average of shutter count, focus and layers, minus 40% of noise. Legendary needs all three at 80% or more and noise at 20% or less. If corrections drop by 3 points or cost per commit falls by 20% from the first half of the year to the second, you are \"improving\" and go up one level. Shutter count comes from active days (180), prompts (3,000) and active time (800 hours); focus from sessions that reached a commit or pull request (50%) and few prompts per commit (5); layers from your best two of parallel time (30%), subagents (200 runs), and using several agents and models; noise from corrections, long conversations, cost with no commit and expensive models for light work (full marks in brackets, scaled down to as little as half for a year in progress). These are rough proxies that can move for reasons unrelated to skill, so treat it as a game.")}</p></details></details></div></div>`;
  $("#yrsel").onchange = e => { yr.y = +e.target.value; renderYear(); };
  dlg.querySelectorAll("[data-o]").forEach(c => c.onchange = () => { yr.opt[c.dataset.o] = c.checked; store.set("yrOpt", yr.opt); drawCard(); });
  const blob = () => new Promise(res => $("#yrcard").toBlob(res, "image/png"));
  $("#yrsave").onclick = async () => { const b = await blob(); if (!b) return toast(tr("画像を作れませんでした", "Couldn't make the image"));
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `kiroku-${x.y}.png`; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast(tr("PNG を保存しました", "Saved the PNG")); };
  $("#yrcopy").onclick = async () => { try { await navigator.clipboard.write([new ClipboardItem({"image/png": blob()})]); toast(tr("画像をコピーしました", "Copied the image")); }
    catch(e){ toast(tr("画像をコピーできませんでした。PNG で保存してください", "Couldn't copy the image. Save it as a PNG instead"), 2600); } };
  drawPlate(); drawCard();
  const sc = dlg.querySelector(".yrscroll"); sc.scrollLeft = sc.scrollWidth; // 狭い画面では、新しい記録の側を見せる
}
function meters(x, G){
  const pct = v => v == null ? "—" : `${Math.round(v)}%`;
  const rows = [
    ["shutter", tr("シャッター数", "Shutter count"), tr("積み重ね", "Practice"), tr(`${x.days} 日・依頼 ${x.prompts.toLocaleString(LOC())} 件・${dur(x.active)}`, `${plural(x.days, "day")} · ${plural(x.prompts, "prompt")} · ${dur(x.active)}`)],
    ["focus", tr("ピント", "Focus"), tr("仕上げる力", "Follow-through"), tr(`コミットまで ${pct(x.reach)}・1 コミットあたり依頼 ${x.perCommit == null ? "—" : x.perCommit.toFixed(1) + " 件"}`, `To commit ${pct(x.reach)} · ${x.perCommit == null ? "—" : x.perCommit.toFixed(1)} prompts per commit`)],
    ["multi", tr("多重度", "Layers"), tr("使いこなしの幅", "Range"), tr(`並列 ${pct(x.parPct)}・サブエージェント ${x.subagents} 回・エージェント ${x.agents.length}・モデル ${x.models}`, `Parallel ${pct(x.parPct)} · ${plural(x.subagents, "subagent run")} · ${plural(x.agents.length, "agent")} · ${plural(x.models, "model")}`)],
    ["noise", tr("ノイズ", "Noise"), tr("回り道（少ないほど澄んだ写り）", "Detours (fewer means a cleaner shot)"), tr(`言い直し ${pct(x.fix)}・長くなった会話 ${pct(x.longPct)}・コミットにつながらなかったコスト ${pct(x.idlePct)}・軽い作業に高いモデル ${pct(x.lightPct)}`, `Corrections ${pct(x.fix)} · long conversations ${pct(x.longPct)} · cost with no commit ${pct(x.idlePct)} · expensive models for light work ${pct(x.lightPct)}`)]];
  return `<dl class="yrmeter">${rows.map(([k, n, sub, v]) => { const p = pips(G.m[k]);
    return `<div${k === "noise" ? ' class="neg"' : ""}><dt>${n}<small>${sub}</small></dt><dd><span class="pp" role="img" aria-label="${tr(`10 段階の ${p}`, `${p} of 10`)}">${"<i class=on></i>".repeat(p)}${"<i></i>".repeat(10 - p)}</span><span class="pv">${v}</span></dd></div>`; }).join("")}</dl>`;
}
function openYear(){ const d = $("#yr"); if (!d.open) d.showModal(); renderYear(); }

/* ── events ── */
function go(n){
  if (st.mode === "month") st.month = n == null ? monthOf(today0()) : new Date(st.month.getFullYear(), st.month.getMonth()+n, 1);
  else st.week = n == null ? mondayOf(today0()) : addDays(st.week, 7*n);
  st.sel = null; st.back = []; st.backTop = []; st.animate = true; $("#toast").classList.remove("on"); render(); scrollToWork(); }
function setMode(m){ if (m === "month" && st.mode !== "month") st.month = monthOf(addDays(st.week, 3));
  if (m === "week" && st.mode === "month" && monthOf(st.week).getTime() !== st.month.getTime()) st.week = mondayOf(st.month);
  st.mode = m; store.set("mode", m); st.sel = null; st.animate = true; render(); scrollToWork(); }
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => setMode(b.dataset.v));
$("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1); $("#today").onclick = () => go(null);
$("#zin").onclick = () => zoom(1); $("#zout").onclick = () => zoom(-1);
function zoom(dv){ st.z = Math.max(0, Math.min(HOURS.length-1, st.z+dv)); store.set("zh", st.z); render(); scrollToWork(); }
document.querySelectorAll("#colorBy button").forEach(b => b.onclick = () => { st.colorBy = b.dataset.v; st.hidden.clear(); store.set("colorBy", st.colorBy); render(); });
$("#q").oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
$("#theme").onclick = () => { st.theme = st.theme === "dark" ? "light" : "dark"; store.set("theme", st.theme); applyTheme(); };
$("#help").onclick = () => $("#keys").showModal();
$("#yrbtn").onclick = openYear;
addEventListener("resize", () => { if ($("#yr").open) drawPlate(); });
$("#lang").onchange = e => { LANG = e.target.value === "en" ? "en" : "ja"; store.set("lang", LANG); applyLang(); applyTheme(); ph(); render(); };
$("#scrim").onclick = () => select(null); $("#close").onclick = () => select(null); $("#back").onclick = () => { const prev = st.back.pop(), top = (st.backTop || []).pop(); st.sel = prev || null; render(); $("#panel").scrollTop = top || 0; };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT"){ if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || $("#keys").open || $("#yr").open) return;
  const k = e.key;
  if (k === "ArrowLeft") go(-1); else if (k === "ArrowRight") go(1); else if (k === "t" || k === "T") go(null);
  else if (k === "/"){ e.preventDefault(); $("#q").focus(); } else if (k === "+" || k === "=") zoom(1); else if (k === "-") zoom(-1);
  else if (k === "Escape" && st.sel) select(null); else if (k === "?") $("#keys").showModal();
  else if (k === "w" || k === "W") setMode("week"); else if (k === "m" || k === "M") setMode("month");
  else if ((k === "y" || k === "Y") && YEAR_ON && DATA.length) openYear();
});
function scrollToWork(){ // その週の作業が始まるころの少し前へ
  const sc = $("#tl .calscroll"); if (!sc) return;
  const ws = st.week.getTime()/1000, we = ws + 7*86400, hs = [];
  DATA.forEach(s => s.segs.forEach(([a,b]) => { if (b > ws && a < we) hs.push(new Date(Math.max(a,ws)*1000).getHours()); }));
  hs.sort((a,b) => a-b); // 深夜の 1 本に引っぱられないよう、早いほうから 2 割の開始時刻へ
  const first = hs.length ? hs[Math.floor(hs.length*0.2)] : 24;
  sc.scrollTop = Math.max(0, Math.max(0, (first === 24 ? 8 : first) - 1) * (HOURS[st.z] || 44) - 14);
  if (sc.scrollWidth > sc.clientWidth + 4){ // 横にスクロールする狭い画面では、今日までで最後に作業した日を見せる
    const w = WEEKS[key(st.week)], now = nowMs()/1000, heads = sc.querySelectorAll(".head");
    let i = -1; if (w) w.days.forEach((d, j) => { if (d.active && ws + j*86400 <= now) i = j; });
    const h = heads[i]; sc.scrollLeft = h ? Math.max(0, h.offsetLeft - 56 - h.offsetWidth) : 0; } // その日と前の日が収まるように
}
// 今週に記録がなければ、いちばん新しい記録の週から開く
if (DATA.length && !WEEKS[key(st.week)]) st.week = mondayOf(new Date(DATA[DATA.length-1].end*1000));
if (DATA.length && !MONTHS[mkey(st.month)]) st.month = monthOf(new Date(DATA[DATA.length-1].end*1000));
function langLabels(){ const narrow = matchMedia("(max-width:820px)").matches; // スマホでは短く
  $("#lang").options[0].text = narrow ? "JA" : "日本語"; $("#lang").options[1].text = narrow ? "EN" : "English"; }
matchMedia("(max-width:820px)").addEventListener("change", langLabels);
const mq = matchMedia("(max-width:1000px)"),
 ph = () => $("#q").placeholder = mq.matches ? tr("検索", "Search") : tr("依頼・ファイル・コミット", "Prompts, files, commits"); // 狭い画面では入力欄も狭いので短く
mq.addEventListener("change", () => { ph(); render(); }); ph();
applyLang(); applyTheme(); render(); scrollToWork();

/* ── live（kiroku serve） ── 新しい履歴を見つけたら、見ている週・選んだセッションはそのままで取り込む */
if (LIVE){
  const badge = $("#live"); badge.hidden = false;
  let busy = false;
  async function poll(){
    if (busy || document.hidden) return; busy = true;
    try {
      const r = await fetch("stamp", {cache:"no-store"}); if (!r.ok) throw new Error(r.status);
      if (parseFloat(await r.text()) !== GENERATED){
        const j = await (await fetch("data.json", {cache:"no-store"})).json(), before = DATA.length;
        applyData(j);
        render(); if ($("#yr").open) renderYear();
        const d = DATA.length - before;
        toast(d > 0 ? tr(`新しいセッションを ${d} 件取り込みました`, `Added ${plural(d, "new session")}`) : tr("最新の履歴を反映しました", "Updated to the latest history"));
      }
      badge.classList.remove("off"); badge.title = tr(`履歴が増えると自動で反映します（最終確認 ${new Date().toLocaleTimeString("ja-JP")}）`, `Updates automatically as your history grows (last checked ${new Date().toLocaleTimeString("en-US")})`);
    } catch(e){ badge.classList.add("off"); badge.title = tr("kiroku serve とつながっていません。止めた場合は、もう一度起動すると再開します", "Not connected to kiroku serve. If you stopped it, start it again to resume"); }

    busy = false;
  }
  setInterval(poll, 3000); document.addEventListener("visibilitychange", poll);
}
</script></body></html>
