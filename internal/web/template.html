<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/*@style.css*/
</style></head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>
      <span class="word">kiroku</span><span class="tag">A record of your time with AI</span>
      <span class="live" id="live" hidden title="Updates automatically as your history grows">LIVE</span>
    </div>
    <div class="segc" role="group" aria-label="Color by" id="colorBy">
      <button data-v="project">Project</button><button data-v="branch">Branch</button><button data-v="source">Agent</button>
    </div>
    <div class="segc zoom" role="group" aria-label="Zoom">
      <button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button>
    </div>
    <label class="search"><span class="sr">Search</span>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Prompts, files, commits" autocomplete="off"><kbd>/</kbd></label>
    <button class="iconbtn" id="theme" aria-label="Switch theme"></button>
    <button class="iconbtn" id="help" aria-label="Keyboard shortcuts"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/></svg></button>
  </div>
</header>
<main class="wrap">
  <p class="scope" id="scopebar" role="note" hidden></p>
  <section class="week" aria-label="Period">
    <nav class="wk" aria-label="Change period">
      <div class="lbl" aria-live="polite"><div class="y" id="ry"></div><div class="d" id="rd"></div></div>
      <div class="nav">
        <button class="iconbtn" id="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="pill" id="today">This week</button>
        <button class="pill" id="yrbtn" aria-haspopup="dialog" hidden>Year in review</button>
        <div class="segc mode" role="group" aria-label="View" id="mode"><button data-v="week">Week</button><button data-v="month">Month</button></div>
      </div>
    </nav>
    <div class="kpis" id="kpis"></div>
  </section>
  <div class="legend" id="legend" aria-label="Legend"></div>
  <p class="fnote" id="fnote" role="note" hidden></p>
  <section class="tlbox" id="tl" aria-label="Calendar"></section>
  <section id="review" aria-live="polite"></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Session details" aria-hidden="true">
  <div class="dh"><button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
    <button class="iconbtn" id="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="panel"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="keys">
  <div class="eyebrow">Shortcuts</div><h2>Keyboard shortcuts</h2>
  <div class="keys">
    <kbd>←</kbd><span>Previous week / month</span><kbd>→</kbd><span>Next week / month</span><kbd>T</kbd><span>Back to this week / month</span>
    <kbd>/</kbd><span>Search</span><kbd>+</kbd><span>Zoom in (<kbd>−</kbd> to zoom out)</span>
    <kbd>W</kbd><span>Week view</span><kbd>M</kbd><span>Month view</span>
    <kbd>Esc</kbd><span>Close details</span><kbd>?</kbd><span>This list</span>
  </div>
  <form method="dialog" style="margin-top:22px;text-align:right"><button class="pill">Close</button></form>
</dialog>
<dialog id="yr" class="yr" aria-labelledby="yrh"></dialog>
<script>
//@app.js
</script></body></html>
