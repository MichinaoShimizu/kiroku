<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/*@style.css*/
</style></head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <a class="home" id="home" href="/" title="Back to the start"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>
      <h1 class="word">kiroku</h1></a><span class="tag">A record of your time with AI</span>
      <span class="live" id="live" hidden title="Updates automatically as your history grows">LIVE</span>
    </div>
    <label class="search"><span class="sr">Search</span>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Prompts, files, commits" autocomplete="off"><kbd>/</kbd></label>
    <button class="iconbtn" id="guide" aria-label="Metrics guide" title="Metrics guide (G)" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M9 4.5L3.5 6.5v13l5.5-2 6 2 5.5-2v-13l-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg></button>
    <button class="iconbtn" id="theme" aria-label="Switch theme"></button>
    <button class="iconbtn" id="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8 14h8"/></svg></button>
  </div>
</header>
<main class="wrap">
  <p class="scope" id="scopebar" role="note" hidden></p>
  <section class="week" aria-label="Period">
    <nav class="wk" aria-label="Change period">
      <div class="lbl" aria-live="polite"><div class="y" id="ry"></div><div class="d" id="rd"></div></div>
      <div class="nav">
        <button class="iconbtn" id="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="pill" id="today">This week</button>
        <div class="segc mode" role="group" aria-label="View" id="mode"><button data-v="week">Week</button><button data-v="month">Month</button><button id="yrbtn" aria-haspopup="dialog" aria-label="Year in review" title="Year in review (Y)" hidden>Year</button></div>
      </div>
    </nav>
    <div class="kpis" id="kpis"></div>
  </section>
  <div class="flagsum" id="worth"></div>
  <div class="legend" id="legend" aria-label="Legend"></div>
  <section class="srbox" id="sres" aria-label="Search results" hidden></section>
  <p class="fnote" id="fnote" role="note" hidden></p>
  <a class="skip" id="skipcal" href="#review">Skip the calendar</a>
  <section class="tlbox" id="tl" aria-label="Calendar"></section>
  <section id="review"></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dkind dtitle" aria-hidden="true">
  <div class="dh"><span class="sr" id="dkind">Session details</span><span class="dt" id="dtop" aria-hidden="true"></span><button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
    <button class="iconbtn" id="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="panel"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="hint" id="hpop" role="dialog" hidden></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="keys">
  <form method="dialog" class="dclose"><button class="iconbtn" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
  <div class="eyebrow">Shortcuts</div><h2>Keyboard shortcuts</h2>
  <div class="keys">
    <kbd>←</kbd><span>Previous week / month</span><kbd>→</kbd><span>Next week / month</span><kbd>T</kbd><span>Back to this week / month</span>
    <kbd>/</kbd><span>Search</span><kbd>+</kbd><span>Zoom in (<kbd>−</kbd> to zoom out)</span>
    <kbd>W</kbd><span>Week view</span><kbd>M</kbd><span>Month view</span>
    <kbd>G</kbd><span>Metrics guide</span><kbd>Esc</kbd><span>Close details</span><kbd>?</kbd><span>This list</span>
  </div>
</dialog>
<dialog id="yr" class="yr" aria-labelledby="yrh"></dialog>
<dialog id="wk" class="wkdlg" aria-labelledby="wkh"></dialog>
<dialog id="md" class="wkdlg mdlg" aria-labelledby="mdh"></dialog>
<dialog id="mg" class="wkdlg mgdlg" aria-labelledby="mgh" aria-describedby="mgd"></dialog>
<script>
//@js/*.js
</script></body></html>
