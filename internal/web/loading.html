<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/* kiroku serve が最初の読み込みを終えるまで出す画面。外のものは読まない */
:root{color-scheme:light;--bg:#f3f4f6;--surface:#ffffff;--ink:#121419;--ink-2:#464b56;--rule:#e1e4ea;--acc:#4338ca;--warn:#b42318;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e0f13;--surface:#16181e;--ink:#eceef3;--ink-2:#b4b9c4;--rule:#252832;--acc:#818cf8;--warn:#f97066}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px 26px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
h1{font-size:14px;font-weight:600;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
p{margin:0;color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--acc);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err h1{color:var(--warn)}.err .spin{display:none}
pre{margin:12px 0 0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
pre:empty{display:none}
</style></head>
<body>
<main><div class="card" id="card">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>kiroku</div>
  <h1><span class="spin" aria-hidden="true"></span><span id="title">Reading your history…</span></h1>
  <p id="note" aria-live="polite">The first read can take a while with a lot of history. This page opens the view as soon as it is ready.</p>
  <pre id="detail"></pre>
</div></main>
<script>
// 1 秒ごとに stamp を見て、読み終わったら本物の画面に読み直す。503 の本文があれば読み込みの失敗
(() => {
  const card = document.getElementById("card"), title = document.getElementById("title"),
    note = document.getElementById("note"), detail = document.getElementById("detail"),
    wait = [title.textContent, note.textContent];
  const show = (err, t, n, d) => { card.classList.toggle("err", err); title.textContent = t; note.textContent = n; detail.textContent = d || ""; };
  async function poll(){
    try {
      const r = await fetch("stamp", {cache:"no-store"});
      if (r.ok){ location.reload(); return; }
      const t = (await r.text()).trim();
      if (r.status === 503 && t) show(true, "Could not read your history", "kiroku serve keeps running and tries again when your history changes. You can also stop it and run it again.", t);
      else show(false, wait[0], wait[1]);
    } catch(e){
      show(true, "Not connected to kiroku serve", "If you stopped it, start it again; this page reconnects on its own.");
    }
    setTimeout(poll, 1000);
  }
  poll();
})();
</script>
</body></html>
