<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>kiroku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%23818cf8'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23fff'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<style>
/* kiroku serve が最初の読み込みを終えるまで出す画面。外のものは読まない。
   エージェントごとの進み具合（/progress）を並べ、読み終わったものから件数と時間を出す */
:root{color-scheme:light;--bg:#f3f4f6;--surface:#ffffff;--ink:#121419;--ink-2:#464b56;--ink-3:#5f6573;--rule:#e1e4ea;--acc:#4338ca;--warn:#b42318;
  --glow:rgba(67,56,202,.16);--shadow:0 1px 2px rgba(16,18,24,.06),0 24px 48px -20px rgba(16,18,24,.28);
  --c0:#0072b2;--c2:#009e73;--c3:#cc79a7;--c5:#56b4e9;--c6:#7a5cc4;--other:#9aa0ab;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e0f13;--surface:#16181e;--ink:#eceef3;--ink-2:#b4b9c4;--ink-3:#8c92a0;--rule:#252832;--acc:#818cf8;--warn:#f97066;
  --glow:rgba(129,140,248,.22);--shadow:0 1px 2px rgba(0,0,0,.5),0 28px 60px -24px rgba(0,0,0,.8);
  --c0:#3a9be0;--c2:#1fbf8f;--c3:#e08fbd;--c5:#7cc6f0;--c6:#9c84e6;--other:#6b7180}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(60vmax 40vmax at 50% -10%,var(--glow),transparent 70%),var(--bg)}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{position:relative;max-width:440px;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:26px 26px 22px;box-shadow:var(--shadow);overflow:hidden;animation:rise .5s var(--ease) both}
/* 上のふちを流れる光（読んでいるあいだ） */
.card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 1.6s var(--ease) infinite}
.done .card::before{animation:none;background:var(--acc);background-size:100% 100%;transition:background .3s}
.err .card::before{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{width:28px;height:28px;overflow:visible}
/* ロゴの 3 本の棒が、記録を書いていくように伸び縮みする */
.brand .b{transform-box:fill-box;transform-origin:left center;animation:write 1.8s var(--ease) infinite}
.brand .b2{animation-delay:.18s}.brand .b3{animation-delay:.36s}
.done .brand .b,.err .brand .b{animation:none}
.clock{font:500 12px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
h1{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:20px 0 4px}
p{margin:0;color:var(--ink-2)}
.err h1{color:var(--warn)}
/* エージェントの行 */
ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:2px}
ul:empty{display:none}
li{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;animation:rise .4s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
li.ok{background:color-mix(in oklab,var(--c) 7%,transparent)}
.dot{position:relative;width:10px;height:10px;margin:auto;border-radius:50%;background:var(--c)}
li.wait .dot,li.none .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
li.none .dot{opacity:.5}
li.wait .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c);animation:spin .8s linear infinite}
li.ok .dot{animation:pop .45s var(--ease)}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font:12px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
li.ok .stat{color:var(--ink-2)}
li.ok .stat b{font-weight:600;color:var(--ink)}
li.none .name,li.none .stat{color:var(--ink-3)}
li.none{background:transparent}
.shim{display:inline-block;width:64px;height:8px;border-radius:4px;vertical-align:middle;background:linear-gradient(90deg,var(--rule) 0,color-mix(in oklab,var(--c) 45%,var(--rule)) 50%,var(--rule) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
/* 段階（履歴 → git → 画面） */
ol{display:flex;gap:6px;list-style:none;margin:18px 0 0;padding:0}
ol li{display:flex;align-items:center;gap:6px;padding:0;background:none;animation:none;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
ol li+li::before{content:"";width:14px;height:1px;background:var(--rule)}
ol li.now{color:var(--acc)}
ol li.past{color:var(--ink-2)}
.err ol{display:none}
pre{margin:14px 0 0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
pre:empty{display:none}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes write{0%{transform:scaleX(.25);opacity:.5}45%,70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.25);opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<main><div class="card" id="card">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect class="b b1" x="6" y="8" width="13" height="4" rx="2" fill="var(--acc)"/><rect class="b b2" x="11" y="14" width="15" height="4" rx="2" fill="var(--bg)"/><rect class="b b3" x="6" y="20" width="9" height="4" rx="2" fill="var(--bg)" opacity=".55"/></svg>kiroku</div>
    <span class="clock" id="clock" aria-hidden="true"></span>
  </div>
  <h1 id="title">Reading your history…</h1>
  <p id="note" aria-live="polite">The first read can take a while with a lot of history. This page opens the view as soon as it is ready.</p>
  <ul id="agents" aria-label="Agents"></ul>
  <ol id="stages" aria-label="Steps"><li data-s="history">History</li><li data-s="git">Git</li><li data-s="view">View</li></ol>
  <pre id="detail"></pre>
</div></main>
<script>
// 1 秒ごとに stamp を見て、読み終わったら本物の画面に読み直す。503 の本文があれば読み込みの失敗。
// あいだは /progress を見て、エージェントごとの進み具合を出す（名前と数だけ。文字は textContent で入れる）
(() => {
  const $ = id => document.getElementById(id);
  const card = $("card"), title = $("title"), note = $("note"), detail = $("detail"), list = $("agents"), clock = $("clock"),
    wait = [title.textContent, note.textContent];
  // エージェントの色は本物の画面と同じ（format.js の AG_SLOT）
  const SLOT = {"Claude Code": 0, "Codex": 2, "Kiro IDE": 6, "Kiro IDE (legacy)": 6, "Kiro CLI": 5, "Kiro CLI (SQLite)": 5, "Amazon Q": 5, "Kiro Crew": 3};
  const color = n => n in SLOT ? `var(--c${SLOT[n]})` : "var(--other)";
  const ms = v => v < 1000 ? `${v}ms` : `${(v/1000).toFixed(1)}s`;
  const show = (err, t, n, d) => { document.body.classList.toggle("err", err); title.textContent = t; note.textContent = n; detail.textContent = d || ""; };
  const rows = {};
  function row(a, i){
    let r = rows[a.name];
    if (!r){
      r = rows[a.name] = document.createElement("li");
      r.style.setProperty("--c", color(a.name)); r.style.setProperty("--i", i);
      const dot = document.createElement("span"), name = document.createElement("span"), stat = document.createElement("span");
      dot.className = "dot"; name.className = "name"; stat.className = "stat";
      name.textContent = a.name;
      r.append(dot, name, stat); list.append(r);
      r.stat = stat; r.classList.add("wait");
    }
    if (!a.done){
      if (!r.stat.firstChild) { const s = document.createElement("span"); s.className = "shim"; r.stat.append(s); }
      return;
    }
    if (r.classList.contains("ok") || r.classList.contains("none")) return;
    r.classList.remove("wait"); r.classList.add(a.n ? "ok" : "none");
    r.stat.textContent = "";
    if (a.n){
      const b = document.createElement("b"); b.textContent = a.n.toLocaleString("en-US");
      r.stat.append(b, ` ${a.n === 1 ? "session" : "sessions"} · ${ms(a.ms)}`);
    } else r.stat.textContent = "no history";
  }
  let base = 0, at = performance.now(), live = true;
  function tick(){ if (live){ clock.textContent = ms(Math.round(base + performance.now() - at)); requestAnimationFrame(tick); } }
  async function progress(){
    try {
      const r = await fetch("progress", {cache:"no-store"});
      if (!r.ok) return;
      const p = await r.json();
      base = p.ms || 0; at = performance.now();
      (p.agents || []).forEach(row);
      const order = ["history", "git", "view"], k = order.indexOf(p.stage);
      document.querySelectorAll("#stages li").forEach((li, i) => { li.classList.toggle("now", i === k); li.classList.toggle("past", i < k); });
    } catch(e){}
  }
  async function poll(){
    try {
      const r = await fetch("stamp", {cache:"no-store"});
      if (r.ok){ live = false; document.body.classList.add("done"); title.textContent = "Ready"; setTimeout(() => location.reload(), 250); return; }
      const t = (await r.text()).trim();
      if (r.status === 503 && t){ live = false; show(true, "Could not read your history", "kiroku serve keeps running and tries again when your history changes. You can also stop it and run it again.", t); }
      else { live || (live = true, requestAnimationFrame(tick)); show(false, wait[0], wait[1]); }
    } catch(e){
      live = false;
      show(true, "Not connected to kiroku serve", "If you stopped it, start it again; this page reconnects on its own.");
    }
    await progress();
    setTimeout(poll, 400);
  }
  requestAnimationFrame(tick);
  poll();
})();
</script>
</body></html>
